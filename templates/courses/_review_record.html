
<div class="review-records-container">
    <!-- 查询表单 -->
    <div class="review-header-record">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 4px;">
            <!-- 复习集名称搜索 -->
            <div style="display: flex; align-items: center; gap: 4px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;">复习集名称</label>
                <input type="text" class="ant-input" name="name" placeholder="输入复习集名称">
            </div>
            
            <!-- 创建时间范围 -->
            <div style="display: flex; align-items: center; gap: 4px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;">创建时间</label>
                <input type="date" class="ant-input" name="created_at_start" placeholder="开始日期" style="margin-bottom: 0;width: 140px!important;">
                <span>至</span>
                <input type="date" class="ant-input" name="created_at_end" placeholder="结束日期" style="margin-bottom: 0;width: 140px!important;">
            </div>
            
            <!-- 完成状态 -->
            <div style="display: flex; align-items: center; gap: 4px;">
                <label class="ant-form-item-label" >完成次数</label>
                <select class="ant-input" name="completion_count" style="margin-bottom: 0;width: 100px!important;">
                    <option value="">全部</option>
                    <option value="0">未完成</option>
                    <option value="1">1次</option>
                    <option value="2">2次</option>
                    <option value="3">3次</option>
                    <option value="4">其他</option>
                </select>
            </div>
            <div style="display:none; ">
                <input type="hidden" name="chapter_id">
            </div>
            <!-- 操作按钮 -->
            <button type="submit" class="ant-btn ant-btn-primary" id="submit_record">查询</button>
            <a href="?" class="ant-btn">重置</a>
        </form>
    </div>
    
    <!-- 复习集列表表格 -->
    <div id="review-record-table" key={review_record_tableKey}></div>
</div>

<script>
// 表格列配置
const reviewColumns_record = [
    {
        title: '名称',
        dataIndex: 'name',
        key: 'name',
        sorter: (a, b) => a.name.localeCompare(b.name)
    },
    {
        title: '创建时间',
        dataIndex: 'created_at',
        key: 'created_at',
        render: (text) => new Date(text).toLocaleString()
    },
    {
        title: '完成次数',
        dataIndex: 'completion_count',
        key: 'completion_count'
    },
    {
        title: '操作',
        dataIndex: 'actions',
        key: 'actions',
        render: (actions) => [
            React.createElement('button', {
                className: 'ant-btn ant-btn-text',
                onClick: () => viewReviewSet(actions[0].id)
            }, [
                React.createElement('i', {className: 'anticon anticon-eye'}),
                ' 查看'
            ]),
            React.createElement('button', {
                className: 'ant-btn ant-btn-text ant-btn-dangerous',
                onClick: () => deleteReviewSet(actions[2].id)
            }, [
                React.createElement('i', {className: 'anticon anticon-delete'}),
                ' 删除'
            ])
        ]
    }
];

// 加载复习集数据
function loadReviews_record(params = {}) {
    forceRerender_record(); // 强制重建组件

    const container = document.getElementById('review-record-table');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams_record = {
        name: params.name || '',
        created_at_start: params.created_at_start || '',
        created_at_end: params.created_at_end || '',
        completion_count: params.completion_count || '',
        chapter_id: document.body.dataset.chapterId,
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams_record = new URLSearchParams(defaultParams_record).toString();
    
    fetch(`{% url 'courses:review-set-list' %}?${queryParams_record}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(responseData => {
        // 处理直接返回数组的情况
        let reviewData = Array.isArray(responseData) ? responseData : (responseData.results || []);
        const totalCount = responseData.count || reviewData.length;
        
        // 确保分页数据存在
        const paginationData = {
            current: defaultParams_record.page || 1,
            pageSize: defaultParams_record.page_size,
            total: totalCount,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadReviews_record({...params, page, page_size: pageSize});
            }
        };
        
        window.reviewData = reviewData; // 保存数据到全局变量
        
        // 格式化数据
        const formattedData = reviewData.map(review => ({
            key: review.id,
            name: review.name,
            chapter_title: review.chapter_title,
            chapter_id: review.chapter_id,
            created_at: review.created_at,
            completion_count: review.completion_count,
            actions: [
                { type: 'view', id: review.id },
                { type: 'complete', id: review.id },
                { type: 'delete', id: review.id }
            ]
        }));
        
        // 渲染表格
        ReactDOM.render(
            React.createElement(antd.Table, {
                columns: reviewColumns_record,
                dataSource: formattedData,
                bordered: true,
                pagination: paginationData
            }),
            container
        );
    })
    .catch(error => {
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button onclick="loadReviews_record()">重试</button>
            </div>
        `;
    });
}

// 表格实例管理
let review_record_tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender_record() {
    review_record_tableKey = Date.now(); // 更新key值
    const container = document.getElementById('review-record-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 查看复习集
function viewReviewSet(reviewSetId) {
    // 使用Django模板标签生成基础URL，确保URL正确
    const baseUrl = `{% url 'courses:review-set-detail' 0 %}`.replace('0', reviewSetId);
    window.open(baseUrl, '_blank');
}

// 删除复习集
function deleteReviewSet(reviewSetId) {
    if (confirm('确定要删除这个复习集吗？')) {
        fetch(`{% url 'courses:review-set-detail' 0 %}`.replace('0', reviewSetId), {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                loadReviews_record(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}

// 表单提交处理
document.querySelector('.review-header-record form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadReviews_record(params);
});

// 重置按钮处理
document.querySelector('.review-header-record form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.review-header-record form').reset();
    loadReviews_record(); // 加载无参数的全量数据
});

// 确保React和antd加载完成
function checkDependencies() {
    if (window.React && window.antd && window.ReactDOM) {
        loadReviews_record(); // 初始加载数据
    } else {
        setTimeout(checkDependencies, 100);
    }
}

// 检查依赖
checkDependencies();
</script>

<style>
.review-records-container {
    padding: 0px;
    background: #fff;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
}

.review-header-record {
    margin-bottom: 24px;
}

.ant-table {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

.ant-table-thead > tr > th {
    background: #fafafa;
    color: rgba(0,0,0,0.85);
    font-weight: 500;
}

.ant-table-tbody > tr:hover > td {
    background: #fafafa !important;
}

.ant-btn-dangerous {
    color: #ff4d4f;
}

.ant-btn-dangerous:hover {
    color: #ff7875;
}
</style>
