
{% extends "base.html" %}

{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>

<div class="exercise-set-detail-container">
    <h1>{{ exercise_set.name }}</h1>
    <h3>基本信息</h3>
    <div class="exercise-set-info">
        <p><strong>所属章节:</strong> {{ exercise_set.chapter.title }}</p>
        <p><strong>创建时间:</strong> {{ exercise_set.created_at|date:"Y-m-d H:i" }}</p>
        <p><strong>建议完成时间:</strong> {{ exercise_set.suggested_time }} 分钟</p>
        <p><strong>完成次数:</strong> {{ exercise_set.completion_count }}</p>
    </div>

    <div class="exercises-list">
        <div class="exercise-set-list-header">
            <h3>习题</h3>
            <div class="actions">
                <button type="primary" class="ant-btn ant-btn-primary" id="add_exercise">添加习题</button>
                <button class="ant-btn" onclick="loadExercises_record_detail()">重新加载</button>
                <button class="ant-btn ant-btn-primary" onclick="startExerciseSet()">开始练习</button>
                <button class="ant-btn ant-btn-primary" onclick="startExerciseSet_quick()">记忆测试</button>
            </div>
        </div>
        <div id="exercises-record-table"></div>
    </div>
</div>

<script>

// 确保所有依赖加载完成后再初始化
function checkDependencies_record_detail() {
    const required = ['React', 'ReactDOM', 'antd'];
    const loaded = required.every(lib => window[lib]);
    
    if (loaded) {
        console.log('所有依赖已加载完成');
        initExercisesPage_record_detail();
    } else {
        console.log('等待依赖加载...', {
            React: !!window.React,
            ReactDOM: !!window.ReactDOM,
            antd: !!window.antd
        });
        setTimeout(checkDependencies_record_detail, 100);
    }
}

// 添加全局错误处理
window.addEventListener('error', function(e) {
    if (e.message.includes('ReactDOM')) {
        console.error('ReactDOM未正确加载，请检查引入顺序');
    }
});
// 暴露初始化函数
window.initExercisesPage_record_detail = async function() {
    console.log('初始化习题页');
    await loadExercises_record_detail();
    return true;
};

// 表格实例管理
let exercise_record_detailKey = Date.now();  // 初始化一个基于时间戳的key
let reactRoot = null;

function forceRerender_record_detail() {
    exercise_record_detailKey = Date.now(); // 更新key值
    const container = document.getElementById('exercises-record-table');
    
    if (!container) {
        console.warn('目标容器不存在');
        return;
    }
    
    try {
        // 安全卸载组件
        if (reactRoot) {
            ReactDOM.unmountComponentAtNode(container);
        }
        // 清空容器内容
        container.innerHTML = '';
    } catch (error) {
        console.error('卸载组件时出错:', error);
        container.innerHTML = '<div class="error-message">组件渲染错误，请刷新页面</div>';
    }
}
// 加载习题集包含的习题
function loadExercises_record_detail() {
    const container = document.getElementById('exercises-record-table');
    if (!container) {
        console.error('无法找到表格容器');
        return;
    }

    // 显示加载状态
    container.innerHTML = '<div class="loading-spinner">加载中...</div>';

    // 清理之前的React实例
    try {
        if (reactRoot) {
            ReactDOM.unmountComponentAtNode(container);
            reactRoot = null;
        }
    } catch (error) {
        console.warn('清理旧实例时出错:', error);
    }

    fetch(`{% url 'courses:exercise-set-exercises' exercise_set.id %}`)
    .then(response => {
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        if (!Array.isArray(data)) {
            throw new Error('无效的响应数据格式');
        }

        const columns = [
            {
                title: '序号',
                dataIndex: 'id',
                key: 'id'
            },
            {
                title: '题目',
                dataIndex: 'title',
                key: 'title',
                render: text => React.createElement('div', {
                    dangerouslySetInnerHTML: {__html: text}
                })
            },
            {
                title: '题型',
                dataIndex: 'question_type_display',
                key: 'question_type_display'
            },
            {
                title: '题目',
                dataIndex: 'content',
                key: 'content',
                render: text => React.createElement('div', {
                    className: 'rich-text-content',
                    dangerouslySetInnerHTML: {__html: text}
                })
            },
            {
                title: '难度',
                dataIndex: 'difficulty',
                key: 'difficulty'
            },
            {
                title: '操作',
                key: 'action',
                render: (text, record) => (
                    React.createElement('span', null,
                        React.createElement('button', {
                            className: 'ant-btn ant-btn-link',
                            onClick: () => deleteSetExercise(record.id)
                        }, '删除'),

                        React.createElement('button', {
                            className: 'ant-btn ant-btn-link',
                            onClick: () => {
                                const url = `/courses/exercises/${record.id}/view/`;
                                const win = window.open(url, '_blank');
                                win.focus();
                            }
                        }, '查看')
                    )
                )
            }
        ];

        // 创建新的React根实例
        reactRoot = ReactDOM.createRoot(container);
        reactRoot.render(
            React.createElement(antd.Table, {
                columns: columns,
                dataSource: data,
                rowKey: 'id',
                bordered: true
            })
        );
    })
    .catch(error => {
        console.error('加载习题失败:', error);
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button onclick="loadExercises_record_detail()" class="ant-btn ant-btn-link">重试</button>
            </div>
        `;
    });
}
// 添加习题
document.getElementById('add_exercise').addEventListener('click', () => {
    // 使用antd的Modal组件
    const modal = antd.Modal.confirm({
        title: '添加习题到习题集',
        content: React.createElement('div', null,
            React.createElement('textarea', {
                className: 'ant-input',
                placeholder: '请输入习题ID，限一个，正整数',
                style: {width: '100%', minHeight: '100px'}
            })
        ),
        okText: '添加',
        cancelText: '取消',
        onOk: () => {
            const input = document.querySelector('.ant-modal-body textarea');
            const ids = input.value.split(/[\n,]/)
                .map(id => id.trim())
                .filter(id => id !== '');
            
            if (ids.length === 0) {
                antd.message.error('请输入一个习题ID');
                return false;
            }
            
            if (ids.some(id => isNaN(id) || id <= 0 || !Number.isInteger(Number(id)))) {
                antd.message.error('习题ID必须是正整数');
                return false;
            }

            fetch(`{% url 'courses:exercise-set-exercise-add' exercise_set.id %}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ exercise_ids: ids })
            })
            .then(response => {
                if (!response.ok) throw new Error(`请求失败: ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    antd.message.success(`成功添加 ${data.added_count || ids.length} 个习题`);
                    loadExercises_record_detail();
                } else {
                    antd.message.error(data.message || '添加失败');
                }
            })
            .catch(error => {
                antd.message.error('添加失败: ' + error.message);
            });
        },
        onCancel: () => {
            modal.destroy();
        }
    });
});
// 删除习题
function deleteSetExercise(exerciseId) {
    antd.Modal.confirm({
        title: '确认删除',
        content: '确定要从习题集中移除这个习题吗？(不会删除习题本身)',
        okText: '确认',
        cancelText: '取消',
        okType: 'danger',
        onOk: () => {
            return new Promise((resolve, reject) => {
                fetch(`/courses/api/exercise-sets/{{ exercise_set.id }}/exercises/${exerciseId}/delete/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({})
                })
                .then(response => {
                    if (!response.ok) throw new Error(`请求失败: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        antd.message.success('删除成功');
                        loadExercises_record_detail();
                        resolve();
                    } else {
                        antd.message.error(data.message || '删除失败');
                        reject();
                    }
                })
                .catch(error => {
                    console.error('删除习题失败:', error);
                    antd.message.error('删除失败: ' + error.message);
                    reject();
                });
            });
        }
    });
}

// 开始练习
function startExerciseSet() {
    window.location.href = `{% url 'courses:exercise-set-start' exercise_set.id %}`;
    
}

// 记忆测试
function startExerciseSet_quick() {
    window.location.href = `{% url 'courses:exercise-set-start-quick' exercise_set.id %}`;
}

// 初始加载
document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM加载完成，开始检查依赖');
    // 检查React和antd是否加载完成
    checkDependencies_record_detail();
});
</script>

<style>
.exercise-set-detail-container {
    padding: 24px;
    width: 100%;
    margin: 0 auto;
}

.exercise-set-info {
    margin: 20px 0;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 4px;
}
.exercise-set-list-header {
    display: flex;              /* 启用弹性布局 */
    justify-content: space-between; /* 左右两端对齐 */
    align-items: center;        /* 垂直居中对齐 */
    gap: 12px;                  /* 元素间距（可选） */
    padding: 8px 16px;          /* 内边距调整（根据需要修改） */
}

.exercise-set-list-header h3 {
    margin: 0;                  /* 去除默认外边距 */
    font-size: 16px;            /* 标题字号 */
    font-weight: 500;           /* 标题粗细 */
}

#add_exercise {
    /* padding: 8px 16px;          按钮内边距 */
    border-radius: 4px;         /* 圆角处理 */
    cursor: pointer;            /* 鼠标悬停手型 */
}

.exercises-list {
    margin: 30px 0;
}

.actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}
/* 富文本内容样式 */
.rich-text-content {
    padding: 12px;
    background-color: #f9f9f9;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
    line-height: 1.6;
    font-size: 14px;
    color: #333;
    max-width: 800px;
}

.rich-text-content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 10px 0;
}

.rich-text-content p {
    margin: 8px 0;
}

.rich-text-content ul, .rich-text-content ol {
    padding-left: 20px;
    margin: 8px 0;
}

.rich-text-content a {
    color: #1890ff;
    text-decoration: none;
}

.rich-text-content a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
