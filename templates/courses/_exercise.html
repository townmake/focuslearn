<div class="exercises-container">

    <!-- 习题查询表单 -->
    <div class="exercises-header" style="margin-bottom: 16px;">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 16px;">
            <!-- 习题标题搜索 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;padding: 0px 0px 2px 2px ">习题标题</label>
                <input type="text" class="ant-input" name="title" placeholder="输入习题标题" value="{{ request.GET.title }}" style="width: fit-content;">
            </div>

            <!-- 更新日期范围 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0; white-space: nowrap;padding: 0px 0px 2px 2px ">更新日期</label>
                <div class="ant-space" style="display: flex; gap: 8px;">
                    <input type="date" class="ant-input" name="update_date_start" value="{{ request.GET.update_date_start }}" style="width: fit-content;">
                    <span>至</span>
                    <input type="date" class="ant-input" name="update_date_end" value="{{ request.GET.update_date_end }}" style="width: fit-content;">
                </div>
            </div>

            <!-- 操作按钮 -->
            <button type="submit" class="ant-btn ant-btn-primary">查询</button>
            <a href="?" class="ant-btn">重置</a>
            <button type="button" class="ant-btn ant-btn-primary" onclick="showExerciseSetModal()">生成练习集</button>
            <button type="button" class="ant-btn" onclick="showCreateMethodModal_ex()">新建方法</button>
            <!-- 返回章节 -->
             <button type="button" class="ant-btn ant-btn-primary" onclick="BackToChapter1()">返回章节</button>

        </form>
    </div>

    <div class="exercises-logo" style="margin-bottom: 0px;">
        <label class="label-log" style="margin-bottom: 0;width: 200px;" id="choose-log">选中习题：无</label>
    </div>
    <!-- 习题列表表格 -->
    <div id="Exercises-table" key={exercises_tableKey}></div>
</div>





<script>

// 表格列配置

function editExercise(exerciseId) {
    window.open(`/static/courses/exercise_edit.html?id=${exerciseId}`, '_blank');
}

function viewExercise(exerciseId) {
    window.open(`{% url 'courses:exercise_view' 0 %}`.replace('0', exerciseId), '_blank');
}


// 加载习题数据
function loadExercises(params = {}) {
    forceRerender_exercises(); // 强制重建组件

    const container = document.getElementById('Exercises-table');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams = {
        chapter_id: document.body.dataset.chapterId,
        title: params.title || '',
        update_date_start: params.update_date_start || '',
        update_date_end: params.update_date_end || '',
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams = new URLSearchParams(defaultParams).toString();
    //发送请求获取数据
    fetch(`{% url 'courses:exercises_list' %}?${queryParams}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        // 确保分页数据存在
        const paginationData = {
            current: data.current_page || 1,
            pageSize: defaultParams.page_size,
            total: data.count || data.results?.length || 0,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadExercises({...params, page, page_size: pageSize});
            }
        };
        
        // 确保数据结构正确
        const exerciseData = data.results ? data.results : (Array.isArray(data) ? data : []);
        window.exerciseData = exerciseData || [];
        
        try {
            // 确保React和antd已加载
            if (!window.React || !window.React.createElement || !window.antd || !window.antd.Table) {
                throw new Error('React或antd库未正确加载');
            }

            // 显示加载状态
            container.innerHTML = '<div class="loading-spinner">加载中...</div>';

            // 安全格式化数据
            const formattedData = Array.isArray(exerciseData) 
                ? exerciseData.map(doc => ({
                    id: doc?.id || 0,
                    question_type: doc?.question_type_display || '未知题型',
                    title: doc?.title || '无标题',
                    correct_count: doc?.correct_count || 0,
                    wrong_count: doc?.wrong_count || 0,
                    dificulty: doc?.difficulty || 0,
                    memory: doc?.memory_level || 0,
                    mastery: doc?.mastery_level || 0,
                    updateAt: doc?.updated_at || new Date().toISOString(),
                    actions: [
                        { type: 'edit', id: doc?.id || 0 },
                        { type: 'delete', id: doc?.id || 0 },
                        { type: 'view', id: doc?.id || 0 }
                    ]
                }))
                : [];

            // 延迟渲染确保稳定性
            setTimeout(() => {
                ReactDOM.render(
                    React.createElement(antd.Table, {
                        columns: exerciseColumns,
                        dataSource: formattedData,
                        bordered: true,
                        pagination: paginationData,
                        loading: false,
                        locale: {
                            emptyText: '暂无数据，点击刷新',
                            emptyTextStyle: { cursor: 'pointer' }
                        },
                        onEmptyTextClick: () => loadExercises(params)
                    }),
                    container
                );
            }, 100);
        } catch (error) {
            container.innerHTML = `
                <div class="error-message">
                    渲染错误: ${error.message}
                    <button onclick="loadExercises()">重试</button>
                </div>
            `;
        }
    })
    .catch(error => {
        console.error('加载习题列表失败:', error);
        container.innerHTML = `
            <div class="error-message">
                <p>加载失败: ${error.message}</p>
                <button class="ant-btn ant-btn-primary" onclick="loadExercises(${JSON.stringify(params)})">
                    <i class="anticon anticon-reload"></i> 重试
                </button>
                <p>如持续失败，请联系管理员</p>
            </div>
        `;
    });
}

// 创建方法
function createMethod_ex(values) {
    const chapterId = document.body.dataset.chapterId;
    const data_mt = {
        ...values,
        chapter: chapterId,
        exercise_ids: selectedExercises
    };
    console.log(data_mt);
    fetch('{% url "courses:method_create" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(data_mt)
    })
    .then(response => {
        if (response.ok) {
            return response.json().then(data => {
                antd.message.success('方法创建成功');
                selectedExercises = []; // 清空已选习题
                // 确保返回数据包含方法ID
                if (data && data.id) {
                    console.log('方法：', data);
                    const url = `{% url 'courses:method_detail' 0 %}`.replace('0', data.id);
                    console.log('URL:', url);
                    window.location.href = url;

                } else {
                    console.log('方法ID:', data);

                    // 回退到习题列表页
                    antd.Modal.destroyAll();
                    // 重新加载习题列表
                    loadExercises({ page: 1, page_size: 10 });

                }
            });
        }
        return response.json().then(err => {
            throw new Error(err.message || '创建失败');
        });
    })
    .catch(error => {
        console.error('创建方法失败:', error);
        antd.message.error(error.message || '创建方法失败');
    });
}

// 创建练习集
function handleCreateExerciseSet(values) {
    const chapterId = document.body.dataset.chapterId;
    const data = {
        ...values,
        chapter: chapterId,
        exercise_ids: selectedExercises
    };

    fetch('{% url "courses:create_exercise_set" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (response.ok) {
            return response.json().then(data => {
                antd.message.success('练习集创建成功');
                selectedExercises = [];

                antd.Modal.destroyAll();
                // 重新加载习题列表
                loadExercises({ page: 1, page_size: 10 });
            });
        }
        return response.json().then(err => {
            throw new Error(err.message || '创建失败');
        });
    })
    .catch(error => {
        console.error('Error:', error);
        antd.message.error('请求失败');
    });
}

// 表格实例管理
let exercises_tableKey = Date.now();  // 初始化一个基于时间戳的key
let selectedExercises = [];

// 处理复选框选中
function handleSelectExercise(id) {
    console.group('handleSelectExercise');
    const wasSelected = selectedExercises.includes(id);
    if (wasSelected) {
        console.log(`取消选中习题 ID: ${id}`);
        selectedExercises = selectedExercises.filter(item => item !== id);
    } else {
        console.log(`选中习题 ID: ${id}`);
        selectedExercises = [...selectedExercises, id];
    }
    console.log('当前选中习题:', selectedExercises);
    const checklog = document.getElementById('choose-log');
    if (checklog) {
        checklog.innerHTML = `选中习题: ${selectedExercises.join(', ')}`;
    } else {
        console.error('元素不存在，无法更新选中习题日志');
    }
    console.groupEnd();
    updateSelectionStyles();
}

// 更新选中状态样式
function updateSelectionStyles() {
    const container = document.getElementById('Exercises-table');
    if (!container) return;

    const rows = container.querySelectorAll('tr[data-row-key]');
    rows.forEach(row => {
        const rowId = parseInt(row.getAttribute('data-row-key'));
        if (isNaN(rowId)) return;

        const checkbox = row.querySelector('.ant-checkbox-wrapper');
        const input = row.querySelector('.ant-checkbox-input');
        console.log(`Updated row ${rowId}`, {checked: isChecked});

        if (checkbox && input) {
            const isChecked = selectedExercises.includes(rowId);
            input.checked = isChecked;
            checkbox.classList.toggle('ant-checkbox-checked', isChecked);
            console.log(`Updated row2 ${rowId}`, {checked: isChecked});
        }
    });
}



function forceRerender_exercises() {
    exercises_tableKey = Date.now(); // 更新key值
    const container = document.getElementById('Exercises-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 菜单切换事件
document.querySelector('[data-target="exercise-set"]')?.addEventListener('click', () => {
    const form = document.querySelector('.exercises-header form');
    const params = {
        title: form.querySelector('[name="title"]').value,
        update_date_start: form.querySelector('[name="update_date_start"]').value,
        update_date_end: form.querySelector('[name="update_date_end"]').value
    };
    loadExercises(params);  // 重新加载文档数据
});

// 表单提交处理
document.querySelector('.exercises-header form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadExercises(params);
});

// 重置按钮处理
document.querySelector('.exercises-header form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.exercises-header form').reset();
    loadExercises(); // 加载无参数的全量数据
});

// 页面卸载时清理
window.addEventListener('beforeunload', () => {
    const container = document.getElementById('Exercises-table');
    ReactDOM.unmountComponentAtNode(container);
});

// 暴露初始化函数
window.initExercisesPage = async function() {
    console.log('初始化习题页');
    await loadExercises();
    return true;
};

// 确保React和antd加载完成后再初始化
function checkDependencies() {
    if (window.React && window.antd && window.ReactDOM) {
        initExercisesPage();
    } else {
        setTimeout(checkDependencies, 100);
    }
}

// 初始加载
if (document.getElementById('exercise-set')?.classList?.contains('active')) {
    checkDependencies();
}


// 删除习题
function deleteExercise(exerciseId) {
    if (confirm('确定要删除这个文档吗？')) {
        fetch(`{% url 'courses:exercise_delete' 0 %}`.replace('0', exerciseId), {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ exercise_id: exerciseId })
        })
        .then(response => {
            if (response.ok) {
                loadExercises(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}
