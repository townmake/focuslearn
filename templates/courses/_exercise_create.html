    <form id="exerciseForm" class="ant-form-ex ant-form-vertical">

        </div>

                </div>
            </div>
        </div>

        </div>
        <div class="ant-form-item-ex">

// 将选项文本转换为JSON格式
function convertOptionsToJson() {
    const inputText = document.getElementById('options').value.trim();
    if (!inputText) return;
    
    // 先尝试按分号分割，再按换行分割
    const optionParts = inputText.split(/[;\n]/).filter(part => part.trim());
    const options = {};
    
    optionParts.forEach(part => {
        // 尝试匹配数学选择题格式：(A)选项内容
        const mathMatch = part.match(/^\(([A-D])\)\s*([^;]*)/);
        if (mathMatch) {
            const key = mathMatch[1].toUpperCase();
            const value = mathMatch[2].trim();
            if (value) {
                options[key] = value;
            }
        } 
        // 匹配英文格式：[A] free themes
        else if (part.match(/^\[([A-D])\]/)) {
            const key = part[1].toUpperCase();
            const value = part.substring(3).trim();
            if (value) {
                options[key] = value;
            }
        }
        // 匹配常规中文格式：A. 或 A 开头的选项
        else {
            const matches = part.matchAll(/([A-D])[\.\s]+\s*([^;]*)/g);
            for (const match of matches) {
                const key = match[1].toUpperCase();
                const value = match[2].trim();
                if (value) {
                    options[key] = value;
                }
            }
        }
    });
    
    if (Object.keys(options).length > 0) {
        const jsonStr = JSON.stringify(options, null, 2);
        document.getElementById('options').value = jsonStr;
    } else {
        alert('未识别到有效选项格式，请使用类似格式：\nA.选项内容\nB.选项内容\n或\nA 选项内容;B 选项内容\n或数学选择题格式：\n(A)选项内容\n(B)选项内容\n或英文格式：\n[A] free themes\n[B] casual style');
    }
}
// 返回章节
function backToChapter() {
    const chapterId = document.body.dataset.chapterId;
    if (chapterId) {
        window.location.href = `/courses/chapter/${chapterId}/detail/`;
    } else {
        alert('章节ID未设置，请检查页面数据。');
    }
}

// 显示导入模态框
function showImportModal() {
    document.getElementById('importModal').style.display = 'block';
}

// 隐藏导入模态框
function hideImportModal() {
    document.getElementById('importModal').style.display = 'none';
}

// 提交导入
function submitImport() {
    const fileInput = document.getElementById('importFile');
    if (!fileInput.files.length) {
        alert('请选择文件');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    fetch("{% url 'courses:exercise_import' %}", {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert(data.message);
            hideImportModal();
            loadExercises(); // 刷新列表
        } else {
            alert(data.message);
        }
    })
    .catch(error => {
        alert('导入失败: ' + error);
    });
}

// 文件选择变化
document.getElementById('importFile').addEventListener('change', function(e) {
    const fileName = document.getElementById('fileName');
    if (this.files.length) {
        fileName.textContent = this.files[0].name;
    } else {
        fileName.textContent = '';
    }
});

// 知识点自动补全相关
document.addEventListener('DOMContentLoaded', function() {
    const tagsInput = document.getElementById('tags');
    const suggestionsContainer = document.getElementById('tags-suggestions');
    const suggestionsList = suggestionsContainer.querySelector('ul');
    const chapterId = document.body.dataset.chapterId; // 假设章节ID存储在data-chapter-id属性中
    
    // 显示建议列表
    function showSuggestions() {
        suggestionsContainer.style.display = 'block';
    }
    
    // 隐藏建议列表
    function hideSuggestions() {
        suggestionsContainer.style.display = 'none';
    }
    
    // 清除建议列表
    function clearSuggestions() {
        suggestionsList.innerHTML = '';
    }
    
    // 创建建议项
    function createSuggestionItem(point) {
        const li = document.createElement('li');
        li.textContent = `${point.title} (ID:${point.id})`;
        li.dataset.id = point.id;
        li.dataset.title = point.title;
        li.addEventListener('click', function() {
            selectSuggestion(point);
        });
        return li;
    }
    
    // 选择建议项
    function selectSuggestion(point) {
        const currentValue = tagsInput.value;
        const cursorPos = tagsInput.selectionStart;
        const beforeCursor = currentValue.substring(0, cursorPos);
        const afterCursor = currentValue.substring(cursorPos);
        
        // 找到最后一个@的位置
        const lastAtPos = beforeCursor.lastIndexOf('@');
        if (lastAtPos === -1) return;
        
        // 替换@后面的内容
        const newText = beforeCursor.substring(0, lastAtPos) + 
                        `@${point.title} ` + `ID:${point.id} ` +
                        afterCursor;
        
        tagsInput.value = newText;
        tagsInput.focus();
        
        // 移动光标到@后面
        const newCursorPos = lastAtPos + point.title.length + 20; // @ + 标题 + ID + 空格
        tagsInput.setSelectionRange(newCursorPos, newCursorPos);
        
        hideSuggestions();
    }
    
    // 获取建议
    function fetchSuggestions(query) {
        if (!query.startsWith('@')) return;
        
        const searchTerm = query.substring(1).trim();
        if (!searchTerm) {
            clearSuggestions();
            hideSuggestions();
            return;
        }
        
        fetch(`/courses/api/chapters/${chapterId}/search-knowledge-points/?query=${encodeURIComponent(searchTerm)}`)
            .then(response => response.json())
            .then(data => {
                clearSuggestions();
                if (data.length === 0) {
                    hideSuggestions();
                    return;
                }
                
                    data.forEach(point => {
                        const li = createSuggestionItem(point);
                        suggestionsList.appendChild(li);
                    });
                
                    showSuggestions();
            })
            .catch(error => {
                console.error('Error fetching suggestions:', error);
                hideSuggestions();
            });
    }
    
    // 输入防抖处理
    let debounceTimer;
    function isChineseChar(str) {
        return /[\u4e00-\u9fa5]/.test(str);
    }

    // 输入事件处理
    tagsInput.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const value = this.value;
        const cursorPos = this.selectionStart;
        const beforeCursor = value.substring(0, cursorPos);
        
        // 找到最后一个@的位置
        const lastAtPos = beforeCursor.lastIndexOf('@');
        if (lastAtPos === -1) {
            hideSuggestions();
            return;
        }
        
        // 获取@后面的内容作为查询字符串
        const query = beforeCursor.substring(lastAtPos + 1); // 去掉@符号
        
        // 只有当输入包含中文或者输入停止500ms后才触发搜索
        if (isChineseChar(query)) {
            fetchSuggestions('@' + query);
        } else {
            debounceTimer = setTimeout(() => {
                if (query.trim().length > 0) {
                    fetchSuggestions('@' + query);
                }
            }, 500);
        }
    });
    
    // 点击页面其他地方时隐藏建议
    document.addEventListener('click', function(e) {
        if (!suggestionsContainer.contains(e.target) && e.target !== tagsInput) {
            hideSuggestions();
        }
    });
    
});

</script>
{% endblock %}
