
<div class="videos-container">
    <!-- 视频查询表单 -->
    <div class="videos-header">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 16px;">
            <!-- 视频标题搜索 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;">视频标题</label>
                <input type="text" class="ant-input" name="title" placeholder="输入视频标题" value="{{ request.GET.title }}">
            </div>

            <!-- 操作按钮 -->
            <button type="submit-video" class="ant-btn ant-btn-primary">查询</button>
            <a href="?" class="ant-btn">重置</a>
            <button type="button" class="ant-btn ant-btn-primary" onclick="showVideoModal()">新增视频</button>
        </form>
    </div>

    <!-- 视频列表表格 -->
    <div id="videos-table" key={videos_tableKey}></div>
</div>

<!-- 视频编辑弹窗 -->
<div class="doc-modal-mask" id="videoModalMask" style="display:none"></div>
<div class="doc-modal-wrap" id="videoModalWrap" style="display:none">
    <div class="doc-modal" style="width:600px">
        <div class="doc-modal-content">
            <div class="doc-modal-header">
                <div class="doc-modal-title" id="videoModalTitle">新增视频</div>
            </div>
            <div class="doc-modal-body">
                <form id="videoForm" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="video_id" id="videoId">
                    <div class="ant-form-item">
                        <label>视频标题</label>
                        <input type="text" name="title" class="doc-input" id="videoTitle" required>
                    </div>
                    <div class="ant-form-item">
                        <label>视频文件</label>
                        <input type="file" name="video_file" class="doc-input" id="videoFile" accept="video/mp4" required>
                        <input type="hidden" name="url" id="videoUrl">
                    </div>
                    <input type="hidden" name="duration" value="10">  <!-- 默认值，实际值由后端计算 -->
                </form>
            </div>
            <div class="doc-modal-footer">
                <button class="ant-btn" onclick="hideVideoModal()">取消</button>
                <button class="ant-btn ant-btn-primary" onclick="submitVideoForm()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
// 表格列配置
const videoColumns = [
    {
        title: '视频标题',
        dataIndex: 'title',
        key: 'title',
        sorter: (a, b) => a.title.localeCompare(b.title)
    },
    {
        title: '视频链接',
        dataIndex: 'url',
        key: 'url',
        render: (text) => React.createElement('a', {
            href: `/courses/video/player/?url=${encodeURIComponent(text)}`, 
            target: '_blank'
        }, '观看视频')
    },
    {
        title: '时长(分:秒)',
        dataIndex: 'duration',
        key: 'duration',
        render: (text) => `${Math.floor(text/60)}:${(text%60).toString().padStart(2, '0')}`
    },
    {
        title: '操作',
        dataIndex: 'actions',
        key: 'actions',
        render: (actions) => [
            React.createElement('button', {
                className: 'ant-btn ant-btn-text',
                onClick: () => {
                    console.log('编辑按钮点击，视频ID:', actions[0].id);
                    editVideo(actions[0].id);
                }
            }, [
                React.createElement('i', {className: 'anticon anticon-edit'}),
                ' 编辑'
            ]),
            React.createElement('button', {
                className: 'ant-btn ant-btn-text ant-btn-dangerous',
                onClick: () => {
                    console.log('删除按钮点击，视频ID:', actions[1].id);
                    deleteVideo(actions[1].id);
                }
            }, [
                React.createElement('i', {className: 'anticon anticon-delete'}),
                ' 删除'
            ])
        ]
    }
];


// 加载视频数据
function loadVideos(params = {}) {
    forceRerender(); // 强制重建组件

    const container = document.getElementById('videos-table');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams = {
        chapter_id: document.body.dataset.chapterId,
        title: params.title || '',
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams = new URLSearchParams(defaultParams).toString();
    
    fetch(`{% url 'courses:video_list' %}?${queryParams}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(responseData => {
        // 处理直接返回数组的情况
        let videoData = Array.isArray(responseData) ? responseData : (responseData.results || []);
        const totalCount = responseData.count || videoData.length;
        
        // 确保分页数据存在
        const paginationData = {
            current: defaultParams.page || 1,
            pageSize: defaultParams.page_size,
            total: totalCount,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadVideos({...params, page, page_size: pageSize});
            }
        };
        
        window.videoData = videoData; // 保存数据到全局变量
        console.log('视频数据:', videoData, '分页信息:', paginationData);
        
        // 格式化数据
        const formattedData = videoData.map(video => ({
            key: video.id,
            title: video.title,
            url: video.url,
            duration: video.duration,
            actions: [
                { type: 'edit', id: video.id },
                { type: 'delete', id: video.id }
            ]
        }));
        
        // 渲染表格
        ReactDOM.render(
            React.createElement(antd.Table, {
                columns: videoColumns,
                dataSource: formattedData,
                bordered: true,
                pagination: paginationData
            }),
            container
        );
    })
    .catch(error => {
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button onclick="loadVideos()">重试</button>
            </div>
        `;
    });
}

    // 表格实例管理
let videos_tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender() {
    videos_tableKey = Date.now(); // 更新key值
    console.log('强制重新渲染表格组件', videos_tableKey);
    const container = document.getElementById('videos-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 菜单切换事件
document.querySelector('[data-target="videos"]')?.addEventListener('click', () => {
    const form = document.querySelector('.videos-header form');
    const params = {
        title: form.querySelector('[name="title"]').value
    };
    loadVideos(params);
});

// 表单提交处理
document.querySelector('.videos-header form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadVideos(params);
});

// 重置按钮处理
document.querySelector('.videos-header form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.videos-header form').reset();
    loadVideos(); // 加载无参数的全量数据
});

// 页面卸载时清理
window.addEventListener('beforeunload', () => {
    const container = document.getElementById('documents-table');
    ReactDOM.unmountComponentAtNode(container);
});


// 暴露初始化函数
window.initVideosPage = async function() {
    console.log('初始化视频页');
    try {
        await loadVideos();
        return true;
    } catch (error) {
        console.error('视频页初始化失败:', error);
        return false;
    }
};

// 初始加载
if (document.getElementById('videos').classList.contains('active')) {
    initVideosPage();
}

// 视频弹窗控制
function showVideoModal(videoId = null) {
    const modalTitle = document.getElementById('videoModalTitle');
    const form = document.getElementById('videoForm');
    
    if (videoId) {
        modalTitle.textContent = '编辑视频';
        document.getElementById('videoId').value = videoId;
        
        // 填充现有数据
        if (window.videoData) {
            const video = window.videoData.find(v => v.id == videoId);
            if (video) {
                document.getElementById('videoTitle').value = video.title;
                document.getElementById('videoUrl').value = video.url;
                // duration字段已改为隐藏，不再需要设置
            } else {
                console.error('未找到视频数据，ID:', videoId);
            }
        } else {
            console.error('window.videoData未定义');
        }
    } else {
        modalTitle.textContent = '新增视频';
        document.getElementById('videoId').value = '';
        document.getElementById('videoTitle').value = '';
        document.getElementById('videoUrl').value = '';
        // duration字段已改为隐藏，不再需要设置
    }
    
    document.getElementById('videoModalMask').style.display = 'block';
    document.getElementById('videoModalWrap').style.display = 'block';
}

function hideVideoModal() {
    document.getElementById('videoModalMask').style.display = 'none';
    document.getElementById('videoModalWrap').style.display = 'none';
}

function submitVideoForm() {
    const form = document.getElementById('videoForm');
    const submitBtn = document.querySelector('#videoModalWrap .ant-btn-primary');
    const progressContainer = document.createElement('div');
    progressContainer.className = 'upload-progress';
    progressContainer.innerHTML = `
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <div class="progress-text">0%</div>
    `;
    const modalBody = document.querySelector('.doc-modal-body');
    if (modalBody) {
        modalBody.appendChild(progressContainer);
    } else {
        form.appendChild(progressContainer);
    }
    
    const formData = new FormData(form);
    formData.delete('url');
    
    const chapterId = document.body.dataset.chapterId;
    if (chapterId) {
        formData.append('chapter', chapterId);
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="anticon anticon-loading"></i> 保存中...';
    
    const url = form.dataset.videoId ? 
        `{% url 'courses:video_update' 0 %}`.replace('0', formData.get('video_id')) :
        '{% url "courses:video_create" %}';
    
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('X-CSRFToken', '{{ csrf_token }}');
    
    // 进度事件处理
    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressContainer.querySelector('.progress').style.width = percent + '%';
            progressContainer.querySelector('.progress-text').textContent = percent + '%';
        }
    };
    
    xhr.onload = function() {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '保存';
        
        try {
            const response = xhr.responseText ? JSON.parse(xhr.responseText) : {};
            if (xhr.status >= 200 && xhr.status < 300) {
                // 成功状态码范围(200-299)
                hideVideoModal();
                loadVideos();
            } else {
                alert('操作失败: ' + (response.errors ? JSON.stringify(response.errors) : xhr.statusText));
            }
        } catch (e) {
            console.error('解析响应失败:', e);
            if (xhr.status === 201) {
                // 201 Created 即使没有响应体也视为成功
                hideVideoModal();
                loadVideos();
            } else {
                alert('请求出错: ' + xhr.statusText);
            }
        }
    };
    
    xhr.send(formData);
}
// 编辑视频
function editVideo(videoId) {
    showVideoModal(videoId);
}

// 删除视频
function deleteVideo(videoId) {
    if (confirm('确定要删除这个视频吗？')) {
        fetch(`{% url 'courses:video_delete' 0 %}`.replace('0', videoId), {
            method: 'DELETE', // 使用DELETE方法删除视频
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ video_id: videoId })
        })
        .then(response => {
            if (response.ok) {
                loadVideos(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}


</script>

<style>
.videos-container {
    padding: 24px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
}

.videos-header {
    margin-bottom: 24px;
}

.ant-table {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

.ant-table-thead > tr > th {
    background: #fafafa;
    color: rgba(0,0,0,0.85);
    font-weight: 500;
}

.ant-table-tbody > tr:hover > td {
    background: #fafafa !important;
}

.ant-btn-dangerous {
    color: #ff4d4f;
}

.ant-btn-dangerous:hover {
    color: #ff7875;
}

.upload-progress {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.progress-bar {
    flex-grow: 1;
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
}

.progress {
    height: 100%;
    background: #1890ff;
    width: 0%;
    transition: width 0.3s;
}

.progress-text {
    font-size: 12px;
    color: #666;
    min-width: 40px;
    text-align: right;
}

.doc-modal-wrap {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width:50%;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    z-index: 1001;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    display: none;
    overflow: auto;
    max-height: 80%;
}
.doc-modal-mask, .doc-modal-wrap {
    display: none;
}
.doc-modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
}
.doc-modal-title {
    font-size: 18px;
    margin-bottom: 20px;
}
.doc-modal-body {
    margin-bottom: 20px;
}
.doc-modal-footer {
    text-align: right;
}
.doc-input {
    margin-left: 12px;
    width: 88%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
</style>
