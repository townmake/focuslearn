{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/fontawesome-5.15.4-web/css/all.min.css' %}">

<div class="container mt-4">
    <h2>导入子任务事项 - {{ chapter.title }}</h2>
    
    <!-- 图片上传与展示区域 -->
    <div class="row-2-left-right">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h4>上传或粘贴图片</h4>
                </div>
                <div class="card-body">
                    <div class="dropzone" id="image-dropzone">
                        <div class="dz-message">
                            <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                            <p>拖放图片到此处或点击上传</p>
                            <p class="text-muted">支持截图粘贴 (Ctrl+V)</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button id="parse-btn" class="btn btn-primary" disabled>
                            <i class="fas fa-cog"></i> 解析图片
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h4>已上传图片</h4>
                </div>
                <div class="card-body" id="uploaded-images-container">
                    <div class="alert alert-info" id="no-images-alert">
                        暂无上传图片
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OCR原始结果区域 -->
    <div class="card mb-4">
        <div class="card-header">
            <h4>OCR识别结果</h4>
        </div>
        <div class="card-body">
            <textarea id="ocr-result" class="form-control mb-3" rows="8" placeholder="OCR识别结果将显示在这里..."></textarea>
            <button id="generate-tree-btn" class="btn btn-primary" >
                <i class="fas fa-project-diagram"></i> 生成知识树
            </button>
        </div>
    </div>

    <!-- 知识点结构区域 -->
    <div class="card">
        <div class="card-header">
            <h4>知识点结构</h4>
        </div>
        <div class="card-body">
            {% if knowledge_point.id %}
            <input type="checkbox" id="kp-id" value="{{knowledge_point.id}}"> 导入到:{{knowledge_point.title}}</input>
            <small style="color: #888888;">未勾选则导入到章节根目录</small>
            {% endif %}
            <div id="knowledge-tree" class="mb-3"></div>
            <div class="d-flex justify-content-between">
                <button id="add-root-btn" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-plus"></i> 添加根节点
                </button>
                <button id="submit-btn" class="btn btn-success" disabled>
                    <i class="fas fa-save"></i> 提交知识点
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 树形结构编辑模板 -->
<script type="text/html" id="node-template">
    <div class="node-content">
        <input type="text" class="form-control form-control-sm node-title" value="<%= data.title %>">
        <div class="node-actions">
            <button class="btn btn-sm btn-outline-danger btn-delete">
                <i class="fas fa-trash"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary btn-add-child">
                <i class="fas fa-plus"></i> 子节点
            </button>
        </div>
    </div>
</script>

<link rel="stylesheet" href="{% static 'css/dropzone.min.css' %}">
<link rel="stylesheet" href="{% static 'css/jstree/style.min.css' %}">

<style>
    .row-2-left-right {
        display: flex;
        justify-content: space-between;
    }
    h4 {
        font-weight: 600;
        color: #333;
        margin-bottom: 10px;
    }
    .col-md-6 {
        width: 48%;
        min-height: 400px;
    }
    .dropzone {
        border: 2px dashed #1a73e8;
        border-radius: 8px;
        background: #f8faff;
        min-height: 300px;
        padding: 25px;
        text-align: center;
        transition: all 0.3s ease;
    }
    .dropzone:hover {
        border-color: #0d5bbc;
        background: #f0f7ff;
    }
    .dz-message {
        color: #444;
        font-weight: 500;
    }
    .dz-message i {
        color: #1a73e8;
        opacity: 0.9;
        font-size: 2.5rem;
        margin-bottom: 15px;
    }
    .dz-preview .dz-image img {
        opacity: 0.95;
    }
    .dz-details {
        padding: 10px 0;
    }
    .dz-size, .dz-filename {
        font-size: 14px;
        color: #555;
        margin: 5px 0;
    }
    .dz-progress {
        margin: 10px auto;
        width: 80%;
    }
    #knowledge-tree {
        min-height: 300px;
        border: 1px solid #e0e0e0;
        padding: 15px;
        border-radius: 6px;
        background: #fff;
    }
    
    /* 图片显示样式 */
    .dz-image img {
        min-height: 300px;
        object-fit: contain;
        cursor: default;
    }
    .uploaded-image {
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 4px;
        min-height: 300px;
        width: auto;
    }
    .uploaded-image:hover {
        transform: scale(1.02);
        box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    #uploaded-images-container {
        max-height: 500px;
        overflow-y: auto;
    }

    .btn {
        margin-top: 10px;
    }

    /* OCR结果区域样式 */
    #ocr-result {
        width: 90%;
        min-height: 200px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 15px;
        background: #fff;
        resize: vertical;
    }
    #generate-tree-btn {
        display: block;
        width: auto;
    }
    .card-body {
        padding: 20px;
    }
    .node-content {
        display: flex;
        margin-bottom: 8px;
        align-items: center;
    }
    .node-title {
        flex-grow: 1;
        margin-right: 12px;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid #ddd;
    }
    .node-actions .btn {
        padding: 0.3rem 0.6rem;
        margin-left: 5px;
    }
</style>



{% block js %}
<!-- 首先加载jQuery和Bootstrap -->
<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script> -->
<!-- 然后加载依赖jQuery的库 -->
<script src="{% static 'js/dropzone.min.js' %}"></script>
<script src="{% static 'js/jquery.jstree.js' %}"></script>
<script>
$(document).ready(function() {
    // 确保Dropzone CSS已加载
    if (typeof Dropzone === 'undefined') {
        console.error('Dropzone未加载，请检查静态文件路径');
        alert('文件上传功能依赖Dropzone库，请确保已正确加载');
    } else {
        console.log('Dropzone已加载');
        // 初始化Dropzone(改为全局变量)
        window.dropzone = new Dropzone("#image-dropzone", {
            url: "#",
            acceptedFiles: "image/*",
            dictDefaultMessage: "拖放图片到此处或点击上传",
            autoProcessQueue: false,
            addRemoveLinks: true,
            previewsContainer: document.querySelector(".dropzone-previews") || null,
            createImageThumbnails: false, // 禁用缩略图
            init: function() {
                console.log('Dropzone初始化成功');
                
                this.on("addedfile", function(file) {
                    console.log('文件已添加:', file.name);
                    $('#parse-btn').prop('disabled', false);
                    $('.dz-message').hide();
                    $('#no-images-alert').hide();
                    
                    if (file.type.match('image.*')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            $(file.previewElement).find('.dz-image img').attr('src', e.target.result);
                            
                            // 添加到图片展示区
                            const $imageCard = $(`
                                <div class="card mb-3" id="uploaded-image-${file.name.replace(/\./g, '-')}">
                                    <div class="card-body p-2">
                                        <img src="${e.target.result}" class="img-fluid uploaded-image">
                                        <div class="mt-2 text-truncate">${file.name}</div>
                                    </div>
                                </div>
                            `);
                            $('#uploaded-images-container').append($imageCard);
                            
                            // 添加点击预览功能
                            $imageCard.find('.uploaded-image').on('click', function() {
                                const modalContent = `
                                    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
                                        <div class="modal-dialog modal-lg">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h4 class="modal-title">图片预览</h4>
                                                    <button type="button" class="close" data-dismiss="modal">
                                                        <span>&times;</span>
                                                    </button>
                                                </div>
                                                <div class="modal-body text-center">
                                                    <img src="${e.target.result}" class="img-fluid" style="max-height: 80vh;">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                
                                $('body').append(modalContent);
                                $('#imagePreviewModal').modal('show').on('hidden.bs.modal', function() {
                                    $(this).remove();
                                });
                            });
                        };
                        reader.readAsDataURL(file);
                    }
                });
                this.on("removedfile", function(file) {
                    console.log('文件已移除:', file.name);
                    // 同步删除右侧展示区域的图片
                    $(`#uploaded-image-${file.name.replace(/\./g, '-')}`).remove();
                    
                    if (this.files.length === 0) {
                        $('.dz-message').show();
                        $('#parse-btn').prop('disabled', true);
                        $('#no-images-alert').show();
                    }
                });
                this.on("error", function(file, message) {
                    console.error('上传错误:', message);
                    alert("上传错误: " + message);
                    this.removeFile(file);
                });
            }
        });
    }

    // 优化粘贴图片处理
    document.addEventListener('paste', function(e) {
        const items = e.clipboardData.items;
        let hasImage = false;
        
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const blob = items[i].getAsFile();
                // 生成唯一文件名
                const fileName = 'paste-' + Date.now() + '.png';
                const file = new File([blob], fileName, {type: 'image/png'});
                dropzone.addFile(file);
                hasImage = true;
            }
        }
        
        if (hasImage) {
            $('#parse-btn').prop('disabled', false);
            $('.dz-message').hide();
        }
    });

    // 添加拖放区域高亮效果
    const dropzoneElement = document.getElementById('image-dropzone');
    ['dragenter', 'dragover'].forEach(eventName => {
        dropzoneElement.addEventListener(eventName, highlight, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropzoneElement.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
        dropzoneElement.classList.add('highlight');
    }

    function unhighlight(e) {
        dropzoneElement.classList.remove('highlight');
    }

    // 解析按钮点击事件
    $('#parse-btn').click(function() {
        const chapterId = '{{ chapter.id }}';
        const file = dropzone.files[0];
        const $parseBtn = $(this);
        const originalText = $parseBtn.html();
        
        if (!file) {
            alert('请先上传图片文件');
            return;
        }

        // 显示加载状态
        $parseBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 解析中...');

        // 创建FormData对象并添加文件
        const formData = new FormData();
        formData.append('image', file);
        formData.append('chapter_id', chapterId);

        // 获取CSRF令牌
        const csrfToken = $('input[name="csrfmiddlewaretoken"]').val() || '{{ csrf_token }}';

        // 调用API
        $.ajax({
            url: `/courses/api/chapters/${chapterId}/import-knowledge/`,
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: {
                'X-CSRFToken': csrfToken,
                'Accept': 'application/json'
            },
            success: function(response) {
                console.log('API响应:', response);
                if (response) {
                    if (response.ocr_result && response.ocr_result.words_result) {
                        // 拼接OCR识别结果
                        const ocrText = response.ocr_result.words_result
                            .map(item => item.words)
                            .join('\n');
                        $('#ocr-result').val(ocrText);
                        $('#generate-tree-btn').prop('disabled', false);
                    }
                } else {
                    alert('解析失败: 返回数据格式不正确');
                }
            },
            error: function(xhr) {
                let errorMsg = '服务器错误';
                if (xhr.status === 0) {
                    errorMsg = '网络连接失败，请检查网络';
                } else if (xhr.responseJSON && xhr.responseJSON.detail) {
                    errorMsg = xhr.responseJSON.detail;
                } else if (xhr.statusText) {
                    errorMsg = xhr.statusText;
                }
                console.error('API错误:', xhr);
                alert('解析错误: ' + errorMsg);
            },
            complete: function() {
                $parseBtn.prop('disabled', false).html(originalText);
            }
        });
    });

    // 渲染知识点树
    function renderKnowledgeTree(data) {
        $('#knowledge-tree').jstree({
            'core': {
                'data': transformToJsTreeFormat(data),
                'themes': {
                    'name': 'default',
                    'dots': true,
                    'icons': true
                },
                'check_callback': true
            },
            'plugins': ['types', 'contextmenu', 'dnd'],
            'types': {
                'default': {
                    'icon': 'fas fa-file-alt'
                }
            },
            'dnd': {
                'copy': false,
                'always_copy': false,
                'drag_selection': true,
                'check_while_dragging': true,
                'touch': true
            },
            'contextmenu': {
                'items': function(node) {
                    return {
                        'create': {
                            'label': '添加子节点',
                            'action': function(data) {
                                const ref = $('#knowledge-tree').jstree(true);
                                const newNode = ref.create_node(node, {
                                    'text': '新节点',
                                    'type': 'default'
                                });
                                ref.edit(newNode);
                            }
                        },
                        'rename': {
                            'label': '重命名',
                            'action': function(data) {
                                const ref = $('#knowledge-tree').jstree(true);
                                ref.edit(node);
                            }
                        },
                        'delete': {
                            'label': '删除',
                            'action': function(data) {
                                const ref = $('#knowledge-tree').jstree(true);
                                ref.delete_node(node);
                            }
                        }
                    };
                }
            }
        }).on('ready.jstree', function() {
            $(this).jstree('open_all');
        });

        // 添加根节点按钮事件
        $('#add-root-btn').off('click').on('click', function() {
            const ref = $('#knowledge-tree').jstree(true);
            const newNode = ref.create_node('#', {
                'text': '新根节点',
                'type': 'default'
            });
            ref.edit(newNode);
        });
    }

    // 转换数据结构为jsTree格式
    function transformToJsTreeFormat(data) {
        return data.map(item => ({
            'id': item.id.toString(),
            'text': item.title,
            'children': item.children ? transformToJsTreeFormat(item.children) : [],
            'type': 'default',
            'state': { 'opened': true }
        }));
    }

    // 生成知识树按钮点击事件
    $('#generate-tree-btn').click(function() {
        const ocrText = $('#ocr-result').val().trim();
        if (!ocrText) {
            alert('请先获取OCR识别结果');
            return;
        }

        // 先清理现有知识树
        const $tree = $('#knowledge-tree');
        if ($tree.data('jstree')) {
            $tree.jstree('destroy');
            $tree.empty();
        }

        // 解析OCR文本为知识树结构
        const lines = ocrText.split('\n');
        const rootNodes = [];
        const stack = [];
        
        lines.forEach(line => {
            if (!line.trim()) return;
            
            // 计算缩进级别（中文和英文空格）
            const indent = line.match(/^[\s　]+/)?.[0]?.length || 0;
            const title = line.trim();
            
            // 创建节点
            const node = {
                id: Date.now() + Math.random().toString(36).substr(2, 5),
                title: title,
                children: []
            };
            
            // 确定节点层级
            while (stack.length > 0 && stack[stack.length - 1].indent >= indent) {
                stack.pop();
            }
            
            if (stack.length === 0) {
                rootNodes.push(node);
            } else {
                stack[stack.length - 1].node.children.push(node);
            }
            
            stack.push({ indent: indent, node: node });
        });
        
        // 渲染知识树
        try {
            renderKnowledgeTree(rootNodes);
            $('#submit-btn').prop('disabled', false);
        } catch (e) {
            console.error('知识树渲染失败:', e);
            alert('知识树生成失败，请重试');
        }
    });

    // 提交按钮点击事件
    $('#submit-btn').click(function() {
        const chapterId = '{{ chapter.id }}';
        const kpId = '{{ knowledge_point.id }}';
        const isChecked = $('#kp-id').is(':checked');
        const knowledgePointId = isChecked ? $('#kp-id').val() : null;
        const treeData = $('#knowledge-tree').jstree(true).get_json('#', { 'flat': false });
        const $submitBtn = $(this);
        const originalText = $submitBtn.html();

        // 精简数据结构，只保留必要字段
        function simplifyTree(nodes) {
            return nodes.map(node => ({
                title: node.text,
                children: node.children ? simplifyTree(node.children) : []
            }));
        }

        const simplifiedTree = simplifyTree(treeData);

        // 显示加载状态
        $submitBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 提交中...');

        // 获取CSRF令牌
        const csrfToken = $('input[name="csrfmiddlewaretoken"]').val() || '{{ csrf_token }}';

        // 调用API
        $.ajax({
            url: `/courses/knowledge-points/${chapterId}/import/${kpId}/`,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                parent_id: knowledgePointId,
                knowledge_tree: simplifiedTree
            }),
            headers: {
                'X-CSRFToken': csrfToken
            },
            success: function(response) {
                alert('知识点导入成功！');
                window.location.href = `/courses/chapter/${chapterId}/detail/`;
            },
            error: function(xhr) {
                let errorMsg = '服务器错误';
                if (xhr.status === 0) {
                    errorMsg = '网络连接失败，请检查网络';
                } else if (xhr.responseJSON && xhr.responseJSON.error) {
                    errorMsg = xhr.responseJSON.error;
                } else if (xhr.statusText) {
                    errorMsg = xhr.statusText;
                }
                alert('导入失败: ' + errorMsg);
            },
            complete: function() {
                $submitBtn.prop('disabled', false).html('<p>跳转失败</p>');
            }
        });
    });
});
</script>
{% endblock %}

{% endblock %}
