
<div class="documents-container">
    <!-- 文档查询表单 -->
    <div class="documents-header">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 16px;">
            <!-- 文档标题搜索 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;">文档标题</label>
                <input type="text" class="ant-input" name="title" placeholder="输入文档标题" value="{{ request.GET.title }}">
            </div>

            <!-- 创建日期范围 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0; white-space: nowrap;">创建日期</label>
                <div class="ant-space" style="display: flex; gap: 8px;">
                    <input type="date" class="ant-input" name="created_date_start" value="{{ request.GET.created_date_start }}">
                    <span>至</span>
                    <input type="date" class="ant-input" name="created_date_end" value="{{ request.GET.created_date_end }}">
                </div>
            </div>

            <!-- 操作按钮 -->
            <button type="submit" class="ant-btn ant-btn-primary">查询</button>
            <a href="?" class="ant-btn">重置</a>
            <button type="button" class="ant-btn ant-btn-primary" onclick="showDocumentModal()">新增文档</button>
        </form>
    </div>

    <!-- 文档列表表格 -->
    <div id="documents-table" key={documents_tableKey}></div>
</div>

<!-- 文档编辑弹窗 -->
<div class="doc-modal-mask" id="documentModalMask" style="display:none"></div>
<div class="doc-modal-wrap" id="documentModalWrap" style="display:none">
    <div class="doc-modal" style="width:600px">
        <div class="doc-modal-content">
            <div class="doc-modal-header">
                <div class="doc-modal-title" id="documentModalTitle">新增文档</div>
            </div>
            <div class="doc-modal-body">
                <form id="documentForm" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="document_id" id="documentId">
                    <div class="ant-form-item">
                        <label>文档标题</label>
                        <input type="text" name="title" class="doc-input" id="documentTitle" required>
                    </div>
                    <div class="ant-form-item">
                        <label>文档文件</label>
                        <input type="file" name="file" class="doc-input" id="documentFile">
                        <div id="currentFile" style="margin-top:8px;margin-bottom: 8px;"></div>
                    </div>
                </form>
            </div>
            <div class="doc-modal-footer">
                <button class="ant-btn" onclick="hideDocumentModal()">取消</button>
                <button class="ant-btn ant-btn-primary" onclick="submitDocumentForm()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
const chapter_id = document.body.dataset.chapterId;
// 表格列配置
const documentColumns = [
    {
        title: '文档标题',
        dataIndex: 'title',
        key: 'title',
        sorter: (a, b) => a.title.localeCompare(b.title)
    },
    {
        title: '文件',
        dataIndex: 'file',
        key: 'file',
        render: (text) => React.createElement('a', {
            href: text, 
            target: '_blank'
        }, '查看文件')
    },
    {
        title: '创建时间',
        dataIndex: 'createdAt',
        key: 'createdAt',
        sorter: (a, b) => new Date(a.createdAt) - new Date(b.createdAt)
    },
    {
        title: '操作',
        dataIndex: 'actions',
        key: 'actions',
        render: (actions) => [
            React.createElement('button', {
                className: 'ant-btn ant-btn-text',
                onClick: () => {
                    console.log('编辑按钮点击，文档ID:', actions[0].id);
                    editDocument(actions[0].id);
                }
            }, [
                React.createElement('i', {className: 'anticon anticon-edit'}),
                ' 编辑'
            ]),
            React.createElement('button', {
                className: 'ant-btn ant-btn-text ant-btn-dangerous',
                onClick: () => {
                    console.log('删除按钮点击，文档ID:', actions[1].id);
                    deleteDocument(actions[1].id);
                }
            }, [
                React.createElement('i', {className: 'anticon anticon-delete'}),
                ' 删除'
            ])
        ]
    }
];

// 加载文档数据
function loadDocuments(params = {}) {
    forceRerender_documents(); // 强制重建组件

    const container = document.getElementById('documents-table');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams = {
        chapter_id: document.body.dataset.chapterId,
        title: params.title || '',
        created_date_start: params.created_date_start || '',
        created_date_end: params.created_date_end || '',
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams = new URLSearchParams(defaultParams).toString();

    fetch(`{% url 'courses:document_list' %}?${queryParams}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        // 确保分页数据存在
        const paginationData = {
            current: data.current_page || 1,
            pageSize: defaultParams.page_size,
            total: data.count || data.results?.length || 0,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadDocuments({...params, page, page_size: pageSize});
            }
        };
        
        // 确保数据结构正确
        const documentData = data.results ? data.results : (Array.isArray(data) ? data : [data]);
        
        // 保存文档数据到全局变量
        if (documentData && documentData.length) {
            window.documentData = documentData;
        } 
        
        // 格式化数据
        const formattedData = documentData.map(doc => ({
            key: doc.id,
            title: doc.title,
            file: doc.file,
            createdAt: doc.created_at,
            actions: [
                { type: 'edit', id: doc.id },
                { type: 'delete', id: doc.id }
            ]
        }));
        
        // 渲染表格
        ReactDOM.render(
            React.createElement(antd.Table, {
                columns: documentColumns,
                dataSource: formattedData,
                bordered: true,
                pagination: paginationData
            }),
            container
        );
    })
    .catch(error => {
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button onclick="loadDocuments()">重试</button>
            </div>
        `;
    });
}

// 表格实例管理
let documents_tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender_documents() {
    documents_tableKey = Date.now(); // 更新key值
    // console.log('强制重新渲染表格组件', documents_tableKey);
    const container = document.getElementById('documents-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 菜单切换事件
document.querySelector('[data-target="documents"]')?.addEventListener('click', () => {
    const form = document.querySelector('.documents-header form');
    const params = {
        title: form.querySelector('[name="title"]').value,
        created_date_start: form.querySelector('[name="created_date_start"]').value,
        created_date_end: form.querySelector('[name="created_date_end"]').value
    };
    loadDocuments(params);  // 重新加载文档数据
    forceRerender_documents(); // 强制重新渲染
});

// 表单提交处理
document.querySelector('.documents-header form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadDocuments(params);
});

// 重置按钮处理
document.querySelector('.documents-header form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.documents-header form').reset();
    loadDocuments(); // 加载无参数的全量数据
});

// 页面卸载时清理
window.addEventListener('beforeunload', () => {
    const container = document.getElementById('documents-table');
    ReactDOM.unmountComponentAtNode(container);
});

// 暴露初始化函数
window.initDocumentsPage = async function() {
    console.log('初始化文档页');
    await loadDocuments();
    return true;
};

// 初始加载
if (document.getElementById('documents').classList.contains('active')) {
    initDocumentsPage();
}

// 文档弹窗控制
function showDocumentModal(documentId = null) {
    const modalTitle = document.getElementById('documentModalTitle');
    const form = document.getElementById('documentForm');
    const currentFile = document.getElementById('currentFile');
    
    if (documentId) {
        modalTitle.textContent = '编辑文档';
        document.getElementById('documentId').value = documentId;
        
        // 填充现有数据
        if (window.documentData) {
            const doc = window.documentData.find(d => d.id == documentId); // 使用id而非key
            if (doc) {
                document.getElementById('documentTitle').value = doc.title;
                const fileName = doc.file.split('/').pop();
                const decodedFileName = decodeURIComponent(fileName);
                currentFile.innerHTML = `当前文件: <a href="${doc.file}" target="_blank">${decodedFileName}</a>`;
            } else {
                console.error('未找到文档数据，ID:', documentId);
            }
        } else {
            console.error('window.documentData未定义');
        }
    } else {
        modalTitle.textContent = '新增文档';
        document.getElementById('documentId').value = '';
        document.getElementById('documentTitle').value = '';
        currentFile.innerHTML = '';
    }
    
    document.getElementById('documentModalMask').style.display = 'block';
    document.getElementById('documentModalWrap').style.display = 'block';
}

function hideDocumentModal() {
    document.getElementById('documentModalMask').style.display = 'none';
    document.getElementById('documentModalWrap').style.display = 'none';
}

function submitDocumentForm() {
    const form = document.getElementById('documentForm');
    const submitBtn = document.querySelector('#documentModalWrap .ant-btn-primary');
    const formData = new FormData(form);
    
    // 添加chapter信息
    // chapter_id
    if (chapter_id) {
        document.getElementById('documentId').value = chapter_id;
        // formData.set('chapter', chapter_id);
        formData.append('chapter', chapter_id);
        console.log('添加章节ID:', chapter_id);
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="anticon anticon-loading"></i> 保存中...';
    
    const url = form.dataset.documentId ? 
        `{% url 'courses:document_update' 0 %}`.replace('0', formData.get('document_id')) :
        '{% url "courses:document_create" %}';
    
    fetch(url, {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(data => {
        if(data.id) { // 通过id判断操作成功
            hideDocumentModal();
            loadDocuments(); // 刷新列表
        } else {
            alert('操作失败: ' + (data.errors ? JSON.stringify(data.errors) : '未知错误'));
        }
    })
    .catch(error => {
        alert('请求出错: ' + error);
    })
    .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '保存';
    });
}

// 编辑文档
function editDocument(documentId) {
    showDocumentModal(documentId);
}

// 删除文档
function deleteDocument(documentId) {
    if (confirm('确定要删除这个文档吗？')) {
        fetch(`{% url 'courses:document_delete' 0 %}`.replace('0', documentId), {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ document_id: documentId })
        })
        .then(response => {
            if (response.ok) {
                loadDocuments(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}
</script>

<style>

    padding: 24px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);

    margin-bottom: 24px;
}

    width: 100%;
    border-radius: 8px;
    overflow: hidden;

    background: #fafafa;
    color: rgba(0,0,0,0.85);
    font-weight: 500;
}

.ant-table-tbody > tr:hover > td {
    background: #fafafa !important;
}

    color: #ff4d4f;
}

.ant-btn-dangerous:hover {
    color: #ff7875;
}

    position: fixed;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    display: none;
    overflow: auto;
    max-height: 80%;
}
.doc-modal-mask, .doc-modal-wrap {
    display: none;
}
.doc-modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
}
.doc-modal-title {
    font-size: 18px;
    margin-bottom: 20px;
}
.doc-modal-body {
    margin-bottom: 20px;
}
.doc-modal-footer {
    text-align: right;
}
.doc-input {
    margin-left: 12px;
    width: 88%;
    padding: 10px;
    margin-bottom: 20px;

</style>
