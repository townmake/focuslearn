

{% extends 'base.html' %}

{% block title %}学习记录{% endblock %}

{% block content %}
{% load static %}
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">

<div class="main-content">
    {% if user.is_authenticated %}
        <div class="study-records-container">
            <div class="study-records-header">
                <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 16px;">
                    <!-- 创建日期范围 -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label class="ant-form-item-label" style="margin-bottom: 0; white-space: nowrap;">创建日期</label>
                        <div class="ant-space" style="display: flex; gap: 8px;">
                            <input type="date" class="ant-input" name="created_date_start" id="createdDateStart">
                            <span>至</span>
                            <input type="date" class="ant-input" name="created_date_end" id="createdDateEnd">
                        </div>
                    </div>

                    <!-- 科目/章节选择器 -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label class="ant-form-item-label" style="margin-bottom: 0;">科目/章节</label>
                        <div id="subject-chapter-cascader" style="display:inline-block;"></div>
                        <input type="hidden" name="subject" id="subjectValue">
                        <input type="hidden" name="chapter" id="chapterValue">
                    </div>

                    <!-- 学习类型选择器 -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label class="ant-form-item-label" style="margin-bottom: 0; white-space: nowrap;">学习类型</label>
                        <div id="page-type-selector"></div>
                        <input type="hidden" name="page_type" id="pageTypeValue">
                    </div>

                    <!-- 操作按钮 -->
                    <button type="button" class="ant-btn ant-btn-primary" onclick="loadStudyRecords()">查询</button>
                    <button type="button" class="ant-btn" onclick="resetSearch()">重置</button>
                </form>
            </div>
            
        <div id="study-records-table"  key={tableKey}> </div>
        
    </div>
    {% else %}
        <div class="login-container">
            <h1>欢迎来到学习系统</h1>
            <p>请登录以查看您的学习计划和课程。</p>
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" name="username" class="form-control" placeholder="用户名" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="密码" required>
                </div>
                <button type="submit" class="btn-login">登录</button>
            </form>
            <div class="login-links">
                <a href="{% url 'admin:index' %}">管理员登录</a>
                <a href="#">忘记密码?</a>
            </div>
        </div>
    {% endif %}
</div>
<script>
// 表格列配置
const studyRecordColumns = [
    {
        title: '开始时间',
        dataIndex: 'start_time',
        key: 'start_time',
        width: 120,
        render: (text) => new Date(text).toLocaleString(),
        sorter: (a, b) => new Date(a.start_time) - new Date(b.start_time)
    },
    {
        title: '结束时间',
        dataIndex: 'end_time',
        key: 'end_time',
        width: 120,
        render: (text) => new Date(text).toLocaleString(),
        sorter: (a, b) => new Date(a.start_time) - new Date(b.start_time)
    },
    {
        title: '科目',
        dataIndex: 'subject_name',
        key: 'subject_name',
        width: 120
    },
    {
        title: '章节',
        dataIndex: 'chapter_name',
        key: 'chapter_name',
        width: 120
    },
    {
        title: '学习时长',
        dataIndex: 'duration_display',
        key: 'duration',
        width: 80,
        render: (text) => text
    },
    {
        title: '学习类型',
        dataIndex: 'page_type',
        key: 'page_type',
        width: 120,
        render: (text) => {
            const typeMap = {
                'study': '学习',
                'exercise': '做题练习',
                'review': '再复习',
                'other': '其他'
                // 添加其他类型的中文映射
            };
            return typeMap[text] || text;
        }
    },
    {
        title: '学习内容',
        dataIndex: 'learning_content',
        key: 'learning_content',
        width: 300,
        ellipsis: true
    }
];

// 加载学习记录数据
function loadStudyRecords(params = {}) {
    forceRerender(); // 强制重新渲染表格组件
    const container = document.getElementById('study-records-table');
    container.innerHTML = '<div class="loading-spinner">加载中...</div>';
    
    // 获取表单数据
    const formData = {
        created_date_start: document.getElementById('createdDateStart').value,
        created_date_end: document.getElementById('createdDateEnd').value,
        subject: document.getElementById('subjectValue').value,
        chapter: document.getElementById('chapterValue').value,
        page_type: document.getElementById('pageTypeValue').value,
        ...params
    };
    
    // 构建查询参数
    const queryParams = new URLSearchParams();
    for (const key in formData) {
        if (formData[key]) {
            queryParams.append(key, formData[key]);
        }
    }
    

    fetch(`{% url 'courses:study_record_list' %}?${queryParams.toString()}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(responseData => {
        console.log('API Response:', responseData); // 调试日志
        // 验证数据格式
        if (!responseData || typeof responseData !== 'object') {
            throw new Error('Invalid response format: expected object');
        }
        if (!responseData.data || !Array.isArray(responseData.data)) {
            throw new Error('Invalid data format: expected array in data field');
        }
        const data = responseData.data;
        const pagination = responseData.pagination || {};
        
        // 移除筛选器相关代码
        
        // 渲染表格
        ReactDOM.render(
            React.createElement(antd.Table, {
                columns: studyRecordColumns,
                dataSource: data,
                bordered: true,
                pagination: {
                    current: pagination.page,
                    pageSize: pagination.page_size,
                    total: pagination.total,
                    showSizeChanger: true,
                    pageSizeOptions: ['10', '20', '50'],
                    showTotal: total => `共 ${total} 条记录`
                },
                onChange: (pagination, filters, sorter) => {
                    const params = {
                        page: pagination.current,
                        page_size: pagination.pageSize,
                        ...filters
                    };
                    if (sorter.field) {
                        params.ordering = sorter.order === 'descend' ? `-${sorter.field}` : sorter.field;
                    }
                    loadStudyRecords(params);
                }
            }),
            container
        );
    })
    .catch(error => {
        container.innerHTML = `<div class="error-message">加载失败: ${error.message}</div>`;
    });
}

    // 表格实例管理
let tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender() {
    tableKey = Date.now(); // 更新key值
    console.log('强制重新渲染表格组件', tableKey);
    const container = document.getElementById('study-records-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 重置查询表单
function resetSearch() {
    document.querySelector('.study-records-header form').reset();
    document.getElementById('subjectValue').value = '';
    document.getElementById('chapterValue').value = '';
    document.getElementById('pageTypeValue').value = '';
    loadStudyRecords();
}

// 初始化级联选择器
function initCascader() {
    fetch('{% url "courses:subject_chapter_options" %}', {
        headers: {
            'Accept': 'application/json'
        }
    })
    .then(response => response.json())
    .then(options => {
        ReactDOM.render(
            React.createElement(antd.Cascader, {
                options: options,
                placeholder: '选择科目/章节',
                style: { width: 250 },
                onChange: (value) => {
                    document.getElementById('subjectValue').value = value?.[0] || '';
                    document.getElementById('chapterValue').value = value?.[1] || '';
                }
            }),
            document.getElementById('subject-chapter-cascader')
        );
    });
}

// 初始化学习类型选择器
function initPageTypeSelector() {
    const options = [
        { value: '', label: '所有类型' },
        {% for type in page_types %}
        { value: '{{ type.0 }}', label: '{{ type.1 }}' },
        {% endfor %}
    ];
    
    ReactDOM.render(
        React.createElement(antd.Select, {
            style: { width: 120 },
            options: options,
            defaultValue: '',
            onChange: (value) => {
                document.getElementById('pageTypeValue').value = value;
            }
        }),
        document.getElementById('page-type-selector')
    );
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('study-records-table')) {
        initCascader();
        initPageTypeSelector();
        loadStudyRecords();
    }
});
    </script>

<style>
.study-records-container {
    padding: 24px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
}

.study-records-header {
    margin-bottom: 24px;
}

.loading-spinner {
    padding: 20px;
    text-align: center;
    color: #1890ff;
}

.error-message {
    padding: 20px;
    color: #ff4d4f;
    text-align: center;
}

.ant-table {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

.ant-table-thead > tr > th {
    background: #fafafa;
    color: rgba(0,0,0,0.85);
    font-weight: 500;
}

.ant-table-tbody > tr:hover > td {
    background: #fafafa !important;
}

.ant-pagination {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
}

.ant-btn {
    height: 32px;
    padding: 4px 15px;
    border-radius: 6px;
}

.ant-input {
    height: 32px;
    border-radius: 6px;
}

.ant-select {
    min-width: 120px;
}
</style>

{% endblock %}
