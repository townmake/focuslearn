
<div class="exercise-records-container">
    <!-- 查询表单 -->
    <div class="exercise-header-record">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 8px;">
            <!-- 练习集名称搜索 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;padding: 0px 0px 2px 2px ;">练习集名称</label>
                <input type="text" class="ant-input" name="name" placeholder="输入练习集名称" style="width: fit-content;">
            </div>
            
            <!-- 创建时间范围 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;padding: 0px 0px 2px 2px ;">创建时间</label>
                <input type="date" class="ant-input" name="created_at_start" placeholder="开始日期" style="width: fit-content;">
                <span>至</span>
                <input type="date" class="ant-input" name="created_at_end" placeholder="结束日期"style="width: fit-content;">
            </div>
            
            <!-- 完成状态 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;padding: 0px 0px 2px 2px ;">完成次数</label>
                <select class="ant-input" name="completion_count" style="width: fit-content;">
                    <option value="">全部</option>
                    <option value="0">未完成</option>
                    <option value="1">1次</option>
                    <option value="2">2次</option>
                    <option value="3">3次</option>
                    <option value="4">其他</option>
                </select>
            </div>
            <div style="display:none; ">
                <input type="hidden" name="chapter_id">
            </div>
            <!-- 操作按钮 -->
            <button type="submit" class="ant-btn ant-btn-primary" id="submit_record">查询</button>
            <a href="?" class="ant-btn">重置</a>
            <!-- 返回章节 -->
        </form>
    </div>
    
    <!-- 练习集列表表格 -->
    <div id="exercise-record-table" key={exercise_record_tableKey}></div>
</div>

<script>
// 表格列配置
const exerciseColumns_record = [
    {
        title: '名称',
        dataIndex: 'name',
        key: 'name',
        sorter: (a, b) => a.name.localeCompare(b.name)
    },
    {
        title: '建议时间(分钟)',
        dataIndex: 'suggested_time',
        key: 'suggested_time'
    },
    {
        title: '创建时间',
        dataIndex: 'created_at',
        key: 'created_at',
        render: (text) => new Date(text).toLocaleString()
    },
    {
        title: '完成次数',
        dataIndex: 'completion_count',
        key: 'completion_count'
    },
    {
        title: '操作',
        dataIndex: 'actions',
        key: 'actions',
        render: (actions) => [
            React.createElement('button', {
                className: 'ant-btn ant-btn-text',
                onClick: () => viewExerciseSet(actions[0].id)
            }, [
                React.createElement('i', {className: 'anticon anticon-eye'}),
                ' 查看'
            ]),
            React.createElement('button', {
                className: 'ant-btn ant-btn-text ant-btn-dangerous',
                onClick: () => deleteExerciseSet(actions[2].id)
            }, [
                React.createElement('i', {className: 'anticon anticon-delete'}),
                ' 删除'
            ])
        ]
    }
];

// 加载练习集数据
function loadExercises_record(params = {}) {
    forceRerender_record(); // 强制重建组件

    const container = document.getElementById('exercise-record-table');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams_record = {
        name: params.name || '',
        created_at_start: params.created_at_start || '',
        created_at_end: params.created_at_end || '',
        completion_count: params.completion_count || '',
        chapter_id: document.body.dataset.chapterId,
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams_record = new URLSearchParams(defaultParams_record).toString();
    
    fetch(`{% url 'courses:exercise-set-list' %}?${queryParams_record}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => response.json())
    .then(responseData => {
        // 处理直接返回数组的情况
        let exerciseData = Array.isArray(responseData) ? responseData : (responseData.results || []);
        const totalCount = responseData.count || exerciseData.length;
        
        // 确保分页数据存在
        const paginationData = {
            current: defaultParams_record.page || 1,
            pageSize: defaultParams_record.page_size,
            total: totalCount,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadExercises_record({...params, page, page_size: pageSize});
            }
        };
        
        window.exerciseData = exerciseData; // 保存数据到全局变量

        try {
            // 确保React和antd已加载
            if (!window.React || !window.React.createElement || !window.antd || !window.antd.Table) {
                throw new Error('React或antd库未正确加载');
            }

            // 显示加载状态
            container.innerHTML = '<div class="loading-spinner">加载中...</div>';
        
            // 格式化数据
            const formattedData = exerciseData.map(exercise => ({
                key: exercise.id,
                name: exercise.name,
                chapter_title: exercise.chapter_title,
                chapter_id: exercise.chapter_id,
                suggested_time: exercise.suggested_time,
                created_at: exercise.created_at,
                completion_count: exercise.completion_count,
                actions: [
                    { type: 'view', id: exercise.id },
                    { type: 'complete', id: exercise.id },
                    { type: 'delete', id: exercise.id }
                ]
            }));
            setTimeout(() => {
            // 渲染表格
            ReactDOM.render(
                    React.createElement(antd.Table, {
                        columns: exerciseColumns_record,
                        dataSource: formattedData,
                        bordered: true,
                        pagination: paginationData
                    }),
                    container
                ); 
            }, 100);
        } catch (error) {
            container.innerHTML = `
                <div class="error-message">
                    渲染错误: ${error.message}
                    <button onclick="loadExercises()">重试</button>
                </div>
            `;
        }
    })
    .catch(error => {
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button class="ant-btn ant-btn-primary" onclick="loadExercises(${JSON.stringify(params)})">
                    <i class="anticon anticon-reload"></i> 重试
                </button>
                <p>如持续失败，请联系管理员</p>
            </div>
        `;
    });
}

// 表格实例管理
let exercise_record_tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender_record() {
    exercise_record_tableKey = Date.now(); // 更新key值
    const container = document.getElementById('exercise-record-table');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 查看练习集
function viewExerciseSet(exerciseSetId) {
    // 使用Django模板标签生成基础URL，确保URL正确
    const baseUrl = `{% url 'courses:exercise-set-detail' 0 %}`.replace('0', exerciseSetId);
    // window.location.href = baseUrl;
    // 在新页面打开链接
    window.open(baseUrl, '_blank');
}

// 完成练习集
function startExerciseSet(exerciseSetId) {
    // 跳转到答题页面
    window.location.href = `{% url 'courses:exercise-set-start' 0 %}`.replace('0', exerciseSetId);
}

function completeExerciseSet(exerciseSetId) {
    window.location.href = `{% url 'courses:exercise-set-completion' %}?exercise_set_id=${exerciseSetId}`;
}

// 删除练习集
function deleteExerciseSet(exerciseSetId) {
    if (confirm('确定要删除这个练习集吗？')) {
        fetch(`{% url 'courses:exercise-set-detail' 0 %}`.replace('0', exerciseSetId), {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                loadExercises_record(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}

// 表单提交处理
document.querySelector('.exercise-header-record form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadExercises_record(params);
});

// 重置按钮处理
document.querySelector('.exercise-header-record form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.exercise-header-record form').reset();
    loadExercises_record(); // 加载无参数的全量数据
});

// 菜单切换事件
document.querySelector('[data-target="exercise-records"]')?.addEventListener('click', () => {
    const form = document.querySelector('.exercise-header-record form');
    const params = {
        name: form.querySelector('[name="name"]').value,
        created_at_start: form.querySelector('[name="created_at_start"]').value,
        created_at_end: form.querySelector('[name="created_at_end"]').value,
        completion_count: form.querySelector('[name="completion_count"]').value
    };
    loadExercises_record(params);
});

// 页面卸载时清理
window.addEventListener('beforeunload', () => {
    const container = document.getElementById('exercise-record-table');
    ReactDOM.unmountComponentAtNode(container);
});

// 确保React和antd加载完成
function checkDependencies() {
    if (window.React && window.antd && window.ReactDOM) {
    } else {
        setTimeout(checkDependencies, 100);
    }
}

// 检查依赖
checkDependencies();
</script>

<style>
.exercise-records-container {
    padding: 0px;
    background: #fff;
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.03);
    max-width: 1400px;
}

.exercise-header-record {
    margin-bottom: 24px;
}

.ant-table {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

.ant-table-thead > tr > th {
    background: #fafafa;
    color: rgba(0,0,0,0.85);
    font-weight: 500;
}

.ant-table-tbody > tr:hover > td {
    background: #fafafa !important;
}

.ant-btn-dangerous {
    color: #ff4d4f;
}

.ant-btn-dangerous:hover {
    color: #ff7875;
}
</style>
