<!-- 已更新为AiEditor，编辑器为AiEditor_knowledge -->
{% load static %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">
<link rel="stylesheet" href="{% static 'css/knowledge_detail.css' %}">
<link rel="stylesheet" href="{% static 'aieditor-main/dist/style.css' %}">
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>
<!-- <script src="{% static 'js/knowledge-points.js' %}"></script> -->
{% endblock %}


<!-- 根容器，避免污染主页面 body -->
<div class="embedded-container">
    <div class="page-header">
        <div class="page-header__progress">
            <div class="progress-status-segments" id="progress-status-segments" role="tablist" aria-labelledby="progress-status-label">
                {% for s in chapter_progress_statuses %}
                <button type="button" role="tab" class="progress-status-seg{% if chapter.progress_status == s %} is-active{% endif %}"
                    data-index="{{ forloop.counter0 }}" data-status="{{ s }}" aria-selected="{% if chapter.progress_status == s %}true{% else %}false{% endif %}">{{ s }}</button>
                {% endfor %}
            </div>
        </div>
        <div class="page-header__actions">
            <button class="view-btn" id="exercise-view-btn" type="button">安排与回顾</button>
            <button class="view-btn" id="transfer-chapter-btn" type="button">转移</button>
            <button class="view-btn" id="back-view-btn" type="button">返回项目</button>
        </div>
    </div>
    <!-- 上部分（左右分栏） -->
    <div class="top-section">
        <div class="left-column">
            <div class="detail-header" >
                <h2 id="chapter-title-heading" class="chapter-title-heading" contenteditable="false" title="双击编辑标题">{{ chapter.title }}</h2>
                <div class="chapter-inline-save-fields" style="display:none;" aria-hidden="true">
                    <textarea id="chapter-update-description">{{ chapter.description }}</textarea>
                    <input type="hidden" id="chapter-update-estimated-hours" value="{{ chapter.estimated_hours }}">
                    <input type="hidden" id="chapter-update-progress-status" value="{{ chapter.progress_status }}">
                    <input type="hidden" id="chapter-update-order" value="{{ chapter.order }}">
                </div>
                <div class="action-buttons-tree" >
                    <button class="add-root-btn" id="add-root-btn">添加</button>
                </div>
            </div>
            <!-- 知识点树容器 -->
            <div id="knowledge-points-tree"></div>
            <div style="display:none;" id="tree-data">
                {{ tree_data|safe }}
            </div>
        </div>
        <div class="right-column">
            <div class="detail-header" >
                <h2>任务详情</h2>
                <div class="action-buttons-detail">
                    <button class="delete-btn" id="tree-delete-btn">删除</button>
                    <button class="add-child-btn" id="add-child-btn">添加子节点</button>
                </div>
            </div>
            <div class="detail-content">
                <div class="basic-info">
                    <h3 id="kp-title"                         
                        data-field="title"
                        contenteditable="false" 
                        ondblclick="startEdit(this)"
                        onblur="saveEdit(this)">
                    </h3>
                    <h3 id="kp-id" style="display: none;"></h3>
                    <div class="info-item-desc">
                        <span class="info-label-basic">描述：</span>
                        <span 
                            class="info-value" 
                            id="kp-description" 
                            style="white-space: pre-wrap;background-color: #cfeaa0; padding: 8px; border-radius: 4px; width: 100%; min-height:60px;"
                            contenteditable="false"
                            ondblclick="startEdit(this)"
                            onblur="saveEdit(this)">
                            暂无内容
                        </span>
                    </div>
                    <div class="info-item-group-order">
                        <div class="info-item-order">
                            <span class="info-label-basic">节点ID：</span>
                            <span class="info-value" id="kp-id-show">  </span>
                        </div>
                        <div class="info-item-order">
                            <span class="info-label-basic">父节点：</span>
                            <span class="info-value" id="kp-parent">  </span>
                        </div>
                        <div class="info-item-order">
                            <span class="info-label-basic">顺序：</span>
                            <span 
                                class="info-value" 
                                id="kp-brother_id" 
                                contenteditable="false"
                                ondblclick="startEdit(this)"
                                onblur="saveEdit(this)">
                                暂无信息
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <!-- 下部分 -->
    <div class="bottom-section">
        <div class="knowledge-content-container">
            <div class="detail-header" >
                <h2>详细内容</h2>
                <div class="action-buttons" >
                    <button class="edit-btn" id="edit-btn-content">编辑</button>
                </div>
            </div>
            <div class="kp-content-section">
                <div class="kp-editor-AI">
                    <div 
                        id="Aiditor-knowledge-content" 
                        style="width:fit-content; max-width:1600px;height:fit-content; min-height: 400px;border:1px solid #ddd; border-radius:4px;"frameborder="0"
                        >
                    </div>
                </div>
                <div class="kp-editor-annot">
                    <div id="knowledge-points-Annotation">
                        <div class="annotation-header">
                            <h3>知识点注释</h3>
                            <div id="annotation-edit-container" style="display:none;">
                                <div class="annotation-edit-box">
                                    <h4>编辑注释 <span id="edit-annotation-tag"></span></h4>
                                    <div class="form-group">
                                        <label>引用内容</label>
                                        <div id="edit-annotation-quote" class="quote-content"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>注释内容</label>
                                        <textarea id="edit-annotation-content" class="form-control" rows="3"></textarea>
                                    </div>
                                    <div class="annotation-actions">
                                        <button id="annotation-query-btn" class="btn btn-secondary">查询</button>
                                        <button id="annotation-save-btn" class="btn btn-primary">保存</button>
                                        <button id="annotation-cancel-btn" class="btn btn-light">取消</button>
                                    </div>
                                </div>
                            </div>
                            <div id="annotation-list">
                                <!-- 注释列表将通过JS动态加载 -->
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                // 加载知识点注释
                function loadKnowledgePointAnnotations(kpId) {
                    const section = document.querySelector('.kp-content-section');
                    const rightContainer = document.querySelector('.kp-editor-annot');
                    const annotationWrapper = document.getElementById('knowledge-points-Annotation');

                    // 清除旧数据
                    annotationWrapper.innerHTML = '';
                    
                    // 重置布局状态
                    section.classList.remove('has-annotations');
                    rightContainer.style.display = 'none';
                    
                    fetch(`/courses/api/knowledge_points/${kpId}/annotations/`)
                        .then(response => response.json())
                        .then(annotations => {                            
                            // 动态创建内容
                            if (annotations.length > 0) {
                                // 创建注释内容
                                const listContainer = document.createElement('div');
                                listContainer.className = 'annotations-list';

                                // 获取编辑器内容
                                let editorContent = ''; // 初始化为空字符串
                                if(window.AiEditor_knowledge) {
                                    editorContent = window.AiEditor_knowledge.getHtml();
                                } else {
                                    console.error('编辑器未初始化');
                                }
                                
                                annotations.forEach(annotation => {
                                    const item = document.createElement('div');
                                    item.className = 'annotation-item';

                                // 判断注释标签是否存在于编辑器内容中
                                const existsInEditor = editorContent.includes(`#${annotation.content_tag}`) ;
                                // 根据存在状态设置不同的颜色类
                                const colorClass = existsInEditor ? 'annotation-item-blue' : 'annotation-item-red';
                                item.classList.add(colorClass);

                                    item.innerHTML = `
                                        <div class="annotation-header">
                                        <span class="tag">#${annotation.content_tag}</span>
                                        <span class="date">${annotation.updated_at}</span>
                                        <button class="annotation-action-btn delete-btn-tag" 
                                                onclick="deleteAnnotation('${annotation.id}')">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="rgba(249,115,115,1)">
                                                <path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path>
                                            </svg>
                                        </button>
                                        </div>
                                        <div class="annotation-quote">${annotation.quote}</div>
                                        <div 
                                            class="annotation-content" 
                                            ondblclick="startEditAnnotationContent(this, '${annotation.content_tag }', '${annotation.id }', '${annotation.content}')"
                                            data-tag="{{ annotation.content_tag }}"
                                            data-original="{{ annotation.content }}">
                                            ${annotation.content}
                                        </div>
                                    `;
                                    listContainer.appendChild(item);
                                    });

                                    annotationWrapper.appendChild(listContainer);
                                    
                                    // 更新布局状态
                                    section.classList.add('has-annotations');
                                    rightContainer.style.display = 'block';
                            }
                        })
                        .catch(error => {
                            console.error('加载注释失败:', error);
                            section.classList.remove('has-annotations');
                        }
                    );
                }
                
                // 编辑注释内容的状态
                let editingAnnotationTag = null;
                let editingAnnotationElement = null;

                // 开始编辑注释内容
                function startEditAnnotationContent(element, tag, ID, originalContent) {
                    if (editingAnnotationTag) return; // 防止同时编辑多个注释
                    
                    editingAnnotationTag = tag;
                    editingAnnotationElement = element;
                    
                    // console.log('开始编辑注释内容:', originalContent);
                    // console.log('开始编辑注释内容1:', originalContent1);
                    console.log('开始编辑注释ID:', ID);

                    element.setAttribute('data-backup', originalContent); // 添加备份属性

                    const input = document.createElement('textarea');
                    input.value = originalContent;
                    input.style.width = '100%';
                    input.style.height = '100px';
                    input.style.marginBottom = '10px';
                    
                    
                    const actions = document.createElement('div');
                    actions.style.textAlign = 'right';
                    
                    const saveBtn = document.createElement('button');
                    saveBtn.textContent = '保存';
                    saveBtn.style.marginRight = '10px';
                    saveBtn.onclick = function() {
                        saveEditAnnotationContent(input.value,ID);
                    };
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = '取消';
                    cancelBtn.onclick = function() {
                        cancelEditAnnotationContent();
                    };
                    
                    actions.appendChild(saveBtn);
                    actions.appendChild(cancelBtn);
                    
                    element.innerHTML = '';
                    element.appendChild(input);
                    element.appendChild(actions);
                }

                // 保存编辑后的注释内容
                function saveEditAnnotationContent(newContent,ID) {
                    if (!editingAnnotationTag || !editingAnnotationElement) {
                        console.error('未找到正在编辑的注释标签');
                        return;
                    }
                    
                    const originalContent = editingAnnotationElement.getAttribute('data-original');
                    if (newContent === originalContent) {
                        console.log('注释内容未更改，取消编辑');
                        cancelEditAnnotationContent();
                        return;
                    }
                    
                    fetch(`/courses/api/knowledge_points/annotations/${ID}/`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({content: newContent})
                    })
                    .then(response => response.json())
                    .then(() => {
                        editingAnnotationElement.setAttribute('data-original', newContent);
                        editingAnnotationElement.textContent = newContent;
                        cancelEditAnnotationContent();
                        
                        // 重新加载注释列表以更新显示
                        loadKnowledgePointAnnotations(currentKnowledgePointId);
                    })
                    .catch(error => {
                        console.error('保存注释失败:', error);
                        antd.Modal.error({
                            title: '错误',
                            content: '保存注释失败，请重试'
                        });
                        cancelEditAnnotationContent();
                    });
                }

                // 取消编辑注释内容
                function cancelEditAnnotationContent() {
                    if (!editingAnnotationElement) return;
                    
                    const originalContent = editingAnnotationElement.getAttribute('data-backup');
                    editingAnnotationElement.innerHTML = '';
                    editingAnnotationElement.textContent = originalContent;
                    
                    editingAnnotationTag = null;
                    editingAnnotationElement = null;
                }


                // 删除注释
                function deleteAnnotation(ID) {
                    antd.Modal.confirm({
                        title: '确认删除',
                        content: '确定要删除这条注释吗？此操作不可撤销。',
                        okText: '删除',
                        cancelText: '取消',
                        onOk: () => {
                            fetch(`/courses/api/knowledge_points/annotations/${ID}/`, {
                                method: 'DELETE',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}'
                                }
                            })
                            .then(response => {
                                if (response.ok) {
                                    antd.message.success('删除成功');
                                    loadKnowledgePointAnnotations(currentKnowledgePointId);
                                } else {
                                    throw new Error('删除失败');
                                }
                            })
                            .catch(error => {
                                antd.message.error(error.message);
                            });
                        }
                    });
                }
                
                // 按钮事件
                document.getElementById('annotation-cancel-btn').addEventListener('click', function() {
                    document.getElementById('annotation-edit-container').style.display = 'none';
                    document.getElementById('annotation-list').style.display = 'block';
                });
                
                document.getElementById('annotation-save-btn').addEventListener('click', function() {
                    const tag = document.getElementById('edit-annotation-tag').textContent.replace('#', '');
                    const content = document.getElementById('edit-annotation-content').value;
                    
                    fetch(`/courses/api/knowledge_points/annotations/${tag}/`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({content: content})
                    })
                    .then(response => response.json())
                    .then(() => {
                        loadKnowledgePointAnnotations(currentKnowledgePointId);
                        document.getElementById('annotation-edit-container').style.display = 'none';
                        document.getElementById('annotation-list').style.display = 'block';
                    });
                });
                
                </script>
            </div>
        </div>
    </div>     
</div>


<script type="module">

import { AiEditor } from '/static/aieditor-main/dist/index.js';

// 标题选择弹窗组件
function showHeadingSelector(editor, selectedText, htmlText) {
    const modal = antd.Modal.confirm({
        title: '选择标题级别',
        content: React.createElement('div', {style: {padding: '20px'}}, [
            React.createElement('div', {style: {marginBottom: '15px'}}, '请选择标题级别:'),
            React.createElement('div', {style: {display: 'flex', gap: '10px'}}, [
                React.createElement(antd.Button, {
                    type: 'primary',
                    onClick: () => {
                        modal.destroy();
                        const result = ChangeHtmlTextWithTag(selectedText, htmlText, 'h1');
                        editor.setContent(result);
                    }
                }, '一级标题'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    onClick: () => {
                        modal.destroy();
                        const result = ChangeHtmlTextWithTag(selectedText, htmlText, 'h2');
                        editor.setContent(result);
                    }
                }, '二级标题'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    onClick: () => {
                        modal.destroy();
                        const result = ChangeHtmlTextWithTag(selectedText, htmlText, 'h3');
                        editor.setContent(result);
                    }
                }, '三级标题')
            ])
        ]),
        width: 500,
        footer: null
    });
}

let lastfontsize=14;
let lastcolor= 'yellow';

// 格式处理函数（带标签参数）
function ChangeHtmlTextWithTag(selectedText, htmlText, tag) {
    // 替换选中的文本为新的HTML标签
    const startIndex = htmlText.indexOf(selectedText);
    if (startIndex !== -1) {
        const endIndex = startIndex + selectedText.length;
        const beforeSelection = htmlText.substring(0, startIndex);
        const afterSelection = htmlText.substring(endIndex);
        if(selectedText.trim() === '') {
            return htmlText; // 如果选中文本为空白，则不进行任何更改
        } else {
            console.log("beforeSelection", beforeSelection);
            console.log("select", selectedText);
            return `${beforeSelection}</span></p><${tag}>${selectedText}</${tag}>${afterSelection}`;
        }
    } else {
        return htmlText; // 如果未找到选中文本，则返回原始HTML
    }
}
// 字体大小和颜色选择弹窗组件
function showFontStyleSelector(editor, selectedText) {
    let fontSize = 10; // 默认字体10时，返回不修改文字大小
    const handleSizeChange = (value) => {
        console.log('选中的值:', value); // 直接获取选项的 value 属性
        fontSize = value;
    };
    const modal = antd.Modal.confirm({
        title: '选择字体大小和颜色',
        content: React.createElement('div', {style: {padding: '10px'}}, [
            React.createElement('div', {style: {margin: '5px 0'}}, [
                React.createElement('span', null, '字体大小:'),
                React.createElement(antd.Radio.Group,
                    { 
                        onChange: (e) => handleSizeChange(e.target.value),
                        id: "font-size-input",
                        defaultValue: lastfontsize,
                        style: { display: 'flex', flexWrap: 'wrap', marginLeft: '5px' } 
                    }, 
                [                                        
                    React.createElement(antd.Radio, { value: 10 }, '10px'),
                    React.createElement(antd.Radio, { value: 14 }, '14px'),
                    React.createElement(antd.Radio, { value: 16 }, '16px'),
                    React.createElement(antd.Radio, { value: 18 }, '18px'),
                    React.createElement(antd.Radio, { value: 20 }, '20px'),
                    React.createElement(antd.Radio, { value: 24 }, '24px'),
                    React.createElement(antd.Radio, { value: 28 }, '28px'),
                ])
            ]),
            React.createElement('div', {style: {display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '12px'}}, [
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: 'yellow', borderColor: 'yellow', color: 'black' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, 'yellow');
                        // editor.setContent(result);
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '黄底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: 'red', borderColor: 'red', color: 'white' },
                    onClick: () => {
                        console.log("fontSize", fontSize);
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, 'red', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '红底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: 'black', borderColor: 'black', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, 'black', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '黑底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#00ffff', borderColor: '#00ffff', color: '#001954' },
                    onClick: () => {
                        console.log("fontSize", fontSize);
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#00ffff', '#001954');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '青底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: 'blue', borderColor: 'blue', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, 'blue', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '蓝底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#BF6F64', borderColor: '#BF6F64', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#BF6F64', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '孟菲斯红'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#9EBD9A', borderColor: '#9EBD9A', color: '#333'},
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#9EBD9A','#333');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '薄荷绿'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#FD98A2', borderColor: '#FD98A2', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#FD98A2', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '粉红底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#98E0EC', borderColor: '#98E0EC', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#98E0EC', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '薄荷蓝'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#715772', borderColor: '#715772', color: 'white' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#715772', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '紫藤色'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#e4dddd', borderColor: '#e4dddd', color: '#001954' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#e4dddd', '#001954');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '浅灰底'),
                React.createElement(antd.Button, {
                    type: 'primary',
                    style: { backgroundColor: '#AB570B', borderColor: '#AB570B', color: 'black' },
                    onClick: () => {
                        const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#AB570B', 'white');
                        editor.insert(result);
                        modal.destroy();
                    }
                }, '棕色底'),
            ])
        ]),
        width: 500,
        onOk: () => {
            // 默认字体大小和颜色处理逻辑，例如设置为黄色背景
            const result = ChangeHtmlTextWithFontSizeAndColor(selectedText, editor.getHtml(), fontSize, '#FBF9F9');
            editor.insert(result);
        },
        footer: null
    });
}

// 字体大小和颜色处理函数
function ChangeHtmlTextWithFontSizeAndColor(selectedText, htmlText, fontSize, color, colorText = 'black') {
    if (!selectedText) return '';
    let fontSize_use = 14; // 默认字体大小
    lastcolor = color;
    lastfontsize = fontSize;
    if (fontSize === 10) {
        let fontSize = 14; // 默认字体大小
        const startIndex = htmlText.indexOf(selectedText);
        if (startIndex !== -1) {
            const beforeSelection = htmlText.substring(0, startIndex);
            console.log("beforeSelection", beforeSelection);
            const parser = new DOMParser();
            const doc = parser.parseFromString(beforeSelection, 'text/html');
            const regex = /font-size:\s*([\d.]+)(?:\s*!important)?/gi;
            // const regex = /(?<!<\/h[1-3]>)<p[\s\S]*?style="[\s\S]*?font-size:\s*([\d.]+)?"[\s\S]*?/gi;



            const fontSizeValues = [];
             doc.querySelectorAll('[style]').forEach(element => {
                const style = element.getAttribute('style');
                const matches = [...style.matchAll(regex)];
                
                if (matches.length > 0) {
                    // 取最后一个匹配项，并去除单位
                    const lastMatch = matches[matches.length - 1][1] || matches[matches.length - 1][0].replace(/[^0-9.]/g, '');
                    fontSizeValues.push(lastMatch);
                }
            });

            console.log('fontSizeValues',fontSizeValues);
            if (fontSizeValues) {
                fontSize_use = fontSizeValues.pop();
                console.log("fontSize_use", fontSize_use);
            }
        } 
    } 
    else {
        fontSize_use = fontSize;
    }
    console.log("fontSize2", fontSize_use);

    return `<span style="color: ${colorText};font-size:${fontSize_use}px;"><mark data-color="${color}" style="background-color:${color}; color: inherit">${selectedText}</mark></span>`;
}
//清除格式
function clearFormat(selectedText) {
    // 使用正则表达式去掉空格
    const regex = new RegExp(`<[^>]+>|\\s+`, 'g');
    const cleanedText = selectedText.replace(regex, '');
    return cleanedText;
}

//替换英文标点符号为中文标点符号
function ReplaceSymbol(editor) {
    let htmlText = editor.getHtml();
    const replacements = {
        ',': '，',
        '.': '。',
        '?': '？',
        '!': '！',
        ':': '：',
        ';': '；',
        // '(': '（',
        // ')': '）',
        '"': '“',
        "'": '‘'
    };
    //只替换不在标签内的标点符号
    htmlText = htmlText.replace(/(?!<[^>]*)([.,?!:;'"()])(?![^<]*>)/g, (match) => replacements[match] || match);
    editor.setContent(htmlText);
}

/** 判断剪贴板纯文本是否疑似 Markdown（减少误判） */
function looksLikeMarkdownPaste(text) {
    if (!text || text.trim().length < 5) return false;
    const signals = [
        /^#{1,6}\s+\S/m,
        /^\s{0,3}[-*+]\s+\S/m,
        /^\s*\d+\.\s+\S/m,
        /^>\s+\S/m,
        /```/,
        /\[[^\]]+\]\([^)]*\)/,
        /`[^`\n]+`/,
        /\*\*[^*\n]+\*\*/,
        /^[ \t]*\|[^|\r\n]+\|/m,
        /^[ \t]*-{3,}\s*$/m,
    ];
    let hits = 0;
    for (const re of signals) {
        if (re.test(text)) hits++;
    }
    const lines = text.split(/\r?\n/).length;
    if (hits >= 2) return true;
    if (hits === 1 && lines >= 2) return true;
    if (hits === 1 && /^#{1,6}\s/m.test(text)) return true;
    if (hits === 1 && /```/.test(text)) return true;
    return false;
}

/** 纯文本转简单 HTML 段落（不解析 Markdown） */
function plainTextToSimpleHtml(plain) {
    const esc = plain
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    const parts = esc.split(/\r?\n{2,}/);
    const body = parts.map((p) => '<p>' + p.replace(/\r?\n/g, '<br>') + '</p>').join('');
    return body || '<p></p>';
}

/**
 * 在捕获阶段拦截粘贴：若 text/plain 疑似 Markdown，弹窗确认后 insertMarkdown；
 * 与 AiEditor 默认逻辑配合（有 html 时原逻辑会忽略 md 纯文本）。
 */
function attachKnowledgeMarkdownPasteGuard(aiEditor) {
    const root = document.querySelector('#Aiditor-knowledge-content');
    if (!root) return;

    const bind = (pm) => {
        if (!pm || pm.dataset.mdPasteGuardBound === '1') return;
        pm.dataset.mdPasteGuardBound = '1';
        pm.addEventListener(
            'paste',
            (e) => {
                const inner = aiEditor.innerEditor;
                if (!inner || !inner.isEditable) return;
                const cd = e.clipboardData;
                if (!cd || (cd.files && cd.files.length > 0)) return;

                const plain = cd.getData('text/plain') || '';
                if (!plain.trim() || !looksLikeMarkdownPaste(plain)) return;

                e.preventDefault();
                e.stopImmediatePropagation();

                antd.Modal.confirm({
                    title: '检测到 Markdown 内容',
                    content: '剪贴板中的文本疑似 Markdown 格式。是否先转换为富文本再插入编辑器？',
                    okText: '转换并插入',
                    cancelText: '不转换（纯文本）',
                    onOk: () => {
                        aiEditor.insertMarkdown(plain);
                    },
                    onCancel: () => {
                        aiEditor.insert(plainTextToSimpleHtml(plain));
                    },
                });
            },
            true
        );
    };

    bind(root.querySelector('.ProseMirror'));
    const mo = new MutationObserver(() => bind(root.querySelector('.ProseMirror')));
    mo.observe(root, { childList: true, subtree: true });
}

function TagComment(text) {
    // 显示加载状态
    const loadingModal = antd.Modal.info({
        title: '处理中...',
        content: '正在提交注释，请稍候',
        okButtonProps: { style: { display: 'none' } }
    });

    // 获取当前知识点ID
    const currentKnowledgePointId = document.getElementById('kp-id').value;
    if (!currentKnowledgePointId) {
        loadingModal.destroy();
        antd.Modal.error({
            title: '错误',
            content: '无法获取知识点ID'
        });
        return;
    }
    //弹窗添加注释content
    // 创建注释内容输入框
    const modal = antd.Modal.confirm({
        title: '添加注释',
        content: React.createElement('div', null, [
            React.createElement('div', { style: { marginTop: '5px', padding: '10px', backgroundColor: '#f0f0f0', borderRadius: '4px' } }, text),
            React.createElement('textarea', {
                id: 'annotation-content-input',
                placeholder: '请输入注释内容',
                style: { width: '100%', height: '100px', marginTop: '10px' }
            })
        ]),
        width: 600,
        okText: '提交',
        cancelText: '取消',
        onOk: () => {
            const annotationContent = document.getElementById('annotation-content-input').value.trim();
            if (!annotationContent) {
                antd.Modal.warning({
                    title: '警告',
                    content: '注释内容不能为空'
                });
                return;
            }
            submitAnnotation(text, annotationContent, currentKnowledgePointId, loadingModal);
        },
        onCancel: () => {
            loadingModal.destroy();
        }
    });
}

function submitAnnotation(text, content, currentKnowledgePointId, loadingModal) {
    // 发送POST请求到后端API
    fetch(`/courses/api/knowledge_points/${currentKnowledgePointId}/annotations/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            knowledge_point: currentKnowledgePointId,
            quote: text,
            content: content,
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('请求失败');
        }
        return response.json();
    })
    .then(data => {
        loadingModal.destroy();
        // 处理成功响应
        const number = data.content_tag; // 假设后端返回的注释编号在id字段
        const content = `<mark data-color="#8db3e2" style="background-color: #8db3e2; color: inherit">${text}</mark><span style=\"color: #ffffff\"><strong><mark data-color=\"#4a90e2\" style=\"background-color: #4a90e2; color: inherit\"><sup>🏷️#${number}🏷️</sup></mark></strong></span>`;
        window.AiEditor_knowledge.focus().insert(content);
        loadKnowledgePointAnnotations(currentKnowledgePointId); // 更新注释列表
    })
    .catch(error => {
        loadingModal.destroy();
        antd.Modal.error({
            title: '错误',
            content: error.message
        });
    });
}

function SaveBtnLogic () {
    if (!window.AiEditor_knowledge) {
        console.error('Editor not ready');
        return;
    }
    // 获取编辑按钮元素
    const editBtn = document.getElementById('edit-btn-content');
    const isCurrentlyReadOnly = editBtn.textContent === '编辑';// 当前按钮显示编辑，说明当前用户要进入编辑

    // 切换按钮文本
    editBtn.textContent = isCurrentlyReadOnly ? '保存' : '编辑'; // 切换按钮文本，如果现在编辑改为保存，否则改为编辑
    
    if (isCurrentlyReadOnly) {     
        // 当前按钮显示编辑，为只读状态，点击切换到编辑状态
        window.AiEditor_knowledge.setEditable(true); // 设置编辑器为可编辑状态
        window.AiEditor_knowledge.focus(); // 编辑器获得焦点
    }
    else { // 如果当前是保存，说明用户要保存内容

        window.AiEditor_knowledge.setEditable(false); // 设置编辑器为不可编辑状态
        const content=window.AiEditor_knowledge.getHtml();
            //将内容更新到后端，待确认是否发送请求更新编辑器里的内容
 
        console.log('Saving content:', content);
        // 发送PUT请求保存内容
        const kpIdElement = document.getElementById('kp-id');
        if (!kpIdElement) {
            console.error('Knowledge point ID element not found');
            return;
        }
        
        const currentKnowledgePointId = kpIdElement.value;
        if (!currentKnowledgePointId || typeof currentKnowledgePointId !== 'string') {
            console.error('Invalid knowledge point ID:', currentKnowledgePointId);
            return;
        }

        fetch(`/courses/api/knowledge-points/${currentKnowledgePointId}/content/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                content: content
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Save failed');
            }
            return response.json();
        })
        .catch(error => console.error('Save error:', error));
    }
}

/** 临时 height:auto 测量列内容真实所需高度（避免上一轮写死的 height 压住 scrollHeight） */
function measureColumnContentHeight(el) {
    if (!el) return 0;
    const prev = el.style.height;
    el.style.height = 'auto';
    const h = el.scrollHeight;
    el.style.height = prev;
    return h;
}

const KP_TOP_MIN_BASE = 100;

const syncHeights = () => {
    if (!leftColumn || !rightColumn) return;
    const leftH = measureColumnContentHeight(leftColumn);
    const rightH = measureColumnContentHeight(rightColumn);
    const targetHeight = Math.max(leftH, rightH, KP_TOP_MIN_BASE);

    [leftColumn, rightColumn].forEach((el) => {
        el.style.height = `${targetHeight}px`;
        el.style.minHeight = '';
        el.style.background = `linear-gradient(to bottom, #fbf9f9 0%, #fbf9f9 ${targetHeight}px, transparent ${targetHeight}px)`;
    });
};

function scheduleSyncHeightsAfterTreeLayout() {
    syncHeights();
    requestAnimationFrame(() => syncHeights());
    [50, 150, 400].forEach((ms) => setTimeout(syncHeights, ms));
}

const resizeObserver = new ResizeObserver(() => syncHeights());

if (leftColumn) resizeObserver.observe(leftColumn);
if (rightColumn) resizeObserver.observe(rightColumn);
if (treeContainer_height) resizeObserver.observe(treeContainer_height);

syncHeights();


// 渲染树：带超时机制的渲染函数
function renderKnowledgeTree(treeData) {
    const treeContainer = document.getElementById('knowledge-points-tree');

    //优化体验部分
    if (!treeContainer) {
        console.error('知识点树容器未找到');
        return;
    }
    // 显示加载状态
    treeContainer.innerHTML = '<div class="loading-spinner"></div>';
    
    // 设置渲染超时(5秒)
    const renderTimeout = setTimeout(() => {
        if (treeContainer.querySelector('.loading-spinner')) {
            console.warn('渲染超时，强制显示错误状态');
            treeContainer.innerHTML = `
                <div class="error-message">
                    渲染超时，请<a href="javascript:window.location.reload()">刷新页面</a>
                </div>
            `;
        }
    }, 5000);


    try {
        // console.group('渲染知识点树');
        const formattedData = formatTreeData(treeData);

        // 验证数据有效性
        if (!formattedData || formattedData.length === 0) {
            throw new Error('无效的树形数据');
        }
        // node.key很重要，用于后续加载详情,这里用的是id作为key
        const treeElement = React.createElement(antd.Tree, {
            showLine: true,
            treeData: formattedData,
            onSelect: (selectedKeys, {node}) => {
                if (node?.key) {
                    // 加载知识点详情
                    loadKnowledgePointDetail(node.key);
                    loadKnowledgePointAnnotations(node.key);
                }
            },
            onExpand: (expandedKeys, { expanded: isExpanded, node }) => {
                // 立即同步高度
                syncHeights();
                // 动画完成后最终确认
                if (isExpanded) {
                    setTimeout(syncHeights, 500);
                }
                else {  // 收缩
                    setTimeout(syncHeights, 500);
                }
            }
        });
        
        // 渲染到DOM并强制验证状态
        ReactDOM.render(treeElement, treeContainer, () => {
            clearTimeout(renderTimeout);
            scheduleSyncHeightsAfterTreeLayout();

            setTimeout(() => {
                if (!treeContainer.querySelector('.ant-tree')) {
                    console.warn('React渲染结果未显示，尝试恢复');
                    treeContainer.innerHTML = '';
                    ReactDOM.render(treeElement, treeContainer, scheduleSyncHeightsAfterTreeLayout);
                } else {
                    scheduleSyncHeightsAfterTreeLayout();
                }
            }, 100);
        });
        
    } catch (error) {
        clearTimeout(renderTimeout);
        console.error('渲染知识点树失败:', error);
        treeContainer.innerHTML = `
            <div class="error-message">
                渲染失败: ${error.message}
                <button onclick="window.location.reload()">重试</button>
            </div>
        `;
    } finally {
        console.groupEnd();
    }
}

// 优化后的树形数据格式化
function formatTreeData(data) {
    if (!data || !Array.isArray(data) || data.length === 0) {
        return [];
    }
    
    return data.map(item => {
        const node = {
            key: item.id,
            title: item.title
        };
        // 只有当有子节点时才递归处理
        if (item.children && item.children.length > 0) {
            // 对子节点按brother_id排序
            node.children = formatTreeData(item.children.sort((a, b) => {
                // 按brother_id从小到大排序
                if (a.brother_id !== undefined && b.brother_id !== undefined) {
                    return a.brother_id - b.brother_id;
                }
                // 其次使用created_at排序
                if (a.created_at && b.created_at) {
                    return new Date(a.created_at) - new Date(b.created_at);
                }
                return 0;
            }));
        }
        return node;
    });
}


// 异步获取树形数据
async function fetchTree(params = {}) {
    try {
        // 显示加载状态
        const treeContainer = document.getElementById('knowledge-points-tree');
        if (treeContainer) {
            treeContainer.innerHTML = '<div class="loading-state">加载中...</div>';
        }

        // 获取当前章节ID
        const chapterId = '{{chapter.id }}';
        if (!chapterId) {
            throw new Error('缺少章节ID参数');
        }

        // 构建查询参数
        const queryParams = new URLSearchParams(params).toString();
        const response = await fetch(`/courses/api/chapters/${chapterId}/knowledge-tree/?${queryParams}`, {
            headers: {
                'Accept': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            }
        });

        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }

        const responseData = await response.json();
        
        if (!responseData.tree_data || !Array.isArray(responseData.tree_data)) {
            throw new Error('无效的API响应格式');
        }

        return responseData.tree_data;
    } catch (error) {
        console.error('获取树数据失败:', error);
        throw error;
    }
}

// 增强版的知识点树加载———初始化清理完环境，就开始加载数据，加载数据后渲染树
async function loadKnowledgePoints() {
    const treeContainer = document.getElementById('knowledge-points-tree');
    if (!treeContainer) return;

    try {
        treeContainer.innerHTML = '<div class="loading-spinner"></div>';
        
        // 强制清除可能存在的旧数据
        if (treeContainer.querySelector('.ant-tree')) {
            ReactDOM.unmountComponentAtNode(treeContainer);
        }

        // 获取当前激活的筛选类型
        const activeType = document.querySelector('.icon-switcher .active')?.dataset.type;
        const params = activeType ? { type: activeType } : {};
        
        // 使用API获取数据
        const treeData = await fetchTree(params);
        
        if (!treeData || treeData.length === 0) {
            const treeContainer = document.getElementById('knowledge-points-tree');
            treeContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <img src="{% static 'images/empty-folder.png' %}" alt="空数据">
                    </div>
                    <h3>暂无知识点数据</h3>
                    <p>当前章节还没有添加任何知识点</p>
                    <button class="ant-btn ant-btn-primary" onclick="showAddModal_Knowledge(null)">
                        创建第一个知识点 
                    </button>
                </div>
            `;
            //按钮不显示
            const buttons = document.querySelectorAll('.action-buttons-detail');
            buttons.forEach(btnGroup => {
                btnGroup.classList.add('hidden');  // 隐藏
                // btnGroup.classList.remove('hidden'); // 显示
                // btnGroup.classList.toggle('hidden'); // 切换
            });
            return;
        }

        // 渲染树
        renderKnowledgeTree(treeData);
        // 自动选中第一个知识点
        setTimeout(() => {
            const firstNode = document.querySelector('.ant-tree-node-content-wrapper');
            if (firstNode) {
                firstNode.click();
            }
        }, 300);
    } catch (error) {
        console.error('加载知识点失败:', error);
        
        const treeContainer = document.getElementById('knowledge-points-tree');
        if (treeContainer) {
            treeContainer.innerHTML = `<div class="error-state"> <h3>加载失败</h3> <p>${error.message}</p></div>`;
        }
    }
}

// 完整版的事件监听和初始化
let currentListeners = [];

function cleanupKnowledgePoints() {
    // 移除所有事件监听
    currentListeners.forEach(({element, type, handler}) => {
        element.removeEventListener(type, handler);
    });
    currentListeners = [];
    
    // 清理React组件
    const treeContainer = document.getElementById('knowledge-points-tree');
    if (treeContainer) {
        ReactDOM.unmountComponentAtNode(treeContainer);
        treeContainer.innerHTML = '';
    }
}

// 初始化知识点树加载逻辑——初始化后第一个调用，后续通过hash变化或tab点击触发重新加载
function initKnowledgePoints() {
    // 先清理现有状态
    cleanupKnowledgePoints();

    // 确保必要库已加载
    const checkDependencies = () => {
        if (!window.React || !window.ReactDOM || !window.antd) {
            console.warn('等待依赖库加载...');
            setTimeout(checkDependencies, 100);
            return false;
        }
        return true;
    };

    if (!checkDependencies()) return;

    // 添加tab点击监听
    document.querySelectorAll('[data-target="knowledge-points"]').forEach(tab => {
        const handler = () => {
            cleanupKnowledgePoints();
            loadKnowledgePoints();
        };
        tab.addEventListener('click', handler);
        currentListeners.push({element: tab, type: 'click', handler});
    });

    // 添加hash变化监听
    const hashHandler = () => {
        if (location.hash.includes('knowledge-points')) {
            cleanupKnowledgePoints();
            loadKnowledgePoints();
        }
    };
    window.addEventListener('hashchange', hashHandler, { passive: true });
    currentListeners.push({element: window, type: 'hashchange', handler: hashHandler});

    // 直接加载检查
    const shouldLoadDirectly = document.getElementById('knowledge-points')?.classList.contains('active') || location.hash.includes('knowledge-points');
    if (shouldLoadDirectly) {
        loadKnowledgePoints();
    }

    // 添加全局重载方法
    window.reloadKnowledgeTree = () => {
        cleanupKnowledgePoints();
        loadKnowledgePoints();
    };
    
    // 添加页面卸载时的清理
    window.addEventListener('beforeunload', cleanupKnowledgePoints);
    currentListeners.push({element: window, type: 'beforeunload', handler: cleanupKnowledgePoints});
}

// 加载知识点详情
function loadKnowledgePointDetail(kpId) {
    // 确保ID是字符串类型
    currentKnowledgePointId = String(kpId);
    document.getElementById('kp-id').value = currentKnowledgePointId;
    fetch(`/courses/knowledge-points/${kpId}/`)
        .then(response => response.json())
        .then(data => {
            // 更新右侧面板所有字段
            editableFields.forEach(fieldConfig => {
                const element = document.getElementById(fieldConfig.id);
                if (element) {
                    const value = data[fieldConfig.field];
                    element.textContent = value !== undefined ? value : fieldConfig.default || '';
                    element.setAttribute('data-original-value', element.textContent);
                    element.setAttribute('contenteditable', 'false');
                }
            });

            document.getElementById('kp-parent').textContent = 
                data.parent ? data.parent_title : "根节点";
            document.getElementById('kp-id-show').textContent = kpId;
            

            // 更新AiEditor编辑器内容,window.AiEditor_knowledge
            if (window.AiEditor_knowledge) {
                window.AiEditor_knowledge.setContent(data.content); // 设置编辑器内容
            } else {
                console.error('window.AiEditor_knowledge未初始化');
            }

            // 设置编辑/删除按钮的ID
            document.getElementById('tree-delete-btn').dataset.kpId = kpId;
            document.getElementById('add-child-btn').dataset.parentId = kpId;
            document.getElementById('add-root-btn').dataset.parentId = null;// 根节点的父ID设为null
        });
}

// 启用编辑模式
function startEdit(element) {
    const fieldConfig = editableFields.find(f => f.id === element.id);
    if (!fieldConfig) return;
    
    element.setAttribute('contenteditable', 'true');
    element.focus();
    // 保存原始内容以便比较
    if (!element.getAttribute('data-original-value')) {
        element.setAttribute('data-original-value', element.textContent);
    }
}

// 保存编辑内容
function saveEdit(element) {
    const fieldConfig = editableFields.find(f => f.id === element.id);
    if (!fieldConfig) return;
    
    element.setAttribute('contenteditable', 'false');
    const newValue = element.textContent.trim();
    const originalValue = element.getAttribute('data-original-value');
    
    if (newValue !== originalValue) {
        // 获取所有可编辑字段的值
        const allFields = editableFields.map(field => {
            const elem = document.getElementById(field.id);
            return {
                ...field,
                value: elem ? elem.textContent.trim() : ''
            };
        });
        
        currentKnowledgePointId = document.getElementById('kp-id').value;
        // 调用统一的保存函数
        saveMultipleFields(currentKnowledgePointId, allFields)
            .then(success => {
                if (success) {
                    // 更新所有字段的原始值
                    allFields.forEach(field => {
                        const elem = document.getElementById(field.id);
                        if (elem) {
                            elem.setAttribute('data-original-value', elem.textContent);
                        }
                    });
                    //刷新页面
                    if(fieldConfig.id === 'kp-title') {
                        // 如果是标题字段，刷新页面以更新树结构  
                          location.reload();
                    }else{
                        //重新加载知识点详情
                        loadKnowledgePointDetail(currentKnowledgePointId);
                    }
                } else {
                    // 如果保存失败，恢复原始值
                    element.textContent = originalValue;
                    antd.message.error('保存失败，请重试');
                }
            });
    }
}

// 保存多个字段
function saveMultipleFields(kpId, fields) {
    const fieldData = {};
    fields.forEach(field => {
        const element = document.getElementById(field.id);
        if (element) {
            const value = element.textContent;
            if (field.validate(value)) {
                fieldData[field.field] = value;
            } else {
                antd.message.error(`${field.field}格式不正确`);
                return Promise.reject(`${field.field}格式不正确`);
            }
        }
    });

    return fetch(`/courses/knowledge-points/${kpId}/`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(fieldData)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('保存失败');
        }
        return response.json();
    })
    .then(data => {
        antd.message.success('已保存');
        return true;
    })
    .catch(error => {
        console.error('保存失败:', error);
        antd.message.error('保存失败');
        return false;
    });
}


// 删除知识点
function deleteKnowledgePoint(kpId) {
    fetch(`/courses/knowledge-points/${kpId}/`, {
        method: 'DELETE',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => {
        if (response.ok) {
            antd.message.success('删除成功');
            // 删除成功，重新加载知识点树
            initKnowledgePoints();
            setTimeout(() => {
                const firstNode = document.querySelector('.ant-tree-node-content-wrapper');
                if (firstNode) {
                    firstNode.click();
                }else{
                    // 树已空，重置当前选中知识点
                    currentKnowledgePointId = null;
                    // 清空右侧面板内容 
                    document.getElementById('kp-title').textContent = '';
                    document.getElementById('kp-description').textContent = '';
                    document.getElementById('kp-parent').textContent = '';
                    document.getElementById('kp-brother_id').textContent = '';
                    // 清空编辑器内容
                    if(window.AiEditor_knowledge) {
                        window.AiEditor_knowledge.setContent(''); // 清空编辑器内容
                    }
                }
            }, 300);
        } else {
            throw new Error('删除失败');
        }
    })
    .catch(error => {
        antd.message.error(error.message);
    });
}

// 章节标题：双击进入编辑；失焦或鼠标移出标题区域时提交保存
(function () {
    var h2 = document.getElementById('chapter-title-heading');
    if (!h2) return;
    var updateUrl = '{% url "courses:chapter_update" chapter.id %}';
    var csrf = '{{ csrf_token }}';
    var saving = false;

    function getFormFields() {
        var descEl = document.getElementById('chapter-update-description');
        var eh = document.getElementById('chapter-update-estimated-hours');
        var ps = document.getElementById('chapter-update-progress-status');
        var ord = document.getElementById('chapter-update-order');
        var activeSeg = document.querySelector('.progress-status-seg.is-active');
        var progressStatus = activeSeg
            ? activeSeg.getAttribute('data-status')
            : (ps ? ps.value : '进行中');
        return {
            description: descEl ? descEl.value : '',
            estimated_hours: eh ? eh.value : '1',
            progress_status: progressStatus || '进行中',
            order: ord ? ord.value : '0'
        };
    }

    function finishChapterTitleSave() {
        if (h2.getAttribute('contenteditable') !== 'true' || saving) return;
        var newTitle = (h2.textContent || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r?\n/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        var orig = (h2.getAttribute('data-original-title') || '').trim();
        h2.setAttribute('contenteditable', 'false');
        if (!newTitle) {
            h2.textContent = orig;
            if (typeof antd !== 'undefined' && antd.message) {
                antd.message.warning('标题不能为空');
            }
            return;
        }
        if (newTitle === orig) return;

        saving = true;
        var fd = new FormData();
        fd.append('csrfmiddlewaretoken', csrf);
        fd.append('title', newTitle);
        var f = getFormFields();
        fd.append('description', f.description);
        fd.append('estimated_hours', f.estimated_hours);
        fd.append('progress_status', f.progress_status);
        fd.append('order', f.order);

        fetch(updateUrl, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrf },
            body: fd,
            credentials: 'same-origin'
        })
            .then(function (r) {
                return r.json().then(function (body) {
                    if (!r.ok) throw new Error((body.errors && JSON.stringify(body.errors)) || body.message || '保存失败');
                    return body;
                });
            })
            .then(function () {
                h2.setAttribute('data-original-title', newTitle);
                h2.textContent = newTitle;
                var b = document.body;
                if (b) b.setAttribute('data-chapter-name', newTitle);
                var t = document.querySelector('title');
                if (t) {
                    t.textContent = '章节知识点-' + newTitle;
                }
                if (typeof antd !== 'undefined' && antd.message) {
                    antd.message.success('标题已保存');
                }
            })
            .catch(function (e) {
                h2.textContent = orig;
                if (typeof antd !== 'undefined' && antd.message) {
                    antd.message.error(e.message || '保存失败');
                }
            })
            .finally(function () {
                saving = false;
            });
    }

    h2.addEventListener('dblclick', function (e) {
        e.preventDefault();
        if (h2.getAttribute('contenteditable') === 'true') return;
        var cur = (h2.textContent || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r?\n/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
        h2.setAttribute('data-original-title', cur);
        h2.setAttribute('contenteditable', 'true');
        h2.focus();
        var sel = window.getSelection();
        var range = document.createRange();
        range.selectNodeContents(h2);
        sel.removeAllRanges();
        sel.addRange(range);
    });

    h2.addEventListener('blur', function () {
        finishChapterTitleSave();
    });
    h2.addEventListener('mouseleave', function () {
        finishChapterTitleSave();
    });
})();

// 章节进度状态：按钮切换，与服务器同步
(function () {
    var STATUSES = [
        {% for s in chapter_progress_statuses %}
        '{{ s|escapejs }}'{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    var POST_URL = '{% url "courses:chapter_progress_status" chapter.id %}';
    var CSRF = '{{ csrf_token }}';

    function setActiveIndex(i) {
        if (i < 0 || i >= STATUSES.length) return;
        document.querySelectorAll('.progress-status-seg').forEach(function (btn, idx) {
            var on = idx === i;
            btn.classList.toggle('is-active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }

    function submitStatus(status) {
        var fd = new FormData();
        fd.append('progress_status', status);
        return fetch(POST_URL, {
            method: 'POST',
            headers: { 'X-CSRFToken': CSRF },
            body: fd,
            credentials: 'same-origin'
        }).then(function (r) {
            return r.json().then(function (body) {
                if (!r.ok) throw new Error(body.message || '更新失败');
                return body;
            });
        });
    }

    function applyIndex(i, syncServer) {
        var status = STATUSES[i];
        if (!status) return;
        setActiveIndex(i);
        if (syncServer) {
            return submitStatus(status)
                .then(function () {
                    if (typeof antd !== 'undefined' && antd.message) {
                        antd.message.success('已更新为「' + status + '」');
                    }
                })
                .catch(function (e) {
                    if (typeof antd !== 'undefined' && antd.message) {
                        antd.message.error(e.message || '保存失败');
                    }
                });
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        var segRoot = document.getElementById('progress-status-segments');
        if (!segRoot) return;

        segRoot.querySelectorAll('.progress-status-seg').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var i = parseInt(btn.getAttribute('data-index'), 10);
                applyIndex(i, true);
            });
        });
    });
})();
