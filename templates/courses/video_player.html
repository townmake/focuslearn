
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="video-player-container">
    <div class="row">
        <!-- 视频播放区域 (左侧70%) -->
        <div class="col-md-8">
            <div class="video-wrapper">
                <video id="videoPlayer" controls width="100%">
                    <source src="{{ video_url }}" type="video/mp4">
                    您的浏览器不支持HTML5视频
                </video>
            </div>
            <!-- 评论列表 -->
            <div class="comment-list mt-4">
                <h4>评论列表</h4>
                {% block comment %}
                    {% include "courses/comment_component.html" with  comment_type="videos" type_id=video.id %} 
                {% endblock %}
            </div>
        </div>
    </div>
</div>



<style>
.video-player-container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 20px;
}

.video-wrapper {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0;
    overflow: hidden;
}

.video-wrapper video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

</style>
{% endblock %}
