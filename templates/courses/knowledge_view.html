<!-- 功能待完善 -->
{% extends "base.html" %}
{% block title %}知识点详情{% endblock %}
{% load static %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">
<link rel="stylesheet" href="{% static 'css/knowledge_view.css' %}">
<link rel="stylesheet" href="{% static 'aieditor-main/dist/style.css' %}">
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>
{% endblock %}


{% block content %}

<div class="embedded-container">
    <div class="detail-section">
        <div class="detail-header" >
            <h2>知识点详情</h2>
        </div>
        <div class="detail-content">
            <div class="basic-info">
                <h3 id="kp-title"                         
                    data-field="title"
                    contenteditable="false" 
                    ondblclick="startEdit(this)"
                    onblur="saveEdit(this)">
                </h3>
                <h3 id="kp-id" style="display: none;"></h3>
                <div class="info-item-desc">
                    <span class="info-label-basic">描述：</span>
                    <span 
                        class="info-value" 
                        id="kp-description" 
                        style="white-space: pre-wrap;background-color: #cfeaa0; padding: 8px; border-radius: 4px; min-width: 600px; "
                        contenteditable="false"
                        ondblclick="startEdit(this)"
                        onblur="saveEdit(this)">
                        暂无内容
                    </span>
                </div>
                <div class="info-item-group-order">
                    <div class="info-item-order">
                        <span class="info-label-basic">节点ID：</span>
                        <span class="info-value" id="kp-id-show">  </span>
                    </div>
                    <div class="info-item-order">
                        <span class="info-label-basic">父节点：</span>
                        <span class="info-value" id="kp-parent">  </span>
                    </div>
                    <div class="info-item-order">
                        <span class="info-label-basic">顺序：</span>
                        <span 
                            class="info-value" 
                            id="kp-brother_id" 
                            contenteditable="false"
                            ondblclick="startEdit(this)"
                            onblur="saveEdit(this)">
                            暂无信息
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 下部分 -->
    <div class="bottom-section">
        <div class="knowledge-content-container">
            <div class="detail-header" >
                <h2>详细内容</h2>
                <div class="action-buttons" >
                    <button class="edit-btn" id="save-btn-content">更新</button>
                </div>
            </div>
            <div class="kp-content-section">
                <div class="kp-editor-AI">
                    <div 
                        id="Aiditor-knowledge-content" 
                        style="width:fit-content; max-width:1900px;height:fit-content; min-height: 400px;border:1px solid #ddd; border-radius:4px;"frameborder="0">
                    </div>
                </div>
                <div class="kp-editor-annot">
                    <div id="knowledge-points-Annotation">
                        <div class="annotation-header">
                            <h3>知识点注释</h3>
                            <div id="annotation-edit-container" style="display:none;">
                                <div class="annotation-edit-box">
                                    <h4>编辑注释 <span id="edit-annotation-tag"></span></h4>
                                    <div class="form-group">
                                        <label>引用内容</label>
                                        <div id="edit-annotation-quote" class="quote-content"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>注释内容</label>
                                        <textarea id="edit-annotation-content" class="form-control" rows="3"></textarea>
                                    </div>
                                    <div class="annotation-actions">
                                        <button id="annotation-query-btn" class="btn btn-secondary">查询</button>
                                        <button id="annotation-save-btn" class="btn btn-primary">保存</button>
                                        <button id="annotation-cancel-btn" class="btn btn-light">取消</button>
                                    </div>
                                </div>
                            </div>
                            <div id="annotation-list">
                                <!-- 注释列表将通过JS动态加载 -->
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                // 加载知识点注释
                function loadKnowledgePointAnnotations(kpId) {
                    const section = document.querySelector('.kp-content-section');
                    const rightContainer = document.querySelector('.kp-editor-annot');
                    const annotationWrapper = document.getElementById('knowledge-points-Annotation');

                    // 清除旧数据
                    annotationWrapper.innerHTML = '';
                    
                    // 重置布局状态
                    section.classList.remove('has-annotations');
                    rightContainer.style.display = 'none';
                    
                    fetch(`/courses/api/knowledge_points/${kpId}/annotations/`)
                        .then(response => response.json())
                        .then(annotations => {                            
                            // 动态创建内容
                            if (annotations.length > 0) {
                                // 创建注释内容
                                const listContainer = document.createElement('div');
                                listContainer.className = 'annotations-list';

                                // 获取编辑器内容
                                let editorContent = ''; // 初始化为空字符串
                                if(window.AiEditor_knowledge) {
                                    editorContent = window.AiEditor_knowledge.getHtml();
                                } else {
                                    console.error('编辑器未初始化');
                                }
                                
                                annotations.forEach(annotation => {
                                    const item = document.createElement('div');
                                    item.className = 'annotation-item';

                                // 判断注释标签是否存在于编辑器内容中
                                const existsInEditor = editorContent.includes(`#${annotation.content_tag}`) ;
                                // 根据存在状态设置不同的颜色类
                                const colorClass = existsInEditor ? 'annotation-item-blue' : 'annotation-item-red';
                                item.classList.add(colorClass);

                                    item.innerHTML = `
                                        <div class="annotation-header">
                                        <span class="tag">#${annotation.content_tag}</span>
                                        <span class="date">${annotation.updated_at}</span>
                                        <button class="annotation-action-btn delete-btn-tag" 
                                                onclick="deleteAnnotation('${annotation.id}')">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="rgba(249,115,115,1)">
                                                <path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"></path>
                                            </svg>
                                        </button>
                                        </div>
                                        <div class="annotation-quote">${annotation.quote}</div>
                                        <div 
                                            class="annotation-content" 
                                            ondblclick="startEditAnnotationContent(this, '${annotation.content_tag }', '${annotation.id }', '${annotation.content}')"
                                            data-tag="{{ annotation.content_tag }}"
                                            data-original="{{ annotation.content }}">
                                            ${annotation.content}
                                        </div>
                                    `;
                                    listContainer.appendChild(item);
                                    });

                                    annotationWrapper.appendChild(listContainer);
                                    
                                    // 更新布局状态
                                    section.classList.add('has-annotations');
                                    rightContainer.style.display = 'block';
                            }
                        })
                        .catch(error => {
                            console.error('加载注释失败:', error);
                            section.classList.remove('has-annotations');
                        }
                    );
                }
                
                // 编辑注释内容的状态
                let editingAnnotationTag = null;
                let editingAnnotationElement = null;

                // 开始编辑注释内容
                function startEditAnnotationContent(element, tag, ID, originalContent) {
                    if (editingAnnotationTag) return; // 防止同时编辑多个注释
                    
                    editingAnnotationTag = tag;
                    editingAnnotationElement = element;
                    
                    // console.log('开始编辑注释内容:', originalContent);
                    // console.log('开始编辑注释内容1:', originalContent1);
                    console.log('开始编辑注释ID:', ID);

                    element.setAttribute('data-backup', originalContent); // 添加备份属性

                    const input = document.createElement('textarea');
                    input.value = originalContent;
                    input.style.width = '100%';
                    input.style.height = '100px';
                    input.style.marginBottom = '10px';
                    
                    
                    const actions = document.createElement('div');
                    actions.style.textAlign = 'right';
                    
                    const saveBtn = document.createElement('button');
                    saveBtn.textContent = '保存';
                    saveBtn.style.marginRight = '10px';
                    saveBtn.onclick = function() {
                        saveEditAnnotationContent(input.value,ID);
                    };
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = '取消';
                    cancelBtn.onclick = function() {
                        cancelEditAnnotationContent();
                    };
                    
                    actions.appendChild(saveBtn);
                    actions.appendChild(cancelBtn);
                    
                    element.innerHTML = '';
                    element.appendChild(input);
                    element.appendChild(actions);
                }

                // 保存编辑后的注释内容
                function saveEditAnnotationContent(newContent,ID) {
                    if (!editingAnnotationTag || !editingAnnotationElement) {
                        console.error('未找到正在编辑的注释标签');
                        return;
                    }
                    
                    const originalContent = editingAnnotationElement.getAttribute('data-original');
                    if (newContent === originalContent) {
                        console.log('注释内容未更改，取消编辑');
                        cancelEditAnnotationContent();
                        return;
                    }
                    
                    fetch(`/courses/api/knowledge_points/annotations/${ID}/`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({content: newContent})
                    })
                    .then(response => response.json())
                    .then(() => {
                        editingAnnotationElement.setAttribute('data-original', newContent);
                        editingAnnotationElement.textContent = newContent;
                        cancelEditAnnotationContent();
                        
                        // 重新加载注释列表以更新显示
                        loadKnowledgePointAnnotations(currentKnowledgePointId);
                    })
                    .catch(error => {
                        console.error('保存注释失败:', error);
                        antd.Modal.error({
                            title: '错误',
                            content: '保存注释失败，请重试'
                        });
                        cancelEditAnnotationContent();
                    });
                }

                // 取消编辑注释内容
                function cancelEditAnnotationContent() {
                    if (!editingAnnotationElement) return;
                    
                    const originalContent = editingAnnotationElement.getAttribute('data-backup');
                    editingAnnotationElement.innerHTML = '';
                    editingAnnotationElement.textContent = originalContent;
                    
                    editingAnnotationTag = null;
                    editingAnnotationElement = null;
                }


                // 删除注释
                function deleteAnnotation(ID) {
                    antd.Modal.confirm({
                        title: '确认删除',
                        content: '确定要删除这条注释吗？此操作不可撤销。',
                        okText: '删除',
                        cancelText: '取消',
                        onOk: () => {
                            fetch(`/courses/api/knowledge_points/annotations/${ID}/`, {
                                method: 'DELETE',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}'
                                }
                            })
                            .then(response => {
                                if (response.ok) {
                                    antd.message.success('删除成功');
                                    loadKnowledgePointAnnotations(currentKnowledgePointId);
                                } else {
                                    throw new Error('删除失败');
                                }
                            })
                            .catch(error => {
                                antd.message.error(error.message);
                            });
                        }
                    });
                }
                
                // 按钮事件
                document.getElementById('annotation-cancel-btn').addEventListener('click', function() {
                    document.getElementById('annotation-edit-container').style.display = 'none';
                    document.getElementById('annotation-list').style.display = 'block';
                });
                
                document.getElementById('annotation-save-btn').addEventListener('click', function() {
                    const tag = document.getElementById('edit-annotation-tag').textContent.replace('#', '');
                    const content = document.getElementById('edit-annotation-content').value;
                    
                    fetch(`/courses/api/knowledge_points/annotations/${tag}/`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({content: content})
                    })
                    .then(response => response.json())
                    .then(() => {
                        loadKnowledgePointAnnotations(currentKnowledgePointId);
                        document.getElementById('annotation-edit-container').style.display = 'none';
                        document.getElementById('annotation-list').style.display = 'block';
                    });
                });
                
                </script>
            </div>
        </div>
    </div>     
</div>

function TagComment(text) {
    // 显示加载状态
    const loadingModal = antd.Modal.info({
        title: '处理中...',
        content: '正在提交注释，请稍候',
        okButtonProps: { style: { display: 'none' } }
    });

    // 获取当前知识点ID
    const currentKnowledgePointId = document.getElementById('kp-id').value;
    if (!currentKnowledgePointId) {
        loadingModal.destroy();
        antd.Modal.error({
            title: '错误',
            content: '无法获取知识点ID'
        });
        return;
    }
    //弹窗添加注释content
    // 创建注释内容输入框
    const modal = antd.Modal.confirm({
        title: '添加注释',
        content: React.createElement('div', null, [
            React.createElement('div', { style: { marginTop: '5px', padding: '10px', backgroundColor: '#f0f0f0', borderRadius: '4px' } }, text),
            React.createElement('textarea', {
                id: 'annotation-content-input',
                placeholder: '请输入注释内容',
                style: { width: '100%', height: '100px', marginTop: '10px' }
            })
        ]),
        width: 600,
        okText: '提交',
        cancelText: '取消',
        onOk: () => {
            const annotationContent = document.getElementById('annotation-content-input').value.trim();
            if (!annotationContent) {
                antd.Modal.warning({
                    title: '警告',
                    content: '注释内容不能为空'
                });
                return;
            }
            submitAnnotation(text, annotationContent, currentKnowledgePointId, loadingModal);
        },
        onCancel: () => {
            loadingModal.destroy();
        }
    });
}

function submitAnnotation(text, content, currentKnowledgePointId, loadingModal) {
    // 发送POST请求到后端API
    fetch(`/courses/api/knowledge_points/${currentKnowledgePointId}/annotations/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            knowledge_point: currentKnowledgePointId,
            quote: text,
            content: content,
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('请求失败');
        }
        return response.json();
    })
    .then(data => {
        loadingModal.destroy();
        // 处理成功响应
        const number = data.content_tag; // 假设后端返回的注释编号在id字段
        const content = `<mark data-color="#8db3e2" style="background-color: #8db3e2; color: inherit">${text}</mark><span style=\"color: #ffffff\"><strong><mark data-color=\"#4a90e2\" style=\"background-color: #4a90e2; color: inherit\"><sup>🏷️#${number}🏷️</sup></mark></strong></span>`;
        window.AiEditor_knowledge.focus().insert(content);
        loadKnowledgePointAnnotations(currentKnowledgePointId); // 更新注释列表
    })
    .catch(error => {
        loadingModal.destroy();
        antd.Modal.error({
            title: '错误',
            content: error.message
        });
    });
}


// 更新按钮逻辑
document.getElementById('save-btn-content').addEventListener('click', function() {
    if (!window.AiEditor_knowledge) {
        console.error('Editor not ready');
        return;
    }
   
    const content=window.AiEditor_knowledge.getHtml();
        //将内容更新到后端，待确认是否发送请求更新编辑器里的内容

    console.log('Saving content:', content);

    const kpIdElement = document.getElementById('kp-id');

    const currentKnowledgePointId = kpIdElement.value;
    if (!currentKnowledgePointId || typeof currentKnowledgePointId !== 'string') {
        console.error('Invalid knowledge point ID:', currentKnowledgePointId);
        return;
    }

    fetch(`/courses/api/knowledge-points/${currentKnowledgePointId}/content/`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            content: content
        })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Save failed');
        }
        return response.json();
    })
    .catch(error => console.error('Save error:', error));
    
});

<script>
// let currentKnowledgePointId = null;


// 可编辑字段配置
const editableFields = [
    {
        id: 'kp-title',
        field: 'title',
        type: 'text',
        validate: (value) => value.trim() !== ''
    },
    {
        id: 'kp-description',
        field: 'description',
        type: 'text',
        validate: (value) => true
    },
    {
        id: 'kp-brother_id',
        field: 'brother_id',
        type: 'number',
        validate: (value) => !isNaN(value) && value > 0
    }
];

// 加载知识点详情
function loadKnowledgePointDetail() {

    // 从后端返回的参数knowledge_point_id获取知识点ID
    const kpId = {{ knowledge_point_id }};
    currentKnowledgePointId = kpId;

    fetch(`/courses/knowledge-points/${kpId}/`)
        .then(response => response.json())
        .then(data => {
            // 更新右侧面板所有字段
            editableFields.forEach(fieldConfig => {
                const element = document.getElementById(fieldConfig.id);
                if (element) {
                    const value = data[fieldConfig.field];
                    element.textContent = value !== undefined ? value : fieldConfig.default || '';
                    element.setAttribute('data-original-value', element.textContent);
                    element.setAttribute('contenteditable', 'false');
                }
            });

            document.getElementById('kp-parent').textContent = 
                data.parent ? data.parent_title : "根节点";
            document.getElementById('kp-id-show').textContent = kpId;
            
            // 更新AiEditor编辑器内容
            window.editorReadyPromise.then((editor) => {
                editor.setContent(data.content);
            }).catch(() => {
                console.error('编辑器初始化失败');
            });
        });
}

// 启用编辑模式
function startEdit(element) {
    const fieldConfig = editableFields.find(f => f.id === element.id);
    if (!fieldConfig) return;
    
    element.setAttribute('contenteditable', 'true');
    element.focus();
    // 保存原始内容以便比较
    if (!element.getAttribute('data-original-value')) {
        element.setAttribute('data-original-value', element.textContent);
    }
}

// 保存编辑内容
function saveEdit(element) {
    const fieldConfig = editableFields.find(f => f.id === element.id);
    if (!fieldConfig) return;
    
    element.setAttribute('contenteditable', 'false');
    const newValue = element.textContent.trim();
    const originalValue = element.getAttribute('data-original-value');
    
    if (newValue !== originalValue) {
        // 获取所有可编辑字段的值
        const allFields = editableFields.map(field => {
            const elem = document.getElementById(field.id);
            return {
                ...field,
                value: elem ? elem.textContent.trim() : ''
            };
        });
        
        currentKnowledgePointId = document.getElementById('kp-id').value;
        // 调用统一的保存函数
        saveMultipleFields(currentKnowledgePointId, allFields)
            .then(success => {
                if (success) {
                    // 更新所有字段的原始值
                    allFields.forEach(field => {
                        const elem = document.getElementById(field.id);
                        if (elem) {
                            elem.setAttribute('data-original-value', elem.textContent);
                        }
                    });
                    //刷新页面
                    if(fieldConfig.id === 'kp-title') {
                        // 如果是标题字段，刷新页面以更新树结构  
                          location.reload();
                    }else{
                        //重新加载知识点详情
                        loadKnowledgePointDetail(currentKnowledgePointId);
                    }
                } else {
                    // 如果保存失败，恢复原始值
                    element.textContent = originalValue;
                    antd.message.error('保存失败，请重试');
                }
            });
    }
}

// 保存多个字段
function saveMultipleFields(kpId, fields) {
    const fieldData = {};
    fields.forEach(field => {
        const element = document.getElementById(field.id);
        if (element) {
            const value = element.textContent;
            if (field.validate(value)) {
                fieldData[field.field] = value;
            } else {
                antd.message.error(`${field.field}格式不正确`);
                return Promise.reject(`${field.field}格式不正确`);
            }
        }
    });

    return fetch(`/courses/knowledge-points/${kpId}/`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(fieldData)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('保存失败');
        }
        return response.json();
    })
    .then(data => {
        antd.message.success('已保存');
        return true;
    })
    .catch(error => {
        console.error('保存失败:', error);
        antd.message.error('保存失败');
        return false;
    });
}



document.addEventListener('DOMContentLoaded', loadKnowledgePointDetail());


</script>
