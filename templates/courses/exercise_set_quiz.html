
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="quiz-container" >
    <div class="quiz-header">
        <h2>{{ exercise_set.name }}</h2>
        <small id="startTime" style="display: none;">答题开始时间：</small>
        <div class="quiz-progress">
            <span id="current-exercise">1</span>/<span id="total-exercises">{{ exercise_count }}</span>
        </div>
    </div>

    <div id="quiz-content">
        <!-- 习题内容将通过JavaScript动态加载 -->
        <div class="loading-spinner">加载中...</div>
    </div>

    <div class="quiz-actions">
        <button id="prev-btn" class="ant-btn" disabled>上一题</button>
        <button id="next-btn" class="ant-btn ant-btn-primary">下一题</button>
        <button id="submit-btn" class="ant-btn ant-btn-dangerous" style="display:none">提交练习</button>
    </div>
</div>

<script>
let exercise_set_id="{{ exercise_set.id }}";

// 缓存管理（单例）
const cacheManager = {
    key: `quiz_answers_${exercise_set_id}`,
    // 5分钟有效期（毫秒）
    expiry: 5 * 60 * 1000, 
    save: function() {
        try {
            localStorage.setItem(this.key, JSON.stringify({
                userAnswers,
                answerRecords,
                timestamp: new Date().getTime()
            }));
        } catch (e) {
            console.warn('本地存储失败:', e);
        }
    },
    load: function() {
        try {
            const data = localStorage.getItem(this.key);
            if (!data) return null;
            
            const parsed = JSON.parse(data);
            // 检查是否过期
            if (new Date().getTime() - parsed.timestamp > this.expiry) {
                this.clear();
                return null;
            }
            return parsed;
        } catch (e) {
            console.warn('读取缓存失败:', e);
            return null;
        }
    },
    clear: function() {
        localStorage.removeItem(this.key);
    }
};

// 初始化时加载缓存
const cachedData = cacheManager.load();
let currentExerciseIndex = 0;
let exercises = [];
let userAnswers = cachedData?.userAnswers || {};
let answerRecords = cachedData?.answerRecords || {
    exercise_set_id: "{{ exercise_set.id }}",
    start_time: new Date().toISOString(),
    answers: {},
    total_time: 0
};
let per_startTime = new Date();

// // 加载缓存
// const cachedData = cacheManager.load();
if (cachedData) {
    userAnswers = cachedData.userAnswers || {};
    answerRecords = cachedData.answerRecords || {
        exercise_set_id: "{{ exercise_set.id }}",
        start_time: new Date().toISOString(),
        answers: {},
        total_time: 0
    };
}

// 初始化答题
async function initQuiz() {
    //设定答题开始时间
    const startTime = new Date();
    document.querySelector('body').dataset.startTime = startTime;
    // 获取练习集ID
    try {
        // 获取练习集所有习题
        const response = await fetch(`{% url 'courses:exercise-set-exercises' exercise_set.id %}`);
        exercises = await response.json();        
        // 更新总题数显示
        document.getElementById('total-exercises').textContent = exercises.length;
        
        // 加载第一道题
        loadExercise(0);
    } catch (error) {
        document.getElementById('quiz-content').innerHTML = `
            <div class="error-message">加载失败: ${error.message}</div>
        `;
    }
}

// 加载指定索引的习题
async function loadExercise(index) {
    if (index < 0 || index >= exercises.length) return;

    // 记录上一题答题时间
    if (currentExerciseIndex >= 0 && exercises[currentExerciseIndex]) {
        const now = new Date();
        const timeSpent = Math.floor((now - per_startTime) / 1000);
        const currentExercise = exercises[currentExerciseIndex];
        
        answerRecords.answers[currentExercise.id] = {
            id: currentExercise.id,
            title: currentExercise.title || '',
            order: currentExercise.order || 0,
            answer: userAnswers[currentExercise.id] || '',
            time_spent: timeSpent
        };
        answerRecords.total_time += timeSpent;
    }
    
    currentExerciseIndex = index;
    const exercise = exercises[index];

    // 恢复已保存的答案
    const savedAnswer = userAnswers[exercise.id];
    if (savedAnswer) {
        if (exercise.question_type === 'multiple_choice') {
            // 多选题处理
            const answers = savedAnswer.split(',');
            document.querySelectorAll('[name="answer"]').forEach(input => {
                input.checked = answers.includes(input.value);
            });
        } else if (exercise.question_type === 'single_choice') {
            // 单选题处理
            const radio = document.querySelector(`[name="answer"][value="${savedAnswer}"]`);
            if (radio) radio.checked = true;
        } else if (exercise.question_type === 'fill_blank') {
            // 填空题处理
            document.querySelector('[name="answer"]').value = savedAnswer;
        } else if (['cloze_test', 'reading_answer'].includes(exercise.question_type)) {
            // 子题处理
            if (typeof savedAnswer === 'object') {
                Object.entries(savedAnswer).forEach(([qId, answerData]) => {
                    const selector = `[name="answer_${qId}"][value="${answerData.answer}"]`;
                    const input = document.querySelector(selector);
                    if (input) {
                        input.checked = true;
                        // 高亮显示已选答案
                        const label = input.closest('label');
                        if (label) {
                            label.style.backgroundColor = '#e6f7ff';
                        }
                    }
                });
            }
        } else {
            // 其他题型
            document.querySelector('[name="answer"]').value = savedAnswer;
        }
    } else {
        // 清除之前的选择
        document.querySelectorAll('[name="answer"], [name^="answer_"]').forEach(input => {
            if (input.type === 'checkbox' || input.type === 'radio') {
                input.checked = false;
            } else {
                input.value = '';
            }
            // 清除高亮样式
            const label = input.closest('label');
            if (label) {
                label.style.backgroundColor = '';
            }
        });
    }
    
    // 更新进度显示
    document.getElementById('current-exercise').textContent = index + 1;

    // 更新习题开始时间-每道题单独记录时间点
    per_startTime = new Date();
    document.getElementById('startTime').textContent = `答题开始时间：${per_startTime.toLocaleString()}`;
    
    // 如果是最后一道题，显示提交按钮
    if (index === exercises.length - 1) {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'inline-block';
    } else {
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('submit-btn').style.display = 'none';
    }
    
    // 如果是第一道题，禁用上一题按钮
    document.getElementById('prev-btn').disabled = index === 0;
    
    // 加载习题内容
    try {
        let url;
        let data = exercises[index];

        renderExercise_quiz(data);
    } catch (error) {
        document.getElementById('quiz-content').innerHTML = `
            <div class="error-message">加载习题失败: ${error.message}</div>
        `;
    };
}

// 渲染习题
function renderExercise_quiz(exerciseData) {
    const container = document.getElementById('quiz-content');

    if (exerciseData.question_type === 'cloze_test' || exerciseData.question_type === 'reading_answer') {
        //通过exercise.id获取子习题数据
        if (exerciseData.id ) {
            // 异步获取子习题数据
            const exerciseId = exerciseData.id;
            fetch(`/courses/api/exercises/${exerciseData.id}/parentid/`)
                .then(response => response.json())
                .then(data => {
                    const subExercise = data; // 返回的习题作为子习题
                    if (exerciseData.question_type === 'cloze_test') {
                    renderSubQuestions(container, exerciseData, subExercise,parentType="cloze_test");
                    } else if (exerciseData.question_type === 'reading_answer') {
                        renderSubQuestions(container, exerciseData, subExercise,parentType="reading_answer");
                    }
                })
                .catch(error => {
                    document.getElementById('quiz-content').innerHTML = `
                        <div class="error-message">加载子习题失败: ${error.message}</div>
                    `;
                });
            return;
        } else {
            html = `<h3>${question.content}</h3>`;
        }
        
        container.innerHTML = `
            <div class="main-question">
                ${renderQuestion(exerciseData.main_question)}
            </div>
            <div class="sub-questions">
                ${exerciseData.sub_questions.map(q => renderQuestion(q)).join('')}
            </div>
        `;
    } else {
        console.log('[DEBUG] 处理普通题型:', exerciseData.question_type);
        container.innerHTML = renderQuestion(exerciseData);
    }

    
    console.log('[DEBUG] 习题渲染完成');
}
// 渲染母子问题
function renderSubQuestions(container, mainQuestionData, subExercise, parentType = null) {
    container.innerHTML = `
        <div class="main-question">
            ${renderQuestion(mainQuestionData)}
        </div>
        <div class="sub-questions">
            ${subExercise.exercises.map(exercise => renderQuestion(exercise,isSubQuestion =true,parentType)).join('')}
        </div>
    `;
}
// 渲染单个问题
function renderQuestion(question, isSubQuestion = false, parentType = null) {
    console.log('[DEBUG] 问题数据:', question);
    
    // 根据题型返回不同的HTML
    let html;
    switch(question.question_type) {
        case 'single_choice':
            console.log('[DEBUG] 渲染单选题');
            if (!question.options) {
                console.error('[ERROR] 单选题缺少options字段');
                return '<div class="error-message">题目数据不完整</div>';
            }
            
            // 子题特殊处理
            if (isSubQuestion) {
                if (parentType === 'cloze_test') {
                    // 完形填空子题：一行显示题号和选项
                    html = `
                    <div class="question sub-question cloze-sub" data-id="${question.id}" Type-name="${parentType}">
                        <span class="sub-order">${question.order}.</span>
                        <div class="options inline-options">
                            ${(() => {
                                const entries = Object.entries(question.options);
                                let html = '';
                                for (let i = 0; i < entries.length; i += 4) {
                                    html += `<div class="option-group">`;
                                    for (let j = 0; j < 4 && i + j < entries.length; j++) {
                                        const [key, value] = entries[i + j];
                                        html += `
                                            <label>
                                                <input type="radio" name="answer_${question.id}" value="${key}" data-id="${question.id}">
                                                ${key}. ${value}
                                            </label>`;
                                    }
                                    html += `</div>`;
                                }
                                return html;
                            })()}
                        </div>
                    </div>`;
                } else {
                    // 阅读理解子题：题号+内容一行，选项单独一行
                    html = `
                    <div class="question sub-question reading-sub" data-id="${question.id}" Type-name="${parentType}">
                        <div class="sub-content">
                            <span class="sub-order">${question.order}.</span>
                            <span class="sub-text">${question.content}</span>
                        </div>
                        <div class="options">
                            ${(() => {
                                const entries = Object.entries(question.options);
                                let html = '';
                                for (let i = 0; i < entries.length; i += 4) {
                                    html += `<div class="option-group">`;
                                    for (let j = 0; j < 4 && i + j < entries.length; j++) {
                                        const [key, value] = entries[i + j];
                                        html += `
                                            <label>
                                                <input type="radio" name="answer_${question.id}" value="${key}" data-id="${question.id}">
                                                ${key}. ${value}
                                            </label>`;
                                    }
                                    html += `</div>`;
                                }
                                return html;
                            })()}
                        </div>
                    </div>`;
                }
            } 
            // 普通单选题
            else if(!question.content){
                html = `<div class="question">
                    <h3>${question.content}</h3>
                    <div class="options">
                        ${Object.entries(question.options).map(([key, value]) => `
                            <label>
                                <input type="radio" name="answer" value="${key}">
                                ${key}. ${value}
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            } else {
                html = `
                <div class="question">
                    <h3>${question.content}</h3>
                    <div class="options">
                        ${Object.entries(question.options).map(([key, value]) => `
                            <label>
                                <input type="radio" name="answer" value="${key}">
                                ${key}. ${value}
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            }
            break;
        case 'multiple_choice':
            if (!question.options) {
                console.error('[ERROR] 多选题缺少options字段');
                return '<div class="error-message">题目数据不完整</div>';
            }
            html = `
                <div class="question">
                    <h3>${question.content}</h3>
                    <div class="options">
                        ${Object.entries(question.options).map(([key, value]) => `
                            <label>
                                <input type="checkbox" name="answer" value="${key}">
                                ${key}. ${value}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
            break;
        case 'fill_blank':
            html = `
                <div class="question">
                    <h3>${question.content.replace('___', '<input type="text" name="answer">')}</h3>
                </div>
            `;
            break;
        case 'cloze_test':
            html = `
                <div class="question">
                    <h3>${question.content}</h3>
                </div>
            `;
            break;
        case 'reading_answer':
            html = `
                <div class="question">
                    <h3>${question.content}</h3>
                </div>
            `;
            break;
        default:
            html = `
                <div class="question">
                    <h3>${question.content}</h3>
                    <textarea name="answer" rows="5"></textarea>
                </div>
            `;
    }
    // 添加历史答案提示
    if (userAnswers[question.id]) {
        let historyAnswer = '';
        if (typeof userAnswers[question.id] === 'object') {
            // 处理子题历史答案
            historyAnswer = Object.values(userAnswers[question.id])
                .map(a => `小题${a.order}: ${a.answer}`)
                .join('; ');
        } else {
            // 处理普通题历史答案
            historyAnswer = userAnswers[question.id];
        }
        html += `<div class="history-answer">您之前的答案为: ${historyAnswer}</div>`;
    }
    return html;
}


// 事件监听
document.getElementById('prev-btn').addEventListener('click', () => {
    saveCurrentAnswer();
    loadExercise(currentExerciseIndex - 1);
});

document.getElementById('next-btn').addEventListener('click', () => {
    saveCurrentAnswer();
    loadExercise(currentExerciseIndex + 1);
});

document.getElementById('submit-btn').addEventListener('click', () => {
    saveCurrentAnswer();
    submitQuiz();
});

// 保存当前答案
function saveCurrentAnswer() {
    const exercise = exercises[currentExerciseIndex];
    
    // 处理普通题目
    if (!['cloze_test', 'reading_answer'].includes(exercise.question_type)) {
        const answerInputs = document.querySelectorAll(`[name="answer"]`);
        if (exercise.question_type === 'multiple_choice') {
            const answers = Array.from(answerInputs)
                .filter(input => input.checked)
                .map(input => input.value);
            userAnswers[exercise.id] = answers.join(',');
        } else if (exercise.question_type === 'single_choice') {
            const selected = Array.from(answerInputs).find(input => input.checked);
            userAnswers[exercise.id] = selected?.value || '';
        } else {
            userAnswers[exercise.id] = answerInputs[0]?.value || '';
        }
    }
    // 处理完形填空/阅读理解子题
    else {
        const subAnswers = {};
        const subQuestions = document.querySelectorAll('.sub-question');
        
        subQuestions.forEach(questionEl => {
            const questionId = questionEl.dataset.id;
            const selected = questionEl.querySelector('[name^="answer_"]:checked');
            if (selected) {
                subAnswers[questionId] = {
                    order: questionEl.querySelector('.sub-order')?.textContent.replace('.','') || '',
                    answer: selected.value
                };
            }
        });
        userAnswers[exercise.id] = subAnswers;
    }
    
    console.log('[DEBUG] 保存答案:', userAnswers);
    // 自动保存到缓存
    cacheManager.save();
}

// 显示确认弹窗
function showConfirmation() {
    const modal = document.createElement('div');
    modal.style.position = 'fixed';
    modal.style.top = '0';
    modal.style.left = '0';
    modal.style.width = '100%';
    modal.style.height = '100%';
    modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
    modal.style.display = 'flex';
    modal.style.justifyContent = 'center';
    modal.style.alignItems = 'center';
    modal.style.zIndex = '1000';
    
    const modalContent = document.createElement('div');
    modalContent.style.backgroundColor = 'white';
    modalContent.style.padding = '20px';
    modalContent.style.borderRadius = '8px';
    modalContent.style.maxWidth = '600px';
    modalContent.style.width = '80%';
    modalContent.style.maxHeight = '80vh';
    modalContent.style.overflowY = 'auto';
    
    modalContent.innerHTML = `
        <h3 style="margin-bottom: 20px;">请确认您的答案</h3>
        <div class="answer-list" style="margin-bottom: 20px;">
            ${Object.values(answerRecords.answers).map(item => {
                let answerDisplay = item.answer || '未作答';
                // 处理子题答案
                if (typeof item.answer === 'object') {
                    answerDisplay = Object.values(item.answer)
                        .map(sub => `小题${sub.order}: ${sub.answer || '未作答'}`)
                        .join('<br>');
                }
                return `
                <div class="answer-item" style="margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #eee;">
                    <div style="font-weight: bold;">#${item.order} ${item.title}</div>
                    <div style="margin-top: 5px;">答案: ${answerDisplay}</div>
                    <div style="margin-top: 5px;">耗时: ${item.time_spent}秒</div>
                </div>`;
            }).join('')}
        </div>
        <div style="display: flex; justify-content: space-between;">
            <button id="cancel-submit" class="ant-btn" style="margin-right: 10px;">返回修改</button>
            <button id="confirm-submit" class="ant-btn ant-btn-primary">确认提交</button>
        </div>
    `;
    
    modal.appendChild(modalContent);
    document.body.appendChild(modal);
    
    // 返回修改按钮
    modalContent.querySelector('#cancel-submit').addEventListener('click', () => {
        document.body.removeChild(modal);
    });
    
    // 确认提交按钮
    modalContent.querySelector('#confirm-submit').addEventListener('click', async () => {
        await doSubmit();
        document.body.removeChild(modal);
    });
}

// 提交整个练习
async function submitQuiz() {
    // 记录最后一道题
    const now = new Date();
    const currentExercise = exercises[currentExerciseIndex];
    const timeSpent = Math.floor((now - per_startTime) / 1000);
    
    answerRecords.answers[currentExercise.id] = {
        id: currentExercise.id,
        title: currentExercise.title || '',
        order: currentExercise.order || 0,
        answer: userAnswers[currentExercise.id] || '',
        time_spent: timeSpent
    };
    answerRecords.total_time += timeSpent;
    
    // 显示确认弹窗
    showConfirmation();
}

// 实际提交函数
    async function doSubmit() {
        console.log('[DEBUG] 提交答案:', userAnswers);
        try {
            const response = await fetch(`{% url 'courses:exercise-set-submit' exercise_set.id %}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    exercise_set_id: "{{ exercise_set.id }}",
                    answers: answerRecords.answers,
                    total_time: answerRecords.total_time
                })
            });
            
            const result = await response.json();
            if (response.ok) {
                if (result.redirect_url) {
                    window.location.href = result.redirect_url;
                } else {
                    alert(result.message || '提交成功');
                }
            } else {
                alert(result.message || '提交失败');
            }
        } catch (error) {
            alert('提交失败: ' + error.message);
        }
    }

function calculateTimeSpent() {
    // 计算用时的逻辑
    const startTime = document.querySelector('body').dataset.startTime || new Date();
    const endTime = new Date();
    spent_time = Math.floor((endTime - new Date(startTime)) / 1000); // 返回秒数
    console.log('[DEBUG] 计算用时:', spent_time);
    return spent_time; // 返回秒数
}
// 初始化
document.addEventListener('DOMContentLoaded', initQuiz);
</script>

    padding: 15px;
    background: #f8f9fa;
    border-radius: 6px;
    margin-bottom: 20px;
    border-left: 3px solid #1890ff;
}
.reading-sub .sub-content {
    margin-bottom: 12px;
    font-size: 1.1em;
    display: flex;
    align-items: center;
}
.reading-sub .sub-order {
    font-weight: bold;
    color: #1890ff;
    margin-right: 8px;
}

    display: block;

    .option-group {

    }

}

.quiz-progress {
    font-size: 1.2em;
    font-weight: bold;
}

.quiz-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
}

.question {
    margin-bottom: 20px;
