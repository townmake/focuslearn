{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>
{% block title %}章节方法-{{ subject.name }}{% endblock %}



{% block content %}
<body subjectId="{{ subject.id }}">

<div class="method-summary-container">
    <!-- 查询表单 -->
    <div class="summary-header" style="margin-bottom: 0px;">
        <form method="get" class="ant-form" style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;width: 160px!important;">方法名称</label>
                <input type="text" class="ant-input" name="name" placeholder="输入方法名称">
            </div>
            <!-- 创建时间范围 -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <label class="ant-form-item-label" style="margin-bottom: 0;width: 160px!important;">创建时间</label>
                <input type="date" class="ant-input" name="created_at_start" placeholder="开始日期">
                <span>至</span>
                <input type="date" class="ant-input" name="created_at_end" placeholder="结束日期">
            </div>
            <a href="?" class="ant-btn">重置</a>
            <button type="submit" class="ant-btn ant-btn-primary" id="submit">查询</button>
            <a href="/courses/subject/{{subject.id }}/">返回科目</a>
        </form>
    </div>


    <!-- 方法列表表格 -->
    <div id="Methods-table1" key={method_tableKey}></div>
</div>

<script>
// 表格列配置
const methodColumns = [
    {
        title: '章节名称',
        dataIndex: 'chapter_title',
        key: 'chapter_title',
        render: (text) => text || '未知章节'
    },
    {
        title: '题型方法',
        dataIndex: 'name',
        key: 'name'
    },
    {
        title: '关联习题数',
        dataIndex: 'exercise_count',
        key: 'exercise_count',
        sorter: (a, b) => a.name.localeCompare(b.name)
    },
    {
        title: '重要度',
        dataIndex: 'important_level',
        key: 'important_level',
        sorter: (a, b) => a.name.localeCompare(b.name)
    },
    {
        title: '难度',
        dataIndex: 'difficulty_level',
        key: 'difficulty_level',
        sorter: (a, b) => a.name.localeCompare(b.name)
    },
    {
        title: '创建时间',
        dataIndex: 'created_at',
        key: 'created_at',
        render: (text) => new Date(text).toLocaleString()
    },
    {
        title: '操作',
        key: 'actions',
        render: (_, record) => [
            React.createElement(antd.Button, {
                type: 'text',
                onClick: () => editMethod(record.id)
            }, '编辑'),
            React.createElement(antd.Button, {
                type: 'text',
                danger: true,
                onClick: () => deleteMethod(record.id)
            }, '删除'),
            React.createElement(antd.Button, {
                type: 'text',
                onClick: () => viewMethodDetail(record.id)
            }, '详情')
        ]
    }
];

// 加载总结记录数据
function loadMethods(params = {}) {
    forceRerender_method(); // 强制重建组件

    const container = document.getElementById('Methods-table1');
    container.innerHTML = '<div class="loading-spinner"></div>';
    
    // 默认分页参数
    const defaultParams_Method = {
        name: params.name || '',
        created_at_start: params.created_at_start || '',
        created_at_end: params.created_at_end || '',
        page: params.page || 1,
        page_size: params.page_size || 10
    };
    
    // 构建查询参数
    const queryParams_Method = new URLSearchParams(defaultParams_Method).toString();
    const subjectId = document.body.getAttribute('subjectId');
    if (!subjectId || isNaN(subjectId)) {
        console.error('Invalid subjectId:', subjectId);
        return;
    }
    const url = `{% url 'courses:method_list_subject' 0 %}`.replace('0', subjectId);
    console.log('加载方法数据，参数:', defaultParams_Method);
    
    fetch(`${url}?${queryParams_Method}`, {
        headers: {
            'Accept': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(responseData => {
        if (!responseData) {
            throw new Error('No data received from server');
        }

        let MethodData = Array.isArray(responseData) ? responseData : (responseData.results || []);
        const totalCount = responseData.count || MethodData.length;
        
        const paginationData = {
            current: defaultParams_Method.page || 1,
            pageSize: defaultParams_Method.page_size,
            total: totalCount,
            showSizeChanger: true,
            pageSizeOptions: ['10', '20', '50'],
            showTotal: total => `共 ${total} 条记录`,
            onChange: (page, pageSize) => {
                loadMethods({...params, page, page_size: pageSize});
            }
        };
        
        const formattedData = MethodData.map(method => ({
            key: method.id,
            name: method.name,
            chapter_title: method.chapter_title, // 直接使用后端返回的章节标题
            created_at: method.created_at,
            exercise_count: method.exercise_count,
            id: method.id,
            difficulty_level: method.difficulty_level,
            important_level: method.important_level
        }));
        // 渲染表格组件
        ReactDOM.render(
            React.createElement(antd.Table, {
                columns: methodColumns,
                dataSource: formattedData,
                bordered: true,
                pagination: paginationData
            }),
            container
        );
    })
    .catch(error => {
        console.error('Error loading methods:', error);
        container.innerHTML = `
            <div class="error-message">
                加载失败: ${error.message}
                <button class="ant-btn" onclick="loadMethods()">重试</button>
            </div>
        `;
    });
}


// 表格实例管理
let method_tableKey = Date.now();  // 初始化一个基于时间戳的key

function forceRerender_method() {
    method_tableKey = Date.now(); // 更新key值
    const container = document.getElementById('Methods-table1');
    ReactDOM.unmountComponentAtNode(container); // 卸载旧组件
}

// 页面加载时初始化表格数据
document.addEventListener('DOMContentLoaded', () => {
    console.log('页面加载完成，开始加载方法数据');

    loadMethods(); // 初始加载方法数据

});
// 编辑
function editMethod(methodId) {
    const baseUrl = `{% url 'courses:method_detail' 0 %}`.replace('0', methodId);
    window.open(baseUrl, '_blank');
}
// 查看
function viewMethodDetail(methodId) {

    const baseUrl = `{% url 'courses:method_detail' 0 %}`.replace('0', methodId);
    // window.location.href = baseUrl;
    // 在新页面打开链接
    window.open(baseUrl, '_blank');
}
// 删除
function deleteMethod(methodId) {
    if (confirm('确定要删除这个练习集吗？')) {
        fetch(`{% url 'courses:method_delete' 0 %}`.replace('0', methodId), {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                loadMethods(); // 刷新列表
            } else {
                return response.json().then(data => {
                    throw new Error(data.message || '删除失败');
                });
            }
        })
        .catch(error => {
            alert(error.message || '请求出错');
        });
    }
}
// 编辑

// 表单提交处理
document.querySelector('.summary-header form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const params = Object.fromEntries(formData.entries());
    loadMethods(params);
});

// 重置按钮处理
document.querySelector('.summary-header form a[href="?"]')?.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.summary-header form').reset();
    loadMethods(); // 加载无参数的全量数据
});





// 确保React和antd加载完成
function checkDependencies() {
    if (window.React && window.antd && window.ReactDOM) {
    } else {
        setTimeout(checkDependencies, 100);
    }
}

// 检查依赖
checkDependencies();


</script>

<style>

.method-summary-container {
    padding: 0px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    min-height: 400px;
}

.summary-header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;    
    padding: 16px;
    background: #f5f5f5;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    margin-top: 20px;
}

.ant-table {
    background: #fff;
}

.loading-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 300px;
}
</style>
{% endblock %}
