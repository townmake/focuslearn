
{% extends "base.html" %}

{% block content %}
{% load static %}
<script src="{% static 'vendor/js/react.production.min.js' %}"></script>
<script src="{% static 'vendor/js/react-dom.production.min.js' %}"></script>
<script src="{% static 'vendor/js/antd.min.js' %}"></script>
<link rel="stylesheet" href="{% static 'vendor/css/antd.min.css' %}">

<script>
    // 传递Django模板变量给JS
    window.quizConfig = {
        reviewSetId: "{{ review_set_id }}",
        exerciseCount: "{{ exercise_count }}",
        reviewSetUrl: "{% url 'courses:review-set-exercises' review_set_id %}",
        submitUrl: "{% url 'courses:review-set-submit' review_set_id %}",
        csrfToken: "{{ csrf_token }}"
    };
</script>


<div class="quiz-container" >
    <div class="quiz-header">
        <h2>{{ review_set.name }}</h2>
        <small id="startTime" style="display: none;">答题开始时间：</small>
        <div class="quiz-progress">
            <span id="current-exercise">1</span>/<span id="total-exercises">{{ exercise_count }}</span>
        </div>
    </div>

    <div id="quiz-content">
        <!-- 习题内容将通过JavaScript动态加载 -->
        <div class="loading-spinner">加载中...</div>
    </div>

    <div class="quiz-actions">
        <button id="prev-btn" class="ant-btn" disabled>上一题</button>
        <button id="show-btn" class="ant-btn">显示答案</button>
        <button id="next-btn" class="ant-btn ant-btn-primary">下一题</button>
        <button id="submit-btn" class="ant-btn ant-btn-dangerous" style="display:none">提交练习</button>
    </div>
    <div class="quiz-rate">
        <div id="rate-container">
            <!-- 评价部分通过JavaScript动态加载 -->
            <div class="loading-spinner">加载中</div>
        </div>
    </div>
</div>

<style>
    /* 开关组件样式 */
.toggle-switch {
    position: relative;
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    width: 200px;
    height: 34px;
}
.toggle-switch-label {
    margin-left: 0px;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    margin-left: 100px;
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: 0.4s;
    border-radius: 34px;
}

.slider:before {
    margin-left: 20px;
    position: absolute;
    content: '';
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: 0.4s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #2196f3;
}

input:checked + .slider:before {
    transform: translateX(26px);
}



/* 评分组件样式 */
#rate-container {
    transition: all 0.3s ease;
    opacity: 1;
    visibility: visible;
    height: auto;
    overflow: visible;
    margin-top: 20px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 4px;
}

#rate-container.hidden {
    opacity: 0;
    visibility: hidden;
    height: 0;
    overflow: hidden;
    padding: 0;
    margin: 0;
}

.quiz-rating {
    padding: 25px;
}

.quiz-rating h3 {
    margin-bottom: 15px;
    color: #333;
}

.quiz-rating textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    min-height: 100px;
}

.quiz-rating > div {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
}

.quiz-rating > div > span {
    margin-right: 10px;
    min-width: 60px;
}



.quiz-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

/* 子题通用样式 */
.sub-question {
    margin: 10px 0;
    padding: 0px 0px;
    background-color: #f8f9fa;
    border-radius: 2px;
    /* 对齐 */
    display: flex;
    align-items: center;
}
.quiz-rate {
    margin-top: 20px;
    padding: 10px;
    background-color: #f8f9fa;
    border-radius: 4px;
}


/* 选项分组 */
.option-group {
    display: flex;
    gap: 15px;
    margin-bottom: 10px;
}
.option-group:last-child {
    margin-bottom: 0;
}

.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.quiz-progress {
    font-size: 1.2em;
    font-weight: bold;
}

.quiz-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
}

.question {
    margin-bottom: 20px;
}

.options {
    margin-top: 15px;
}

.options label {
    display: block;
    margin: 8px 0;
    cursor: pointer;
}

textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.loading-spinner {
    text-align: center;
    padding: 50px;
    font-size: 1.2em;
}

.error-message {
    color: #ff4d4f;
    text-align: center;
    padding: 20px;
}
</style>

<script>
// 确保所有依赖已加载
function initApp() {
    if (!window.React || !window.ReactDOM || !window.antd || !window.quizConfig) {
        console.error('Missing dependencies:', {
            React: !!window.React,
            ReactDOM: !!window.ReactDOM,
            antd: !!window.antd,
            quizConfig: !!window.quizConfig
        });
        setTimeout(initApp, 100);
        return;
    }
    
    // 直接调用初始化函数，确保编译后的JS已导出
    if (window.initializeQuizApp) {
        window.initializeQuizApp();
    } else {
        console.error('initializeQuizApp function not found');
        document.getElementById('quiz-content').innerHTML = 
            '<div class="error-message">系统初始化失败，请刷新页面</div>';
    }
}

// 加载编译后的JS文件
const quizScript = document.createElement('script');
quizScript.src = "{% static 'js/dist/courses_review_quiz_quick.js' %}";
quizScript.onload = initApp;
quizScript.onerror = function() {
    console.error('Failed to load quiz script');
    document.getElementById('quiz-content').innerHTML = 
        '<div class="error-message">加载资源失败，请刷新页面重试</div>';
};
document.body.appendChild(quizScript);
</script>
{% endblock %}
