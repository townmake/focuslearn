
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="video-container">
    <h2>{{ video.title }}</h2>
    <video controls width="100%">
        <source src="{{ video.url }}" type="video/mp4">
        您的浏览器不支持视频标签。
    </video>
    <div class="video-description">
        {{ video.description|safe }}
    </div>
    
    <!-- 引入评论组件 -->
    {% include "courses/comment_component.html" with comment_type="videos" type_id=video.id %}
</div>

<style>
.video-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}
.video-description {
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 4px;
}
</style>
{% endblock %}
