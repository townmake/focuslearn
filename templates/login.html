{% extends 'base.html' %}
{% load static %}

{% block title %}登录 · 个人时间投入管理{% endblock %}

{% block content %}
<div class="login-container">
    {% if error_message %}
    <div class="alert alert-danger">
        {{ error_message }}
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <input type="text" name="username" class="form-control" placeholder="用户名" autocomplete="username" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" class="form-control" placeholder="密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">登录</button>
    </form>
</div>
{% endblock %}
