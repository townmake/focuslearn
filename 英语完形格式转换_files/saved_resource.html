<body class="min-h-screen flex flex-col items-center py-12 px-4">
    <div class="w-full max-w-3xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">英语完形填空格式转换工具</h1>
            <p class="text-gray-600">将完形填空选项和答案转换为Excel表格</p>
        </div>

        <div class="glass-card p-8 mb-8">
            <div class="mb-6">
                <label for="optionsInput" class="block text-gray-700 font-medium mb-2">
                    <i class="fas fa-list-ul mr-2 text-indigo-500"></i>输入选项格式
                </label>
                <textarea id="optionsInput" rows="5" class="w-full input-field p-4 rounded-lg" placeholder="例如: 1. [A] affected [B] achieved [C] extracted [D] restored"></textarea>
                <p class="text-sm text-gray-500 mt-2">每行一个题目，格式为: 序号. [选项字母] 选项内容</p>
            </div>

            <div class="mb-8">
                <label for="answersInput" class="block text-gray-700 font-medium mb-2">
                    <i class="fas fa-check-circle mr-2 text-indigo-500"></i>输入答案格式
                </label>
                <textarea id="answersInput" rows="3" class="w-full input-field p-4 rounded-lg" placeholder="例如: 1.A 2.B 3.C"></textarea>
                <p class="text-sm text-gray-500 mt-2">格式为: 序号.选项字母 (用空格或制表符分隔)</p>
            </div>

            <button id="convertBtn" class="btn-primary py-3 px-6 rounded-lg font-medium w-full">
                <i class="fas fa-exchange-alt mr-2"></i>转换格式
            </button>
        </div>

        <div id="resultSection" class="glass-card p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">
                    <i class="fas fa-table mr-2 text-indigo-500"></i>转换结果
                </h2>
                <button id="downloadBtn" class="btn-primary py-2 px-4 rounded-lg text-sm">
                    <i class="fas fa-download mr-2"></i>下载Excel
                </button>
            </div>

            <div class="overflow-x-auto">
                <table id="resultTable" class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="p-3 text-left text-gray-700 border-b">题号</th>
                            <th class="p-3 text-left text-gray-700 border-b">选项JSON</th>
                            <th class="p-3 text-left text-gray-700 border-b">答案</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-6 text-center text-gray-500 text-sm">
        <p>created by <a href="https://space.coze.cn/" class="text-indigo-500 hover:underline">coze space</a></p>
        <p>页面内容均由 AI 生成，仅供参考</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const optionsInput = document.getElementById('optionsInput');
            const answersInput = document.getElementById('answersInput');
            const convertBtn = document.getElementById('convertBtn');
            const resultSection = document.getElementById('resultSection');
            const resultTableBody = document.getElementById('resultTableBody');
            const downloadBtn = document.getElementById('downloadBtn');
            
            let excelData = [];

            convertBtn.addEventListener('click', function() {
                const optionsText = optionsInput.value.trim();
                const answersText = answersInput.value.trim();
                
                if (!optionsText || !answersText) {
                    alert('请填写选项和答案内容');
                    return;
                }

                // 解析选项
                const optionLines = optionsText.split('\n');
                const questions = [];
                
                optionLines.forEach(line => {
                    const match = line.match(/^(\d+)\.\s*\[([A-Z])\]\s*(.+?)\s*(\[([A-Z])\]\s*(.+?))*$/);
                    if (match) {
                        const questionNum = match[1];
                        const options = {};
                        
                        // 提取所有选项
                        const optionParts = line.split(/\[([A-Z])\]/).slice(1);
                        for (let i = 0; i < optionParts.length; i += 2) {
                            const optionLetter = optionParts[i];
                            const optionText = optionParts[i+1].trim();
                            options[optionLetter] = optionText;
                        }
                        
                        questions.push({
                            num: questionNum,
                            options: options
                        });
                    }
                });

                // 解析答案
                const answerPairs = answersText.split(/\s+/);
                const answers = {};
                
                answerPairs.forEach(pair => {
                    const match = pair.match(/^(\d+)\.([A-Z])$/);
                    if (match) {
                        answers[match[1]] = match[2];
                    }
                });

                // 生成结果
                resultTableBody.innerHTML = '';
                excelData = [];
                
                questions.forEach(q => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    
                    const numCell = document.createElement('td');
                    numCell.className = 'p-3 text-gray-700';
                    numCell.textContent = q.num;
                    
                    const optionsCell = document.createElement('td');
                    optionsCell.className = 'p-3 text-gray-700';
                    optionsCell.textContent = JSON.stringify(q.options);
                    
                    const answerCell = document.createElement('td');
                    answerCell.className = 'p-3 text-gray-700 font-semibold';
                    answerCell.textContent = answers[q.num] || '未找到答案';
                    
                    row.appendChild(numCell);
                    row.appendChild(optionsCell);
                    row.appendChild(answerCell);
                    resultTableBody.appendChild(row);
                    
                    // 准备Excel数据
                    excelData.push({
                        '题号': q.num,
                        '选项JSON': JSON.stringify(q.options),
                        '答案': answers[q.num] || '未找到答案'
                    });
                });
                
                resultSection.classList.remove('hidden');
            });

            downloadBtn.addEventListener('click', function() {
                if (excelData.length === 0) {
                    alert('没有可下载的数据');
                    return;
                }
                
                // 创建工作表
                const ws = XLSX.utils.json_to_sheet(excelData);
                
                // 创建工作簿
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "完形填空数据");
                
                // 生成Excel文件并下载
                XLSX.writeFile(wb, "完形填空转换结果.xlsx");
            });
        });
    </script>

</body></html>
