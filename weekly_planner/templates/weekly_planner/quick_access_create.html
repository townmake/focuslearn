{% extends "base.html" %}
{% load static %}

{% block title %}创建便捷记录{% endblock %}

{% block content %}

<div class="ant-page-container">
    <form method="post" enctype="multipart/form-data" class="ant-form">
        {% csrf_token %}
        <div class="ant-form-item">
            <label class="ant-form-label">详情描述</label>
            <div id="editor-ex-content" style="width:100%; max-width:1200px;height:fit-content; min-height: 345px;border:1px solid #ddd; border-radius:4px;"frameborder="0">
            </div>
        </div>
        <input type="hidden" id="description" name="description"> 
        
        <div class="ant-form-item">
            <label class="ant-form-label">标题</label>
            {{ form.title }}
        </div>
        
        <div class="ant-form-item" style="max-width: 100%;">
            <label class="ant-form-label">位置序号</label>
            <div class="content-and-tips" style="width: 100%;">
                {{ form.position }}
                <div class="ant-form-text">数字越小排序越前</div>
            </div>
        </div>
        
        <div class="ant-form-item">
            <label class="ant-form-label">图标</label>
            <div class="content-and-tips" style="width: 100%;">
                {{ form.icon }}
                <div class="ant-image-preview">
                    <div class="ant-image-default">
                        <!-- <span>默认图标：</span> -->
                        <img id="defaultIcon" src="/static/images/create_default.png" alt="默认图标" style="width: 64px; display: none;">
                    </div>
                    <div id="newIconPreview" class="ant-image-new" style="display:none;">
                        <span >新图标预览：</span>
                        <img id="previewImage" src="#" alt="新图标预览">
                    </div>
                </div>
                <div class="ant-form-text">上传新图标将替换默认图标 (建议尺寸: 100x100像素)</div>
            </div>
        </div>

        
        <div class="ant-form-item">
            <label class="ant-form-label">跳转链接</label>
            {{ form.link }}
        </div>
        

        <div class="ant-form-actions">
            <a href="{% url 'weekly_planner:quick_access_list' %}" class="ant-btn ant-btn-default">取消</a>
            <button type="submit" class="ant-btn ant-btn-primary">保存</button>
        </div>
    </form>
</div>
<link rel="stylesheet" href="/static/aieditor-main/dist/style.css">
<script src="{% static 'js/dropzone.min.js' %}"></script>
<script type="module">
import { AiEditor } from '/static/aieditor-main/dist/index.js';

window.editorContent = new AiEditor({
    element: '#editor-ex-content',
    placeholder: '开始输入题目内容...',
    theme: 'default',
    onCreated: (editor) => {
        editor.setEditable(true);
    },
    onChange: (editor) => {
        document.getElementById('description').value = editor.getHtml();
    }
});
</script>

<style>
.ant-page-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 5px;
    background: #f6f7f7;
}

.ant-page-title {
    margin-bottom: 24px;
    color: rgba(0,0,0,0.85);
    font-size: 20px;
    font-weight: 500;
}

.ant-form {
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.ant-form-item {
    margin-bottom: 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
}

.ant-form-label {
    margin-right: 16px; /* 添加右外边距 */
    width: 100px; /* 设置标签宽度 */
    display: inline-block; /* 可选：确保标签是行内块级元素 */
    color: rgba(0,0,0,0.85);
}
.content-and-tips{
    flex: 1; /* 让内容区域占据剩余空间 */
    position: relative; /* 为了定位提示文本 */
}
.ant-form-text {
    margin-top: 2px;
    color: rgba(0,0,0,0.45);
    font-size: 14px;
}

.ant-image-preview {
    margin-top: 16px;
}

.ant-image-current, .ant-image-new {
    margin-bottom: 16px;
    text-align: left;
}

.ant-image-current span, .ant-image-new span {
    display: block;
    margin-bottom: 8px;
    color: rgba(0,0,0,0.45);
}

.ant-image-current img, .ant-image-new img {
    max-height: 100px;
    border-radius: 4px;
    border: 1px solid #d9d9d9;
    display: block;
}

.ant-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
}

.ant-btn {
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    font-size: 14px;
}

.ant-btn-default {
    border: 1px solid #d9d9d9;
    color: rgba(0,0,0,0.65);
    background: #fff;
}

.ant-btn-primary {
    background: #1890ff;
    color: white;
    border: none;
}

/* Form field styling */
input, textarea, select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    font-size: 14px;
}

input:focus, textarea:focus, select:focus {
    border-color: #1890ff;
    outline: none;
    box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
}
</style>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('id_icon').addEventListener('change', function(e) {
    const preview = document.getElementById('newIconPreview');
    const previewImage = document.getElementById('previewImage');
    const defaultIcon = document.getElementById('defaultIcon');
    const file = e.target.files[0];
    
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.style.display = 'block';
            defaultIcon.style.display = 'none';
            previewImage.src = e.target.result;
        }
        reader.readAsDataURL(file);
    } else {
        preview.style.display = 'none';
        defaultIcon.style.display = 'block';
    }
});

// 表单提交前处理
document.querySelector('form').addEventListener('submit', function(e) {
    const fileInput = document.getElementById('id_icon');
    if (!fileInput.files.length) {
        // 当没有选择文件时，添加隐藏字段传递默认图标路径
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'use_default_icon';
        hiddenInput.value = 'true';
        this.appendChild(hiddenInput);
    }
});
</script>
{% endblock %}
