                    <div><strong>章节：</strong> <span id="taskChapter"></span>
                                                <span id="taskChapterID" style="display: none;"></span></div>
                    <div><strong>时间：</strong> <span id="taskTime"></span></div>
                    <div id="descriptionRow" style="display: none;"><strong>描述：</strong> <span id="taskDescription"></span></div>

                            <div class="progress-label">

                            </div>
                        </div>
                        <div class="col-6 ps-2">
                            <div class="progress-label">

                            </div>

                    <button type="button" id="deleteTaskBtn" class="btn btn-danger">删除</button>
                </div>
                <div>

                    <button type="button" id="editTaskBtn" class="btn btn-primary">编辑</button>

<script>
// 获取Cookie函数
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 计算文字颜色函数 - 根据背景色计算最佳文字颜色（黑或白）
function getContrastYIQ(hexcolor) {
    // 如果没有提供颜色或格式不正确，返回默认黑色
    if (!hexcolor || !hexcolor.startsWith('#') || hexcolor.length !== 7) {
        return '#000000';
    }
    
    // 去掉#号并转换为RGB
    hexcolor = hexcolor.substring(1);
    const r = parseInt(hexcolor.substr(0, 2), 16);
    const g = parseInt(hexcolor.substr(2, 2), 16);
    const b = parseInt(hexcolor.substr(4, 2), 16);
    
    // 计算YIQ值 - 用于确定颜色的亮度
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    
    // 如果背景色较亮返回黑色文字，否则返回白色文字
    return (yiq >= 128) ? '#000000' : '#ffffff';
}

    document.addEventListener('DOMContentLoaded', function() {
    // 初始化模态框
    const taskDetailsModal = new bootstrap.Modal(document.getElementById('taskDetailsModal'));
    const taskFormModal = new bootstrap.Modal(document.getElementById('taskFormModal'));
    const studyRecordDetailsModal = new bootstrap.Modal(document.getElementById('studyRecordDetailsModal'));
    
    // 获取CSRF Token
    const csrftoken = getCookie('csrftoken');
    
    // 加载科目列表
    loadSubjects();
    
    // 监听科目变化，更新章节列表
    document.getElementById('subject').addEventListener('change', function() {
        loadChapters(this.value);
    });
    
    // 监听专注力和体力滑块变化
    document.getElementById('focusLevel').addEventListener('input', function() {
        document.getElementById('focusLevelValue').textContent = this.value;
    });
    
    document.getElementById('energyLevel').addEventListener('input', function() {
        document.getElementById('energyLevelValue').textContent = this.value;
    });

    // 监听重复类型变化
    document.getElementById('repeatType').addEventListener('change', function() {
        document.getElementById('repeatType').value = this.value;
    })

    
    // 监听重复类型变化
    document.getElementById('repeatType').addEventListener('change', function() {
        const repeatOptions = document.getElementById('repeatOptions');
        const repeatEnds = document.getElementById('repeatEnds');
        
        if (this.value !== 'none') {
            repeatOptions.style.display = 'block';
        } else {
            repeatOptions.style.display = 'none';
            repeatEnds.value = ''; // 清空结束日期
        }
    });

    // 监听模态框关闭事件，重置重复选项
    document.getElementById('taskFormModal').addEventListener('hidden.bs.modal', function () {
        const repeatType = document.getElementById('repeatType');
        const repeatOptions = document.getElementById('repeatOptions');
        const repeatEnds = document.getElementById('repeatEnds');

        // 重置为不重复
        repeatType.value = 'none';
        repeatOptions.style.display = 'none';
        repeatEnds.value = ''; // 清空结束日期
    });
    
    // 设置时间选择器的默认值和限制
    function initializeTimeSelectors() {
        const startTimeSelect = document.getElementById('startDateTime');
        const endTimeSelect = document.getElementById('endDateTime');
        
        // 设置默认时间为当前时间（向上取整到最近的小时）
        const now = new Date();
        now.setMinutes(0);
        now.setHours(Math.max(6, Math.min(23, now.getHours())));
        
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:00`;
        
        startTimeSelect.value = timeStr;
        endTimeSelect.value = timeStr;
    }
    
    // 初始化时间选择器
    initializeTimeSelectors();
    
    // 初始化FullCalendar
    const calendarEl = document.getElementById('calendar');
    
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridDay', // 默认显示日视图
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'listWeek,timeGridDay,timeGridWeek,dayGridMonth' // 调整视图顺序为 list/日/周/月
        },
        views: {
            timeGridWeek: {
                slotMinTime: '06:00:00',
                slotMaxTime: '23:59:59',
                // contentHeight: 'auto',
                // allDaySlot: false,  // 隐藏全天区域
                slotLabelInterval: '01:00',  // 每小时显示一次标签
                slotDuration: '00:30:00',    // 30分钟一格
                // expandRows: true,   // 关键：强制填充高度
                // stickyHeaderDates: true  // 固定表头
            },
            timeGridDay: {
                slotMinTime: '06:00:00',
                slotMaxTime: '23:59:59',
                // contentHeight: 'auto',
                // allDaySlot: false,
                // expandRows: true
                slotLabelInterval: '01:00',  // 每小时显示一次标签
                slotDuration: '00:30:00',    // 30分钟一格
            },
                // 其他视图保持默认
            dayGridMonth: {},
            listWeek: {}
                

        },

        slotDuration: '00:30:00',
        navLinks: true,
        editable: true,
        dayMaxEvents: true,
        selectable: true,
        nowIndicator: true,
        locale: 'zh-cn',
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },
        /* 重叠时段：计划先排、记录后排，叠放时记录在上（与创建先后无关） */
        eventOrder: function (a, b) {
            const layer = (e) => (e.extendedProps && e.extendedProps.kind === 'study_record') ? 1 : 0;
            return layer(a) - layer(b);
        },

        // 获取事件数据：计划任务 + 学习记录（记录为夕阳金色，只读）
        events: function(info, successCallback, failureCallback) {
            const startDate = info.startStr.split('T')[0];
            const endDate = info.endStr.split('T')[0];
            const headers = {
                'X-CSRFToken': csrftoken,
                'Accept': 'application/json'
            };

            const tasksReq = fetch(`/planner/api/tasks/?start_date=${startDate}&end_date=${endDate}`, { headers })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            console.error('任务 API 错误:', text);
                            throw new Error(`HTTP error! status: ${response.status}`);
                        });
                    }
                    return response.json();
                });

            const recordsReq = fetch(`/planner/api/calendar-study-records/?start_date=${startDate}&end_date=${endDate}`, { headers })
                .then(response => {
                    if (!response.ok) {
                        console.warn('记录 API 不可用，仅显示计划');
                        return [];
                    }
                    return response.json();
                })
                .catch(err => {
                    console.warn('加载记录失败:', err);
                    return [];
                });

            Promise.all([tasksReq, recordsReq])
                .then(([data, records]) => {
                    const recordList = Array.isArray(records) ? records : [];
                    const sunsetGold = '#D4A574';
                    const sunsetBorder = '#B8894A';
                    const recordTextColor = getContrastYIQ(sunsetGold);

                    const taskEvents = data.map(task => {
                        const color = task.subject_color || '#3498db';
                        const textColor = getContrastYIQ(color);
                        return {
                            id: task.id,
                            title: task.title,
                            start: task.start,
                            end: task.end,
                            backgroundColor: color,
                            borderColor: color,
                            textColor: textColor,
                            description: task.description,
                            classNames: ['calendar-plan-task'].concat(task.is_completed ? ['task-completed'] : []),
                            extendedProps: {
                                kind: 'task',
                                subject_name: task.subject_name,
                                chapter_name: task.chapter_name,
                                focus_level: task.focus_level,
                                energy_level: task.energy_level,
                                is_completed: task.is_completed,
                                subject_id: task.subject,
                                chapter_id: task.chapter,
                                repeat_type: task.repeat_type,
                                repeat_ends: task.repeat_ends,
                            }
                        };
                    });

                    const recordEvents = recordList.map(r => ({
                        id: 'sr-' + r.id,
                        title: '「记录」' + (r.title || ''),
                        start: r.start,
                        end: r.end,
                        backgroundColor: sunsetGold,
                        borderColor: sunsetBorder,
                        textColor: recordTextColor,
                        classNames: ['calendar-study-record'],
                        editable: false,
                        startEditable: false,
                        durationEditable: false,
                        resourceEditable: false,
                        extendedProps: {
                            kind: 'study_record',
                            learning_content: r.learning_content,
                            description: r.description,
                            page_type_display: r.page_type_display,
                            subject_name: r.subject_name,
                            chapter_name: r.chapter_name,
                            chapter_id: r.chapter_id,
                            duration_display: r.duration_display,
                        }
                    }));

                    /* 先传计划、再传记录，DOM 中记录靠后更易叠在上层 */
                    successCallback(taskEvents.concat(recordEvents));
                })
                .catch(error => {
                    console.error('Error fetching events:', error);
                    alert(`获取日历数据失败: ${error.message}`);
                    failureCallback(error);
                });
        },

        // 事件拖拽更新（记录块不可拖拽）
        eventDrop: function(info) {
            if (info.event.extendedProps.kind === 'study_record') {
                info.revert();
                return;
            }
            const taskId = info.event.id;
            const taskStart = info.event.start;
            const taskEnd = info.event.end;
            console.log("info", info);
            updateTaskTimes(taskId, taskStart, taskEnd);
        },

        // 事件时长调整（记录块不可调）
        eventResize: function(info) {
            if (info.event.extendedProps.kind === 'study_record') {
                info.revert();
                return;
            }
            const taskId = info.event.id;
            const taskStart = info.event.start;
            const taskEnd = info.event.end;
            updateTaskTimes(taskId, taskStart, taskEnd);
        },

        // 选择时间段创建事件
    select: function(info) {
        // 清空表单
        document.getElementById('taskForm').reset();
        document.getElementById('taskId').value = '';
        document.getElementById('taskFormModalLabel').textContent = '创建任务';
        document.getElementById('repeatType').value = 'none';

        
        // 存储选中的日期，用于后续提交
        window.selectedDate = info.start.toISOString().split('T')[0];
        
        // 获取选中时间并格式化
        const startTime = formatDateTimeForInput(info.start);
        const endTime = formatDateTimeForInput(info.end);
        
        if (startTime && endTime) {
            // 设置开始和结束时间
            document.getElementById('startDateTime').value = startTime;
            document.getElementById('endDateTime').value = endTime;
            
            // 显示模态框
            taskFormModal.show();
        } else {
            console.error('Invalid time selection');
        }
    },
        
        // 点击事件处理
        eventClick: function(info) {
            const event = info.event;

            if (event.extendedProps.kind === 'study_record') {
                document.getElementById('recordPageTypeDisplay').textContent =
                    event.extendedProps.page_type_display || '—';
                document.getElementById('recordSubjectName').textContent =
                    event.extendedProps.subject_name || '—';
                document.getElementById('recordChapterName').textContent =
                    event.extendedProps.chapter_name || '—';
                document.getElementById('recordTimeRange').textContent =
                    formatDateTimeRange(event.start, event.end);
                document.getElementById('recordDurationDisplay').textContent =
                    event.extendedProps.duration_display || '—';
                document.getElementById('recordLearningContent').textContent =
                    event.extendedProps.learning_content || '（无）';

                const openBtn = document.getElementById('recordOpenChapterBtn');
                const cid = event.extendedProps.chapter_id;
                if (cid) {
                    openBtn.style.display = 'inline-block';
                    openBtn.onclick = function() {
                        window.location.href = '/courses/chapter/' + cid + '/detail/';
                    };
                } else {
                    openBtn.style.display = 'none';
                    openBtn.onclick = null;
                }
                studyRecordDetailsModal.show();
                return;
            }

            // 填充任务详情
            document.getElementById('taskTitle').textContent = event.title;
            document.getElementById('taskSubject').textContent = event.extendedProps.subject_name;
            document.getElementById('taskChapter').textContent = event.extendedProps.chapter_name;
            document.getElementById('taskChapterID').textContent = event.extendedProps.chapter_id;

    // 格式化日期时间为输入框格式
    function formatDateTimeForInput(date) {
        const d = new Date(date);
        
        // 获取小时和分钟
        let hours = d.getHours();
        let minutes = d.getMinutes();
        
        // 确保小时在6-24范围内
        hours = Math.max(6, Math.min(24, hours));
        
        // 处理特殊情况：24点只能是24:00
        if (hours === 24 && minutes > 0) {
            hours = 24;
            minutes = 0;
        }
        
        // 格式化输出
        const hoursStr = String(hours).padStart(2, '0');
        const minutesStr = String(minutes).padStart(2, '0');
        
        return `${hoursStr}:${minutesStr}`;
    }

    // 格式化日期时间范围为显示格式
    function formatDateTimeRange(start, end) {
        const startDate = new Date(start);
        const endDate = new Date(end);
        
        const options = { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        };
        
        // 如果是同一天，只显示一次日期
        if (startDate.toDateString() === endDate.toDateString()) {
            return `${startDate.toLocaleDateString('zh-CN', options)} - ${endDate.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false })}`;
        } else {
            return `${startDate.toLocaleDateString('zh-CN', options)} - ${endDate.toLocaleDateString('zh-CN', options)}`;
        }
    }

    // 将时间字符串转换为ISO格式
    function convertToISODateTime(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        
        // 获取当前日期作为默认日期
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        
        // 使用提供的日期或当前日期
        const finalDateStr = dateStr || `${year}-${month}-${day}`;
        
        // 解析时间
        const [hours, minutes] = timeStr.split(':').map(Number);
        
        // 创建新的日期对象
        const date = new Date(`${finalDateStr}T${timeStr}:00`);
        
        // 验证日期是否有效
        if (isNaN(date.getTime())) {
            throw new Error('Invalid date/time combination');
        }
        
        return date.toISOString();
    }
    
    // 根据背景色计算对比度最佳的文字颜色
    function getContrastYIQ(hexcolor) {
        // 移除 # 号（如果有）
        hexcolor = hexcolor.replace('#', '');
        
        // 转换为 RGB
        const r = parseInt(hexcolor.substr(0,2), 16);
        const g = parseInt(hexcolor.substr(2,2), 16);
        const b = parseInt(hexcolor.substr(4,2), 16);
        
        // 计算 YIQ 值
        const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
        
        // 根据 YIQ 值返回黑色或白色
        return (yiq >= 128) ? '#000000' : '#ffffff';
    }

    // 格式化日期时间为时间选择器格式
    function formatDateTimeForInput(date) {
        if (!date) return null;
        
        const d = new Date(date);
        if (isNaN(d.getTime())) return null;
        
        // 获取小时和分钟
        let hours = d.getHours();
        let minutes = d.getMinutes();
        
        // 确保小时在6-23范围内
        hours = Math.max(6, Math.min(23, hours));
        
        // 将分钟调整到最近的15分钟间隔
        minutes = Math.round(minutes / 15) * 15;
        
        // 处理特殊情况：如果分钟是60，调整为下一个小时的00分
        if (minutes === 60) {
            minutes = 0;
            hours = Math.min(23, hours + 1);
        }
        
        // 格式化输出
        const hoursStr = String(hours).padStart(2, '0');
        const minutesStr = String(minutes).padStart(2, '0');
        
        return `${hoursStr}:${minutesStr}`;
    }

            }
        // // 触发重复类型变化事件
        const changeEvent = new Event('change');
        document.getElementById('repeatType').dispatchEvent(changeEvent);      
        
        // 显示模态框
        taskFormModal.show();
    }
    
    // 格式化日期时间范围
    function formatDateTimeRange(start, end) {
        const startDate = new Date(start);
        const endDate = new Date(end);
        
        const formatOptions = {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        };
        
        return `${startDate.toLocaleString('zh-CN', formatOptions)} - ${endDate.toLocaleString('zh-CN', formatOptions)}`;
    }

    // 获取CSRF Token的辅助函数
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
