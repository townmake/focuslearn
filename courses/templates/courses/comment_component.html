
{% load static %}
{% block extra_css %}
    <!-- 引入AiEditor CSS -->
    <link rel="stylesheet" href="/static/aieditor-main/dist/style.css">
{% endblock %}
{% block extra_js %}

{% endblock %}

<div class="comment-section" id="comment-section">
    <h3>评论</h3>
    
    <!-- 评论表单 -->
    <div class="comment-form">
        <form id="comment-form" method="post" action="{% url 'courses:submit_comment' %}">
            {% csrf_token %}
            <input type="hidden" name="type" value="{{ comment_type }}">
            <input type="hidden" name="type_id" value="{{ type_id }}">
            
            <div class="form-group">
                <input type="text" id="comment-title" name="title" class="form-control" required placeholder="请输入标题">
            </div>

            <div class="form-group">
                <div class="mb-4" name="cont" id="ckeditor-comment" style="width:100%; max-width:1100px;height:fit-content; min-height: 400px;border:1px solid #ddd; border-radius:4px;"frameborder="0"></div>
                <textarea id="content" name="content" style="display:none;"></textarea>
            </div>

            <!-- 视频时间位置 默认隐藏 -->
            <div class="form-group" id="comment-position-group" style="display: none;">
                <label for="comment-position">视频时间位置 (HH:MM:SS)</label>
                <input type="text" id="comment-position" name="position" class="form-control" 
                       placeholder="00:00:00">
            </div>
            <input type="hidden" id="comment-content" name="content" value="">
            <button type="submit" class="btn btn-primary" onclick="prepareCommentSubmission(event)">提交评论</button>
        </form>
    </div>
    
    <!-- 评论列表容器 -->
    <div class="comment-list" id="comment-list-container">
        <!-- 评论将通过AJAX动态加载 -->
    </div>
</div>

<script type="module">
        
import { AiEditor } from '/static/aieditor-main/dist/index.js';

// 评论内容编辑器
window.editorComment = new AiEditor({
    element: '#ckeditor-comment',
    placeholder: '点击输入评论内容...',
    onChange: (editor) => {
        document.getElementById('content').value = editor.getHtml();
    }
});
</script>

<script>
const comment_type = '{{ comment_type }}';
const comment_type_id = '{{ type_id }}';


// 准备评论提交
function prepareCommentSubmission(e) {
    const titleInput = document.getElementById('comment-title');
    const positionInput = document.getElementById('comment-position');
    // 时间位置默认为00:00:00，若存在视频播放器则获取当前播放时间位置
    positionInput.value = '00:00:00';

    // 视频评论需要验证时间位置
    if (comment_type === 'videos') {
        const videoPlayer = document.getElementById('videoPlayer');
        if (videoPlayer) {
            const currentTime = videoPlayer.currentTime;
            const formattedTime = new Date(currentTime * 1000).toISOString().substr(11, 8);
            positionInput.value = formattedTime;
        }
    }

    e.preventDefault();
    const form = document.getElementById('comment-form');
    const contentInput = document.getElementById('content');



    // 设置请求参数
    const requestdata = {
        title:titleInput.value,
        content: contentInput.value,
        type:comment_type, 
        type_id: comment_type_id,
        position: positionInput.value,
    };
    // 使用fetch提交表单数据
    const formData = new FormData(form);
    fetch(form.action, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}', 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(requestdata)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('提交成功:', data);
            // 清空表单
            document.getElementById('comment-title').value = '';
            window.editorComment.setData('');
            // 重新加载评论列表
            if (typeof loadComments === 'function') {
                loadComments(1);
            }
        } else {
            alert(data.message || '提交失败');
        }
    })
    .catch(error => {
        console.error('提交出错:', error);
        alert('提交过程中发生错误');
    });
}


const container = document.getElementById('comment-list-container');

// 加载评论列表
function loadComments(page = 1) {
    fetch(`/courses/comments/?type=${comment_type}&type_id=${comment_type_id}&page=${page}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderComments(data.data.comments);
                renderPagination(data.data.pagination);
            }
        });
}

// 渲染评论列表
function renderComments(comments) {
    let html = '';
    if (comments.length === 0) {
        html = '<p>暂无评论</p>';
    } else {
        comments.forEach(comment => {
            html += `
            <div class="comment-item">
                <div class="comment-header">
                    <span class="comment-author">${comment.user.username}</span>
                    ${comment_type === 'videos' && comment.position ? `<span class="comment-position">@ ${comment.position}</span>` : ''}
                    <span class="comment-date">${comment.created_at}</span>
                </div>
                <h3 class="comment-title">${comment.title}</h3>
                <div class="comment-content">${comment.content}</div>
            </div>`;
        });
    }
    container.innerHTML = html;
}

// 渲染分页控件
function renderPagination(pagination) {
    // 这里可以添加分页控件逻辑
    console.log('分页信息:', pagination);
}

//加载评论
document.addEventListener('DOMContentLoaded', function() {
    // 初始加载第一页评论
    loadComments(1);
    // 初始化评论编辑器

    }
);



</script>
